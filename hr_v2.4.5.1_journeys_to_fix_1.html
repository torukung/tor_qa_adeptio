r;gap:8px\" -> class=\"row\"; style=\"display:flex;flex-direction:column;gap:16px\" -> class=\"col gap-4\"; style=\"margin-top:8px\" -> class=\"mt-2\"; style=\"margin-top:10px|12px\" -> class=\"mt-3\"; style=\"margin-top:16px\" -> class=\"mt-4\"; style=\"justify-content:flex-end\" -> add class=\"end\"; style=\"flex-wrap:wrap\" -> add class=\"wrap\"; style=\"width:100%\" -> class=\"fill\"; style=\"margin-left:auto\" -> class=\"push\". Target: 422 -> under 70.","functional_flag":false,"scope":"design-system"},"DA-DS-22":{"id":"DA-DS-22","phase":2,"dimension":"typography","screen":"all screens; clearest on hr/web/sched-control and sysadmin/web/database","wrong":"The uppercase micro-label is the most repeated element in the product and it has no single definition: six letter-spacing values (.02em, .05em, .06em, .08em, .1em, .13em, .14em, .16em), five sizes (9.5, 9.8, 10.5, 10.8, 11px) and three weights (600, 700, 800) across .eyebrow (app.css:46-48), .logo-sub (:77), .hub-card .who (:146), .kpi .k-label (:281), .tbl th (:324), .ro-chip (:402), .lp-l (:704), .seed-grid b (:717), .inbox-totlbl (:902), .qv-l (schedule.css:25), .cdc-dow (schedule.css:81) and .cal-dows span (schedule.css:33). On hr/web/sched-control five of them appear within 400px of each other — SHIFT PERIOD, SHIFT GROUP · DIVISION & PEOPLE, ADMIN, PRODUCTION, CAP 4 — at four different sizes.","should":"One .eyebrow definition — var(--fs-micro) 11px / var(--w-med) 600 / letter-spacing .1em / var(--muted) — with exactly two modifiers: .eyebrow.acc (accent colour, already exists at app.css:50) and .eyebrow.tight (.06em, for labels longer than 20 characters). Everything listed above composes it.","why":"Per ui-typography, all-caps must always be letterspaced and must never exceed a line — eight different letterspacings means most of these were set by eye, and the widest (.16em on .eyebrow, 11px) produces the launcher's two-line all-caps run 'ADEPTIO ADAPTIVE HR · BLUEPRINT V2.5 (ONE PLATFORM · ONE TRACK) → PLATFORM UI V2.4.5 (BIO · GATE · OT)' which is a 100-character uppercase paragraph — the exact thing the rule forbids.","impl_note":"Rewrite app.css:46-49 to '.eyebrow{font-size:var(--fs-micro);font-weight:var(--w-med);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}' and add '.eyebrow.tight{letter-spacing:.06em}'. Then delete the per-rule typography from app.css:77, 146, 281, 324, 402, 704, 717, 902 and schedule.css:25, 33, 81 and add class=\"eyebrow\" (plus .acc where accented) in the emitting JS/CSS. Separately, shorten the launcher eyebrow string in js/screens/authviews.js to sentence case under 40 characters — an all-caps string that wraps is a content fix, not a CSS one.","functional_flag":true,"scope":"design-system"},"DA-DS-23":{"id":"DA-DS-23","phase":2,"dimension":"components","screen":"staff/web/home; every screen with a record picker (hr/web/person, manager/web/member, sysadmin/web/device)","wrong":"The record picker is a bare browser <select> with no .input class — on staff/web/home it renders ~400px wide at 30px tall with a 4px system radius and the system UI font, sitting directly beside a 37px-tall .btn with a 10px radius and var(--font). app.css:432 styles 'select.input' but the select is emitted without the class, so nothing applies. The result is the only unstyled control in the entire product, and it sits in the screen-head action slot where the eye lands first.","should":"Every select carries .input, gaining the same 1px --line border, 12px radius, --fs-sm type, --surface background and --ring focus state as text inputs, with a custom chevron so the control height matches the adjacent button.","why":"One unstyled native control undoes the impression of a designed system more effectively than twenty small inconsistencies, because it is unambiguously an omission rather than a choice.","impl_note":"Add class=\"input\" to the <select> in js/screens/staff.js (person picker), js/screens/hr.js, js/screens/manager.js and js/screens/sysadmin.js. Then extend app.css:432 with 'select.input{appearance:none;padding-right:32px;background-image:url(\"data:image/svg+xml,...chevron...\");background-repeat:no-repeat;background-position:right 10px center;background-size:14px}' and add 'select.input{height:37px}' so it matches .btn height exactly.","functional_flag":true,"scope":"design-system"},"DA-DS-24":{"id":"DA-DS-24","phase":2,"dimension":"components","screen":"ceo/web/board; sysadmin/web/identity; all screens using .ro-chip or .btn.xs","wrong":"Two component-identity collisions. (1) .ro-chip (app.css:401-405) is a non-interactive status label but has a border, a tinted background, a pill radius, an icon and 10.5px/800 caps — on ceo/web/board 'READ-ONLY' sits in the action row beside 'Export board pack' and is indistinguishable from a button; it is the first thing in the primary-action slot on every CEO screen. (2) Destructive actions have no visual identity: on sysadmin/web/identity 'Revoke' is .btn.xs ghost, pixel-identical to the adjacent 'Force reset', producing 22 equal-weight buttons in one column — and .btn.danger (app.css:423) exists but is never used.","should":"Status chips must never live in an action row and must lose the button affordances (no border, no icon, --fs-micro, --muted-2 text on --line-2) — .ro-chip moves next to the screen title as a .badge.plain. Destructive actions always use .btn.danger, which should carry a visible --bad-text label and a --bad border on hover so it reads as different before it is clicked.","why":"If a label looks like a button, users click it; if a destructive button looks like a benign one, users click it by accident. Both are the same failure — component form not matching component function.","impl_note":"app.css:401-405 .ro-chip -> 'display:inline-flex;align-items:center;gap:var(--sp-1);font-size:var(--fs-micro);font-weight:var(--w-med);letter-spacing:.1em;text-transform:uppercase;color:var(--ceo-d);background:var(--ceo-bg);border:0;border-radius:var(--r-pill);padding:3px 10px' (drop the border and the icon) and move its emission in js/screens/ceo.js from .screen-head .actions into .screen-head h1's row. In js/screens/sysadmin.js change every 'Revoke' / 'Delete' / 'Force reset' destructive button from class=\"btn xs\" to class=\"btn xs danger\", and update app.css:423 to '.btn.danger{background:var(--surface);border-color:var(--line);color:var(--bad-text)}'.","functional_flag":true,"scope":"design-system"},"DA-DS-25":{"id":"DA-DS-25","phase":2,"dimension":"typography","screen":"all screens with prose (screen-head sub, launcher lede, empty states)","wrong":"The two prose surfaces break the 45-90 character line-length rule in opposite directions. .screen-head .sub (app.css:236) is 13px with max-width:640px, which is ~95 characters — over the ceiling, and it renders as a 2-line block on nearly every screen. .launcher .lede (app.css:131) is 16.5px/1.65 with max-width:620px, which is ~72 characters and correct — but the same lede at 390px has no padding floor of its own and runs to the viewport edge minus the launcher's clamp(18px,3.4vw,32px), giving 16px gutters at the narrowest width. Meanwhile body line-height is 1.55 (app.css:27) applied uniformly to 11px labels and 16.5px prose alike.","should":"max-width:56ch on .screen-head .sub at var(--fs-md) 15px (about 62 characters), .launcher .lede kept at 620px, and line-height split: 1.55 for prose (13px+), 1.35 for UI chrome and labels (11-12px), 1.15 for headings — which app.css:31 already does for h1-h4 via the display stack but not for the 20px .screen-title (app.css:502, inheriting 1.55).","why":"Line length is the single largest readability lever and the one most often lost in responsive layouts; a 95-character description under every screen title is the app's most-repeated block of prose.","impl_note":"app.css:236 font-size:13px; max-width:640px -> font-size:var(--fs-md); max-width:56ch; line-height:1.5. Add after app.css:31: '.eyebrow,.badge,.idtag,.tbl th,.k-label,.tab,.crumbs{line-height:1.35}'. app.css:502 .screen-title add line-height:1.2. app.css:131 keep 620px but change font-size:16.5px -> var(--fs-lg).","functional_flag":false,"scope":"design-system"},"DA-DS-26":{"id":"DA-DS-26","phase":3,"dimension":"empty states","screen":"all screens (173 tables, 0 rendered empty)","wrong":"The system ships exactly one empty-state component (.empty, app.css:394-398: a 30px icon at opacity .4, a 13px title and a 12px subline, all inside --muted) and it is essentially untested — 0 of 173 tables render with zero rows because the demo data is dense, while 239 em-dash / 'no data' placeholders sit inside otherwise-populated rows. There is no empty state for a filtered result, no distinction between 'nothing yet' and 'nothing matches', and the component has no action slot, so an empty table offers no way out of the state.","should":"Three documented empty variants sharing one .empty shell: .empty.first-run (icon + title + one-line explanation + a primary .btn), .empty.filtered (title + 'Clear filters' ghost button, no icon), .empty.error (see DA-DS-28). The 239 in-row em-dashes become a single .nil span at --muted-2 so 'absent' is visually distinct from 'zero'.","why":"Every one of these screens will be empty on day one of a real tenant. An HR console whose first impression is a blank table with a grey dash teaches the user that the product is broken before they have entered any data.","impl_note":"Extend app.css:394-398: '.empty{text-align:center;padding:var(--sp-6) var(--sp-5);color:var(--muted)}.empty .et{font-size:var(--fs-md);font-weight:var(--w-med);color:var(--ink-2)}.empty .es{font-size:var(--fs-sm);margin-top:var(--sp-1);max-width:44ch;margin-inline:auto}.empty .ea{margin-top:var(--sp-4)}.empty.filtered svg{display:none}'. Add '.nil{color:var(--muted-2);font-variant-numeric:tabular-nums}' and have js/ui.js emit <span class=\"nil\">—</span> for absent values. Then give every table render path in js/screens an empty branch calling UI.empty({variant,title,sub,action}).","functional_flag":true,"scope":"design-system"},"DA-DS-27":{"id":"DA-DS-27","phase":3,"dimension":"loading states","screen":"all screens","wrong":"There is no loading state anywhere in the system — no skeleton class, no spinner, no aria-busy convention, and no shimmer keyframes in either stylesheet. The only motion tokens are --ease and --t (160ms), and the only animation is the one-shot .screen-fade container fade (app.css:223-226). Every screen therefore goes from nothing to fully populated, which is invisible on local demo data and will be a blank card on a real network.","should":"One .skel utility — a --line-2 block at var(--r-sm) with a 1.2s linear-gradient sweep, honouring prefers-reduced-motion — plus a documented rule that any card whose content is fetched renders .skel rows at the same height as the real rows, so the layout does not jump.","why":"Skeletons are the cheapest way to make an app feel fast, and their absence is what makes an otherwise polished console feel like a prototype the moment latency appears.","impl_note":"Add to app.css section 08: '@keyframes skel{to{background-position:-200% 0}} .skel{background:linear-gradient(90deg,var(--line-2) 0%,var(--surface-2) 50%,var(--line-2) 100%);background-size:200% 100%;animation:skel 1.2s linear infinite;border-radius:var(--r-sm);color:transparent;user-select:none} .skel.line{height:1em} .skel.row{height:40px;margin-bottom:var(--sp-2)}' — the existing app.css:53-55 prefers-reduced-motion block already neutralises it. Add tokens --t-slow:320ms var(--ease) for enter/exit so the three ad-hoc .22s/.25s durations at app.css:66,138,143 become tokens too.","functional_flag":false,"scope":"design-system"},"DA-DS-28":{"id":"DA-DS-28","phase":3,"dimension":"error states","screen":"all screens","wrong":"The only error surface in the product is the toast (app.css:585-592): a --ink pill with a --bad or --warn icon, auto-dismissing, bottom-anchored. There is no inline field error (the .field component at app.css:429-431 has a label and a .hint but no error variant and no aria-describedby), no form-level error banner outside the sign-in wall's one-off .lg-note (app.css:675), and no destructive-confirm pattern. 285 of 566 visible inputs also have no label, aria-label or placeholder at all, so a validation error would have nothing to attach itself to.","should":"Three error surfaces: .field.invalid (the input gains a --bad border and --ring-bad, .hint becomes --bad-text and gains role=\"alert\"), a .notice component generalised from .lg-note with .notice.bad / .warn / .ok variants for form-level and page-level messages, and the toast reserved for transient confirmations only.","why":"An auto-dismissing toast is the worst possible carrier for an error the user must act on — it is gone before it is read, and it is 900px away from the field that caused it. In a payroll and approvals console that is a correctness risk, not just a polish one.","impl_note":"Add after app.css:438: '.field.invalid .input{border-color:var(--bad);box-shadow:var(--ring-bad)} .field.invalid .hint{color:var(--bad-text);font-weight:var(--w-med)}' and tokens.css '--ring-bad:0 0 0 3px var(--bad-bg)'. Generalise app.css:675 .lg-note into '.notice{display:flex;gap:var(--sp-2);align-items:flex-start;border-radius:var(--r-sm);padding:var(--sp-2) var(--sp-3);font-size:var(--fs-xs);font-weight:var(--w-med);margin-bottom:var(--sp-3)} .notice.bad{background:var(--bad-bg);color:var(--bad-text)} .notice.warn{background:var(--warn-bg);color:var(--warn-text)} .notice.ok{background:var(--ok-bg);color:var(--ok-text)}' and repoint .lg-note to it. Separately, every .input emitted in js/screens needs an id and its .field label a for= — 285 missing.","functional_flag":true,"scope":"design-system"},"DA-STAFF-01":{"id":"DA-STAFF-01","phase":1,"dimension":"iconography","screen":"staff/web/me","wrong":"In the 'Profile — General · Personal · Job' card the three section icons render at ~250×250px at 1440 and ~240px at 1024 — roughly 300× their intended area. UI.icon() emits an <svg> with no width/height attributes, and its container `div.strong.small` has no `svg{}` sizing rule (app.css only sizes svg inside .btn, .choice, .card-head .t, .rowitem .ric, .tab, .seg, .app-head). The three glyphs occupy 300px of vertical space above the data they label.","should":"14px inline icons on the section label baseline, tinted var(--acc-d), matching .card-head .t svg (15px) — the section heading should read as a heading, not as an illustration.","why":"It is the single loudest element in the entire staff scope and it carries zero information; it pushes the user's actual profile fields below the fold and makes the most-visited account screen look broken.","impl_note":"app.css — add next to `.card-head .t svg` (line 274): `.strong.small svg{ width:14px; height:14px; flex:none; vertical-align:-2px; color:var(--acc-d); }` and, as a defence against the same class of bug, `.card svg:not([width]){ max-width:1.25em; max-height:1.25em; }` is NOT sufficient — the explicit rule is required. Note the same `class=\"strong small\"`+icon() pattern exists in sysadmin.js:332 and schedule.js:432, so the one rule fixes all three.","functional_flag":false,"scope":"staff"},"DA-STAFF-02":{"id":"DA-STAFF-02","phase":1,"dimension":"color","screen":"all staff screens","wrong":"`.btn` primary is `background:var(--acc); color:#fff`. On body[data-persona=staff] --acc is #C28A4A, so every primary button renders white-on-ochre at **2.99:1** at 12.8px (`.btn.sm` 12px, `.btn.xs` 11.3px) — far below 4.5:1. Measured on 'New request', 'Submit request', 'Request advance', 'Request swap', 'Acknowledge', 'Generate now', the rail count chip and `.heatcal .hc.l3`.","should":"White on var(--acc-d) (#7E5722) = 6.42:1, with var(--acc) kept for the hover/active fill and for non-text surfaces.","why":"The primary button is the one control the employee must find on every screen; at 2.99:1 its label is the least legible text on the page, and the fill is the same ochre as the page chrome, so the CTA loses both contrast and separation at once.","impl_note":"app.css .btn: `border-color:var(--acc)` → `var(--acc-d)`, `background:var(--acc)` → `var(--acc-d)`; add `.btn:hover{ background:var(--acc); filter:none; }` replacing the current `filter:brightness(.94)`. app.css:415 `.btn:not(.ghost):not(.danger):hover{box-shadow:0 6px 16px -8px var(--acc)}` keeps var(--acc). Same change fixes `.nav-item .count` (app.css rail count chip) — set its background to var(--acc-d). Persona-wide: --mgr 3.22:1, --hr 3.36:1, --sys 3.55:1, --ceo 3.72:1 all fail too, staff is simply the worst; the synthesiser should promote this to the design system.","functional_flag":false,"scope":"staff"},"DA-STAFF-03":{"id":"DA-STAFF-03","phase":1,"dimension":"color","screen":"all staff screens","wrong":"--warn (#C28A4A / bg #F4E8D6 / text #8F6020) and --staff (#C28A4A / bg #F4E8D6 / d #7E5722) are the **same hex**. On the staff persona `.badge.warn` ('Pending', 'Expiring', 'Draft', 'Late') and `.badge.acc` ('OT +2h', 'Read-only', 'Import') are the same chip — identical background #F4E8D6, text differing only by #8F6020 vs #7E5722 (ΔE ≈ 3). On staff/web/documents the amber 'Expiring' chip is indistinguishable from the ochre 'Acknowledge' primary button sitting beside it.","should":"On the staff persona the warning channel must leave the accent hue. Either resolve `.badge.warn` against a dedicated non-ochre warning ramp, or give `.badge.warn` a 1px `var(--warn-text)` border + the status dot at full opacity so the shape channel carries the meaning that hue cannot.","why":"Staff is the only persona where 'this needs attention' and 'this is our brand' are the same colour. Every request the employee files comes back as a Pending chip — the one status they check most is the one status that disappears into the chrome.","impl_note":"app.css — add a persona override: `body[data-persona=\"staff\"] .badge.warn{ background:var(--surface); border:1px solid var(--warn-text); color:var(--warn-text); }` and `body[data-persona=\"staff\"] .badge.warn::before{ opacity:1; }`, leaving `.badge.acc` as the flat tint. Do not re-hue --warn globally (the other four personas rely on the amber/accent separation already working).","functional_flag":false,"scope":"staff"},"DA-STAFF-04":{"id":"DA-STAFF-04","phase":1,"dimension":"responsiveness","screen":"staff/mobile/sched-me, staff/mobile/requests, staff/mobile/home","wrong":"`.rowitem .rt` and `.rs` are `white-space:nowrap; text-overflow:ellipsis` and lose to a `flex:none` `.rside` badge. Inside the 330px phone frame the main column collapses to 116–153px: sched-me titles measure 180px in a 116px box and sublines 218px in 116px (47% visible) — '2026-06-08 · Lin…'; requests titles 132px→126px, sublines 191px→126px — 'Annual leave · 2 d…', 'LV-0481 · Jun 18 – 19…'; home sublines 183px→153px.","should":"Inside `.app-body` the row title wraps to two lines and the status badge moves below the subline (or the row becomes a two-line stack with the badge inline after the subline). Nothing that identifies the record — shift time, request type, dates, request ID — may be ellipsised on the phone.","why":"A shift row whose shift time is cut and a request row whose dates are cut carry no information at all; this is the staff persona's core list pattern and it is broken on the device the staff persona lives on.","impl_note":"app.css — add inside the mobile frame scope: `.app-body .rowitem{ align-items:flex-start; flex-wrap:wrap; }` · `.app-body .rowitem .rt{ white-space:normal; overflow:visible; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }` · `.app-body .rowitem .rs{ white-space:normal; overflow:visible; }` · `.app-body .rowitem .rside{ flex:0 0 100%; margin-left:47px; margin-top:4px; justify-content:flex-start; text-align:left; }` (47px = .ric 34px + gap 13px).","functional_flag":false,"scope":"staff"},"DA-STAFF-05":{"id":"DA-STAFF-05","phase":1,"dimension":"accessibility","screen":"staff/web/home, staff/web/time, staff/mobile/home, staff/mobile/time","wrong":"`.clock-hero` paints white text at reduced opacity on a `linear-gradient(150deg, var(--acc) 0%, var(--acc-d) 115%)`. `.ch-sub` ('Clocked in · 08:30') is 11.5px at `opacity:.82` over the #C28A4A end of the ramp = **2.53:1**; `.geo` ('Biometric (face / finger) · Main gate (DEV-ZK01)') is 10.5px at `opacity:.85` = 2.6–4.3:1 depending on gradient position. The harness never measured these — it skipped gradient backgrounds.","should":"Darken the ramp so the whole hero sits on --acc-d or darker, and run both support lines at full opacity: --acc-d gives 6.42:1 for white, ~5.9:1 for rgba(255,255,255,.95).","why":"These two lines are the only confirmation the employee gets that the clock-in actually registered and which device captured it. They are the payload of the hero and they are the least legible text in it.","impl_note":"app.css .clock-hero: `background:linear-gradient(150deg, var(--acc) 0%, var(--acc-d) 115%)` → `linear-gradient(150deg, var(--acc-d) 0%, color-mix(in srgb, var(--acc-d) 72%, #000) 115%)`. `.clock-hero .ch-sub{ opacity:.82 }` → `opacity:1; color:rgba(255,255,255,.92)`. `.clock-hero .geo{ opacity:.85 }` → `opacity:1; color:rgba(255,255,255,.90)`. `.ch-btn` keeps `background:rgba(255,255,255,.95); color:var(--acc-d)` — that pairing gains contrast against the darker field.","functional_flag":false,"scope":"staff"},"DA-STAFF-06":{"id":"DA-STAFF-06","phase":1,"dimension":"hierarchy","screen":"staff/web/sched-me","wrong":"The employee's own read-only schedule opens with five 32px KPI tiles — 32 TOTAL STAFF · 30 ACTIVE · 1 LEAVE · 30 AVAILABLE · 0 ON SHIFT — that describe the whole site roster. Not one of the five numbers is about the viewer. They consume the entire first 120px of content and, at 1024, reflow 3+2 leaving an orphan hole in the last row.","should":"Replace the roster strip with the viewer's own facts — next shift (date · line · start–end), shifts this month, hours rostered, swap requests open — or drop the strip entirely and let the month grid start at the fold.","why":"Visual weight is inverted against functional importance: the largest numerals on a personal schedule belong to a manager's capacity view, and the three shifts the employee actually has are 12.8px chips 400px further down.","impl_note":"schedule.js SCHEDVIEWS.myschedule — the KPI strip is shared with the manager roster view; gate it on the caller: render the roster KPIs only when `opts.canEdit`, and for the staff lens emit a single `.card` with `kpi('Next shift', …, hero:1)` plus two `.rowitem`s. Visual-only reordering of components that already exist; no new data.","functional_flag":false,"scope":"staff"},"DA-STAFF-07":{"id":"DA-STAFF-07","phase":1,"dimension":"accessibility","screen":"staff/web/sched-me, staff/web/home, staff/web/time, staff/mobile/time","wrong":"Every calendar the staff persona sees labels its columns in --muted-2 (#AFABA1): `.cal-dows span` is 10px at **2.03:1** on --canvas (the worst ratio in the staff scope) and `.heatcal .dow` is 9px at **2.29:1** on white. In the 1440 shot of My schedule the MON–SUN row is effectively absent; on My day the M T W T F S S row is invisible.","should":"--ink-2 (#4A4954, 8.6:1) at 10.5px/700 for weekday headers; --muted-2 is a hairline/ornament token and must never carry a label the user has to read.","why":"Without a legible weekday row a month grid is an unordered block of numbers — the employee cannot tell a Saturday shift from a Tuesday one, which is the only question a personal roster answers.","impl_note":"schedule.css:33 `.cal-dows span{ color:var(--muted-2) }` → `color:var(--ink-2)`; bump `font-size:10px` → `10.5px`. app.css:392 `.heatcal .dow{ color:var(--muted-2); font-size:9px }` → `color:var(--ink-2); font-size:10px`. schedule.css:48 `.cal-day.muted .cd-num{ color:var(--muted-2) }` → `var(--muted)` (out-of-month numerals stay quiet but readable).","functional_flag":false,"scope":"staff"},"DA-STAFF-08":{"id":"DA-STAFF-08","phase":1,"dimension":"hierarchy","screen":"staff/web/home, staff/web/time, staff/web/me, staff/web/payslips, staff/web/reports","wrong":"12 of the 17 staff web screens present no primary action above the fold (aboveFoldPrimary averages 0.29). On My day, Time and My profile the screen CTA is `.btn.soft` (ochre tint, no fill), and on My day / Payslips / My reports it is preceded in the actions slot by the demo acting-user `<select class=\"input sm staff-pick\">`, which renders 400px wide at 1440 and stacks above a 134px CTA at 1024 — the widest, heaviest control on the page is the demo scaffolding.","should":"One filled `.btn` per screen ('New request', 'Request correction', 'Request change'), and the acting-user picker demoted to a 200px `.input.sm` placed after the CTA, or moved out of `actions` into the Me sidebar where it already exists as `userPickerCard()`.","why":"The employee arrives with one intent — clock, file something, check pay. When the CTA is a tint and the demo control is a 400px native select, the eye lands on the wrong element on the two most-visited screens.","impl_note":"staff.js:119 `class=\"btn soft\"` → `class=\"btn\"` on home 'New request'; staff.js:156 same for 'Request correction'; staff.js:479 same for 'Request change'. staff.js:16 `class=\"input sm staff-pick\"` → add `style` removal and in app.css add `.staff-pick{ max-width:210px; }`. In staff.js:119/325/453 put the picker **after** the button in the actions string.","functional_flag":false,"scope":"staff"},"DA-STAFF-09":{"id":"DA-STAFF-09","phase":1,"dimension":"accessibility","screen":"all staff mobile routes","wrong":"Every interactive control inside the phone frame is below the 44×44 minimum: `.btn` computes to 34px tall (8.5px padding + 12.8px/1.2 + 2px border), `.choice` 33px (8px + 12.3px), `.input`/`select.input` 36px (9px + 13px), `.btn.xs` 25px, `.btn.sm` 29px. mobile/request-new@390 fails 21 of 26 sampled controls; sched-swaps 18/22; advance 16/20; home 17/25.","should":"Inside `.app-body`, `min-height:44px` on `.btn`, `.choice`, `.input`, `select.input` and `textarea.input`, with 8px minimum spacing between adjacent targets (`.choice-row` gap 8px already satisfies this).","why":"This is a shop-floor app used one-handed. Four 33px type chips stacked in two ragged rows on the New-request form is the entry point for every leave, overtime, claim and correction the company files.","impl_note":"app.css — append to the `07 · mobile frame` block: `.app-body .btn, .app-body .choice{ min-height:44px; }` · `.app-body .input, .app-body select.input{ min-height:44px; padding-top:11px; padding-bottom:11px; }` · `.app-body .btn.xs, .app-body .btn.sm{ min-height:40px; padding-inline:14px; }`. Keep the desktop sizes untouched.","functional_flag":false,"scope":"staff"},"DA-STAFF-10":{"id":"DA-STAFF-10","phase":1,"dimension":"responsiveness","screen":"all staff web screens","wrong":"At 1024 the rail keeps its full 242px width but every label collapses to 0px, so ten nav items become ten 24px glyphs floating in a 242px column with ~208px of empty rail beside them. The three group labels (WORK / PAY & DOCS / ACCOUNT) disappear entirely, so the grouping the nav depends on is gone; the Requests count chip detaches to x=213 while its icon sits at x=120; and the persona identity block ('Adeptio Me · Employee Self-Service') reduces to a bare avatar.","should":"Either keep the labels and let the rail hold 242px, or collapse the rail to 68px (icon + centred count badge + a hairline between groups) and give the 174px back to content. An icon-only rail at full width is the worst of both.","why":"Ten of the eleven icons in this rail are near-identical line glyphs at 24px — My day, Time, My schedule and Requests are indistinguishable at a glance — and with the group labels gone there is no secondary cue at all. Navigation becomes trial and error on a breakpoint many plant laptops sit at.","impl_note":"app.css — in the `@container shell (max-width:1020px)` block that hides the nav labels, also set `.rail{ width:68px; padding-inline:10px; }` · `.nav-item{ justify-content:center; }` · `.nav-item .count{ position:absolute; top:4px; right:6px; }` · `.rail .group.eyebrow{ display:block; height:1px; background:var(--line); margin:12px 8px; text-indent:-9999px; }` (keeps the group boundary as a rule when the word cannot fit) · `.rail-foot .note{ display:none; }`.","functional_flag":false,"scope":"staff"},"DA-STAFF-11":{"id":"DA-STAFF-11","phase":1,"dimension":"density","screen":"staff/mobile/payslip, staff/mobile/home","wrong":"Desktop KPI grids are reused verbatim in the phone frame. `grid cols-3` on mobile/payslip becomes three full-width stacked `.kpi` cards (Net / Gross / Deductions) at ~100px each — 300px of the 600px phone screen for three numbers, before a single pay line is visible. `grid cols-2` on mobile/home gives 'LEAVE 12 d' and 'REQUESTS 2' ~200px, pushing the Alerts card to the fold.","should":"On mobile a KPI group is one card: the hero figure at 24px with its label, and the supporting figures as a 2-up inline row at 15px. Target ≤120px total for the Net/Gross/Deductions group.","why":"Net pay, gross and deductions have identical visual weight today — same size, same card, differing only by hue — so the number the employee opened the app for is indistinguishable from the two that support it, and the earnings table it explains is off-screen.","impl_note":"app.css — add `.app-body .grid.cols-3{ grid-template-columns:1fr; gap:0; background:var(--surface); border:1px solid var(--line); border-radius:15px; padding:16px; }` · `.app-body .grid.cols-3 > .kpi{ padding:0; border:0; background:none; }` · `.app-body .grid.cols-3 > .kpi:not(.hero){ flex-direction:row; align-items:baseline; justify-content:space-between; }` · `.app-body .grid.cols-3 > .kpi:not(.hero) .k-value{ font-size:15px; }` · `.app-body .grid.cols-3 > .kpi:not(.hero) .k-sub{ display:none; }`. Same rule set for `.app-body .grid.cols-2`.","functional_flag":false,"scope":"staff"},"DA-STAFF-12":{"id":"DA-STAFF-12","phase":1,"dimension":"hierarchy","screen":"staff/web/sched-me","wrong":"In `.shiftchip` the capacity figure `.sc-cap` ('2/6' — a staffing metric for managers) is `flex:none` while `.sc-name` ('Line A · Morning' — the employee's own shift) is `flex:1 1 auto` with ellipsis. At 1024 the chip renders 'Line … 2/6': the shift name is destroyed to preserve a number the viewer cannot act on. schedule.css:141 only drops `.sc-cap` at a much narrower container width that this breakpoint never reaches.","should":"On a read-only personal calendar the capacity figure is hidden and the shift name gets the full chip width.","why":"The staff calendar exists to answer 'which shift am I on'. The current flex priority answers 'how full is the shift' instead, and truncates the answer the user came for.","impl_note":"schedule.css — add `body[data-persona=\"staff\"] .shiftchip .sc-cap{ display:none; }` (the staff calendar is read-only per staff.js:627-628), or scope it as `.cal.readonly .sc-cap{ display:none }` if a class is available. Leave schedule.css:141 in place for the manager/HR lenses.","functional_flag":false,"scope":"staff"},"DA-STAFF-13":{"id":"DA-STAFF-13","phase":1,"dimension":"density","screen":"staff/web/requests","wrong":"The screen states the same four counts twice: a `grid cols-4` of 32px KPI tiles (OPEN 2 · APPROVED 0 · RETURNED 0 · LEAVE BALANCE 12 d) sits directly above a filter chip row that already carries them at 12.3px ('All (2) · Leave (1) · Overtime · Claims (1) · Corrections'). Two of the four tiles read '0'. Below both sits a list of exactly 2 rows, and 300px of empty canvas.","should":"Drop the KPI row. The chips are the counts and the filter in one control; keep 'Leave balance 12 d' as a single right-aligned figure in the screen header beside the CTA.","why":"Three 32px numerals for a two-row list is the clearest weight/importance inversion in the persona, and the duplication makes the user check which of the two readings is authoritative.","impl_note":"staff.js:202-207 — delete the `<div class=\"grid cols-4\">…</div>` block; move the leave-balance figure into `actions` as `<span class=\"eyebrow\">Leave balance</span> <b class=\"num\">${DATA.me.staff.leaveBal} d</b>` before the CTA. Chips: emit the count for every type (`\" (\" + c + \")\"` unconditionally) so zero-count filters read '(0)' instead of nothing.","functional_flag":false,"scope":"staff"},"DA-STAFF-14":{"id":"DA-STAFF-14","phase":1,"dimension":"responsiveness","screen":"staff/web/time","wrong":"At 1440 the 'Exception — Missing punch, Jun 05 · Fix' card sits at y≈587, in view. At 1024 `grid cols-3` collapses to one column and the whole right rail (June calendar → Exception → This month → How you clock in) falls below the three full-width left cards: the Exception card lands at ~y=1400 on a 2315px page, three screens down.","should":"Order by urgency, not by source column: at the single-column breakpoint the Exception card must render immediately after the clock hero, before 'Today' and 'Punch history'.","why":"The exception is the only thing on Time & attendance that requires the employee to act, and it is the only thing that costs them money if missed. At 1024 it is the last thing they see.","impl_note":"app.css — in the container rule that collapses `.grid.cols-3` to one column, add `@container content (max-width:1020px){ .grid.cols-3 > .alert-first{ order:-1; } }` and in staff.js:178 add `class=\"alert-first\"` to the Exception `card(...)` wrapper (pass via the card opts `cls`). No change at 1440.","functional_flag":false,"scope":"staff"},"DA-STAFF-15":{"id":"DA-STAFF-15","phase":1,"dimension":"accessibility","screen":"staff/web/request-new, staff/web/sched-swaps, staff/mobile/request-new, staff/mobile/sched-swaps","wrong":"`.field label` is a sibling of its control with no `for` and no wrapping, so visually-labelled fields are programmatically unlabelled: web/request-new 3 of 4 inputs (`input#rq-from`, `#rq-to`, `#rq-days`), sched-swaps 2 of 3 (`div.field > select.input` ×2), mobile/request-new 2 of 3 (`select#rq-leave-type`, `input#rq-from`). The two fields carrying the decision — the leave dates and the colleague being swapped to — are among them.","should":"`<label for=\"rq-from\">` on every `.field label`, ids already exist on all the affected controls; the two `.field > select.input` controls in SCHEDVIEWS.swaps need ids adding.","why":"A screen reader announces 'edit text, Jun 18 2026' with no field name on the form that files every leave request in the company.","impl_note":"staff.js:232-254 and 580-588 — add `for=\"rq-from\"` / `for=\"rq-to\"` / `for=\"rq-days\"` / `for=\"rq-otdate\"` / `for=\"rq-hours\"` / `for=\"rq-amt\"` / `for=\"rq-cdate\"` / `for=\"rq-note\"` / `for=\"rq-leave-type\"` to each `<label>`; schedule.js SCHEDVIEWS.swaps — give the two selects `id=\"sw-shift\"` / `id=\"sw-to\"` and matching `for`. Markup attributes only; no behaviour changes.","functional_flag":false,"scope":"staff"},"DA-STAFF-16":{"id":"DA-STAFF-16","phase":1,"dimension":"components","screen":"staff/web/sched-swaps, staff/mobile/sched-swaps, staff/mobile/advance","wrong":"The submit button changes shape and place in every staff form. web/sched-swaps: fields are capped at 560px on the left of a 1080px card while 'Request swap' is pushed to the far right edge (x=1286) — ~700px from the last field, with the helper text stranded below it on the opposite side. mobile/sched-swaps: the same button is auto-width and right-aligned; mobile/advance: auto-width and left-aligned; mobile/request-new and mobile/requests: full width.","should":"One rule for the persona: on web the submit sits at the bottom-right **of the form column**, directly under the last field (the `request-new` pattern); on mobile every submit is `width:100%`.","why":"Four presentations of the same commit action across five forms in one persona teaches the user nothing and costs a full-card eye traverse on the swap screen.","impl_note":"schedule.js SCHEDVIEWS.swaps — wrap the fields and the action row in a single `<div style=\"max-width:560px\">` so `justify-content:flex-end` lands under the fields, and move the helper `<p class=\"small muted\">` above the action row. app.css — add `.app-body .btn[data-act]{ width:100%; }` so every mobile commit button is full width (covers submit-request, adv-request and the swap CTA).","functional_flag":false,"scope":"staff"},"DA-STAFF-17":{"id":"DA-STAFF-17","phase":2,"dimension":"color","screen":"staff/web/payslips, staff/web/advance, staff/web/me, staff/mobile/advance, staff/mobile/me","wrong":"`UI.meter()` derives its colour from the value (`pct>=100 → --bad`, `>=85 → --warn`, else `--ok`) because it was built for overtime quota consumption. Staff reuse it for 'Pay cycle 76%' / 'Earned 76% of the cycle', so a neutral progress bar renders in success green — a 1030px green bar is the largest coloured element on Payslips — and would turn amber at 85% and red on payday.","should":"A neutral progress tone driven by the persona accent: `tone:\"acc\"` → `background:var(--acc-d)`, used wherever the meter shows elapsed time rather than consumed quota.","why":"Green/amber/red is the product's status language; spending it on 'how far through the month you are' both misleads (green = good) and spends the persona accent's job on an unrelated hue.","impl_note":"ui.js:227 — add `acc` to the tone map: `const col = tone===\"bad\"?\"var(--bad)\":tone===\"warn\"?\"var(--warn)\":tone===\"acc\"?\"var(--acc-d)\":\"var(--ok)\"` and make the auto-threshold apply only when `opts.tone` is absent AND `opts.quota` is true. staff.js:109, 388, 611 and etdCard — pass `{ label:…, tone:\"acc\" }`. OT quota meters (staff.js:242, 586) keep the threshold behaviour.","functional_flag":false,"scope":"staff"},"DA-STAFF-18":{"id":"DA-STAFF-18","phase":2,"dimension":"components","screen":"staff/web/mydata, staff/web/report-run","wrong":"The same statuses render as plain lowercase body text on My data ('pending', 'active', 'expiring') and on a report run ('ok', 'flagged', 'ot') while every other staff screen renders them as `.badge` pills ('Pending', 'Active', 'Expiring', 'OK', 'Flagged', 'OT +2h'). On My data the status column is 12.8px text identical in weight to the adjacent Type and Stage columns.","should":"`UI.badge(status)` in every table cell that carries a status, on every staff screen.","why":"Status is the single scanning axis in these tables; two renderings of the same vocabulary force the user to re-learn where to look per screen and flatten the column that should pop.","impl_note":"dbviews.js DBV.tableEditor — in the cell renderer, when the column key is `status` emit `UI.badge(value)` instead of the escaped string. reports.js runPage — same for the result-set `status` column. No schema or data change; presentation only.","functional_flag":false,"scope":"staff"},"DA-STAFF-19":{"id":"DA-STAFF-19","phase":2,"dimension":"typography","screen":"staff/web/sched-me, staff/web/sched-swaps, staff/web/me, staff/mobile/sched-me, staff/mobile/sched-swaps","wrong":"Three date formats coexist inside one persona: ISO ('2026-06-08 · Line A · Morning' in shift rows and the swap select; '2026-06-01' in the Time-off holiday table), short-month ('Jun 18 – 19', 'Tue, Jun 09', 'expires Dec 2027') and long ('Wednesday, June 10 2026'). The ISO form appears only where the rows are truncated hardest on mobile, where it wastes 10 of the 116 available characters.","should":"One employee-facing format — 'Mon 8 Jun' for rows and chips, 'Wednesday, 10 June 2026' for the screen header. ISO is a machine format and belongs only in the `idtag`/mono channel.","why":"Dates are the primary sort key on every staff list; three encodings make two lists un-comparable at a glance and cost the exact characters the phone frame cannot spare.","impl_note":"Add `UI.date(iso, 'short'|'long')` to ui.js beside `kip()` returning 'Mon 8 Jun' / 'Wednesday, 10 June 2026'; apply at schedule.js shift-row titles, SCHEDVIEWS.swaps option labels, and staff.js:505 holiday `h.date`. Formatting only — the stored values are untouched.","functional_flag":false,"scope":"staff"},"DA-STAFF-20":{"id":"DA-STAFF-20","phase":2,"dimension":"spacing","screen":"staff/web/request-new, staff/web/advance","wrong":"Field widths are set by the container, not the content. On request-new the 'Days' input is 668px wide to hold '2 days', and 'From'/'To' are 328px each to hold 'Jun 18, 2026'; on advance the comparable amount field is capped at 280px. The same `.input` therefore appears at 280px and 668px in the same persona for equally short values.","should":"Content-proportional caps on `.field`: date 200px, quantity/amount 180px, free text and textarea full width. Consistent across both staff forms.","why":"A 668px box for a two-character answer signals 'write a lot here' and makes the form read as unfinished; the same control at two widths breaks the form's rhythm against the 16px field grid.","impl_note":"app.css — add `.field.w-date .input{ max-width:200px }` and `.field.w-num .input{ max-width:180px }`; staff.js:232-254 add `class=\"field w-date\"` to From/To/Date-to-correct/Receipt-date and `class=\"field w-num\"` to Days/Hours/Amount; remove the inline `style=\"margin-top:14px;max-width:280px\"` at staff.js:389 in favour of `.field.w-num`.","functional_flag":false,"scope":"staff"},"DA-STAFF-21":{"id":"DA-STAFF-21","phase":2,"dimension":"components","screen":"staff/web/request-new","wrong":"The Attachment control is `<button class=\"btn ghost sm\">+ Add file or receipt photo</button>` inside a `.field` (display:flex column), so it stretches to the full 668px column and inherits `.btn.ghost`'s white fill + `--line` border + 9px radius — visually identical to the `.input` above it. It reads as a disabled text field, not a button.","should":"A dashed drop affordance — `border:1.5px dashed var(--line)`, `background:var(--surface-2)`, centred label with the plus icon — or an auto-width ghost button aligned left. Either way it must not share the resting appearance of `.input`.","why":"The claim flow depends on attaching a receipt photo; an affordance the user has to click to discover is a failed affordance.","impl_note":"app.css — add `.dropzone{ border:1.5px dashed var(--line); background:var(--surface-2); border-radius:var(--r-sm); padding:16px; color:var(--ink-2); font-size:12.8px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:7px; } .dropzone:hover{ border-color:var(--acc); background:var(--acc-bg); }`; staff.js:273 `class=\"btn ghost sm\"` → `class=\"dropzone\"`. Also add `.field > .btn{ align-self:flex-start; }` so no other `.btn` stretches inside a field.","functional_flag":false,"scope":"staff"},"DA-STAFF-22":{"id":"DA-STAFF-22","phase":2,"dimension":"typography","screen":"staff/web/me, staff/web/request-detail","wrong":"`table.tbl` — a data table with uppercase 10.5px `.1em` headers and per-row bottom rules — is used five times in the staff scope for two-column key/value pairs: My profile identity (6 pairs), Profile General/Personal/Job (3 × 4–6 pairs), and request-detail Details (5 pairs). Each carries a 'FIELD | VALUE' header row that labels nothing, and at 1440 the value column starts at x=531 inside a 710px card, leaving a ~200px empty label gutter.","should":"A definition-list pattern: label at 11.5px --muted on the left, value at 13px --ink on the right, 10px row rhythm, one hairline every row, no header row.","why":"'FIELD | VALUE' is developer chrome; five instances of it are the reason My profile runs 2235px tall at 1440 and 3321px at 1024 to show ~20 facts.","impl_note":"app.css — add `.kvlist{ display:grid; grid-template-columns:minmax(120px,0.8fr) 1.2fr; } .kvlist dt{ font-size:11.5px; color:var(--muted); padding:9px 0; border-top:1px solid var(--line-2); } .kvlist dd{ font-size:13px; color:var(--ink); padding:9px 0; border-top:1px solid var(--line-2); margin:0; } .kvlist dt:first-of-type, .kvlist dd:first-of-type{ border-top:0; }`. Add `UI.kvlist(pairs)` beside `UI.table` and swap it in at staff.js:486, 503 and 302. Keep `.tbl` for Punch history, Payslip lines and report result sets, which are real tables.","functional_flag":false,"scope":"staff"},"DA-STAFF-23":{"id":"DA-STAFF-23","phase":2,"dimension":"alignment","screen":"staff/web/payslip, staff/web/payslips","wrong":"Two-column tables are stretched to the card's full 1030px: on Payslip, 'Basic salary' sits at x=337 and '₭ 4,200,000' at x=1316 — a 900px hairline-spanned gap per row. On Payslips History, ID sits at x=555 and GROSS at x=1017, a ~400px hole between the four columns.","should":"Cap a 2-column money table at `max-width:560px` (payslip lines) and let the history table's columns size to content with `width:1%` on the narrow ones, so no gap exceeds ~120px.","why":"The eye cannot associate a label with a figure 900px away without a leader; the payslip — the most-read document the company produces — becomes a scanning task instead of a glance.","impl_note":"app.css — add `.tbl.pairs{ max-width:560px; }` and `.tbl th:not(:first-child):not([class*=r]), .tbl td.fit{ width:1%; white-space:nowrap; }`. staff.js:93 wrap the payslip line table with the `pairs` class (pass through UI.table opts); staff.js:354 mark Period/ID/Gross/Net headers as fit columns so the table shrinks to content and left-aligns in the card.","functional_flag":false,"scope":"staff"},"DA-STAFF-24":{"id":"DA-STAFF-24","phase":2,"dimension":"color","screen":"staff/web/sched-me, staff/web/home, staff/web/time","wrong":"Calendar colour is incoherent across the persona's three calendars. (a) `.cal-legend` codes shift types with **other personas' accent tokens** — `is-hr` blue = Office/full-day, `is-mgr` green = Morning, `is-staff` ochre = Afternoon, `is-ceo` purple = Night — so on Adeptio Me a green chip means 'Morning' while green means 'approved/OK' everywhere else in the same app. (b) The plum `--hol` holiday wash on cells 1 and 15 has no legend entry at all. (c) The `heatcal` on My day ships a three-item legend (Present/Absence/Upcoming) whose 'Upcoming' swatch is `--line-2` #F0EDE6 on a white card — invisible; the identical heatcal on Time ships no legend and uses a *different* level map (`{4:'l3',5:'bad'}` vs `{4:'bad'}`).","should":"One calendar colour language for the persona: shift types on a categorical ramp that is not the persona-accent set, a holiday entry added to `.cal-legend`, one legend definition shared by both heatcals, and the 'Upcoming' swatch given a 1px `--line` border so an empty-state swatch is still visible.","why":"Colour is the only channel these grids use; borrowing the persona accents for shift types makes the whole accent system ambiguous, and an unlabelled plum cell tells the employee nothing about why that day is different.","impl_note":"schedule.css:128-131 — replace the persona tokens with a dedicated shift ramp: `.cal-legend i.is-shift-1{background:var(--brand)} .is-shift-2{background:var(--hr)} .is-shift-3{background:var(--staff)} .is-shift-4{background:var(--ceo)}` is NOT enough; define four shift colours in tokens.css (see token_needed) and reference them from both `.cal-legend i` and `.shiftchip`. Add a fifth legend entry `<span><i class=\"is-hol\"></i>Holiday</span>` with `background:var(--hol)`. app.css — `.legend i{ box-shadow:inset 0 0 0 1px var(--line) }` so pale swatches stay visible; staff.js:177 — pass the same legend markup used at staff.js:130 and align the two level maps.","functional_flag":false,"scope":"staff"},"DA-STAFF-25":{"id":"DA-STAFF-25","phase":2,"dimension":"color","screen":"staff/web/payslip, staff/mobile/payslip","wrong":"Deduction amounts render `color:var(--bad)` (#B5675C) = **4.15:1** at 12.8px, below 4.5:1, via an inline style in the payslip line builder. They are also the only red on the screen: income tax and social security — normal statutory lines — are painted in the product's error colour.","should":"`var(--ink-2)` with the existing minus sign for the amount, or `var(--bad-text)` (#94503F, 6.1:1) if a warm tint is wanted. Red is reserved for Returned / Failed / Flagged.","why":"It fails contrast on a monetary value the employee must be able to read exactly, and it tells them something went wrong with their tax when nothing did.","impl_note":"staff.js:86 — drop the inline style and emit `<span class=\"num neg\">− ${kip(-l[1])}</span>`; app.css — add `.num.neg{ color:var(--ink-2); }` beside `.num` (app.css:51). If the warm tint is preferred for scanning, use `color:var(--bad-text)` instead — both clear 4.5:1.","functional_flag":false,"scope":"staff"},"DA-STAFF-26":{"id":"DA-STAFF-26","phase":2,"dimension":"hierarchy","screen":"staff/web/reports, staff/web/report-run","wrong":"Raw SQL is the most prominent line in each report block on an Employee Self-Service screen: `SELECT * FROM time_punches WHERE emp='EMP-0214' — db_time · db_people` renders in `--mono` at 12.8px, longer and darker than the human description above it, on both the library screen (2 blocks) and the run screen (the whole 'Query detail' card). The machine-operator persona has no use for a query string.","should":"Demote the query to a collapsed `<details>` labelled 'Data source' at 11px --muted, or drop it from the staff lens entirely and keep it in the sysadmin/HR lenses where it is the point.","why":"It is the largest block of text on a screen whose subject is 'my attendance', and it makes the ESS app read as an internal admin tool.","impl_note":"reports.js — in `library()` and `runPage()`, wrap the query string in `<details class=\"srcdetail\"><summary>Data source</summary><code>…</code></details>` and add to app.css `.srcdetail summary{ font-size:11px; color:var(--muted); font-weight:700; cursor:pointer; list-style:none; } .srcdetail code{ font:600 11px/1.6 var(--mono); color:var(--ink-2); }`. Gate the whole block on `persona !== 'staff'` if the simpler removal is preferred.","functional_flag":false,"scope":"staff"},"DA-STAFF-27":{"id":"DA-STAFF-27","phase":2,"dimension":"spacing","screen":"staff/web/me, staff/web/payslips, staff/web/documents","wrong":"Grid children stretch to the tallest sibling, so the shorter card is padded with dead space instead of ending at its content: web/me's profile card is 710×680 for a 6-row table (≈330px empty below it); web/payslips' tinted 'Latest' card is 265px tall with content ending at 150px; web/documents' 'Policies to acknowledge' card carries ~60px of empty below two rows. The clock hero is a third case — 1030×122 at 1440 with a ~500px empty band between the time and the button.","should":"`align-items:start` on the multi-column grids so each card is content-height, and the clock hero constrained to `max-width:640px` (or its content re-balanced into three columns: state, time, action).","why":"Whitespace should be structure, not residue. A card that ends 330px after its last row reads as a loading failure, and it pushes real content below the fold on both 1440 and 1024.","impl_note":"app.css — add `.grid{ align-items:start; }` and, where a column is intentionally a stretched column of stacked cards, the existing `display:flex;flex-direction:column` wrappers already opt out. `.clock-hero{ ... }` — add `max-width:640px;` at 1440 (leave it 100% inside `.app-body`), or change `.ch-line` to `display:grid; grid-template-columns:auto auto; justify-content:start; column-gap:48px`.","functional_flag":false,"scope":"staff"},"DA-STAFF-28":{"id":"DA-STAFF-28","phase":2,"dimension":"components","screen":"all staff screens","wrong":"Radii and badge casing drift off the token set. 9 distinct border-radius values on web/home@1440 and 11 on mobile/time@390 against four tokens (--r-sm 11 / --r 16 / --r-lg 22 / --r-xl 30): 6px (heatcal cells), 9px (.btn.sm, .idtag), 10px (.btn, .input, .choice, .ric), 12px (the inline leave-balance tiles at staff.js:505), 13px (.ch-btn), 15px (.app-body .card), 18px (.clock-hero), 3px, 99px. Badge labels are capitalised by UI.badge ('Pending', 'OK') but hand-written badges are lowercase ('public', 'company', 'live', 'recent', 'archived').","should":"Every radius resolves to a token: 6/9/10 → var(--r-sm) where the element is a control or chip, 12/13/15/18 → var(--r); 3px and 99px stay as the hairline and pill exceptions. Every badge label uses the UI.badge casing.","why":"Eleven corner radii on one phone screen is what stops the surface reading as one system; mixed badge casing makes two chips in the same row look like two components.","impl_note":"app.css — `.heatcal .hc{border-radius:6px}` → `var(--r-sm)` minus: use `6px` only if the cell is <24px, otherwise `var(--r-sm)`; `.btn{border-radius:10px}` → `var(--r-sm)`; `.btn.sm{9px}`/`.btn.xs{8px}` → `var(--r-sm)`; `.input/.choice/.ric{10px}` → `var(--r-sm)`; `.clock-hero{18px}` and `.app-body .card{15px}` → `var(--r)`; `.ch-btn{13px}` → `var(--r-sm)`. staff.js:505 inline `border-radius:12px` → `var(--r-sm)`. Badges: staff.js:505 `${h.kind}` → `UI.esc(h.kind[0].toUpperCase()+h.kind.slice(1))`; reports.js 'recent'/'archived' and 'live' likewise.","functional_flag":false,"scope":"staff"},"DA-STAFF-29":{"id":"DA-STAFF-29","phase":3,"dimension":"empty states","screen":"staff/web/advance, staff/web/reports, staff/web/report-files, staff/web/security, staff/mobile/requests","wrong":"Four different empty-state treatments coexist. (a) The designed `UI.empty()` — centred icon at 30px/.4 opacity, `.et` title, `.es` subline — used on sched-swaps, documents and payslips. (b) A bare left-aligned `<p class=\"small muted\">No advances yet.</p>` floating in a 350×100 card on advance, and `No leave requests yet.` in requestRows(). (c) 'Empty — runs land here automatically…' sentences under a folder heading on report-files, alongside four KPI tiles reading 0 / 0 / 0 KB. (d) My security renders as a single untitled paragraph card with 600px of dead canvas and no icon, CTA or lock affordance, despite `UI.lockMsg`/`UI.lockTag` existing for exactly this.","should":"`UI.empty()` everywhere, with its third argument carrying the next action; the flag-off security screen uses the lock pattern (`empty('lock', …)` + `UI.lockTag`).","why":"Empty is a state the staff persona hits constantly — a new hire has no payslips, no documents, no advances, no report runs — and today four of those look like four different products, one of which looks broken.","impl_note":"staff.js:29 → `return empty('inbox', 'No requests yet', 'Leave, overtime, claims and corrections you file will appear here.')`; staff.js:394 → `empty('banknote','No advances yet','Draw up to half of what you have earned this cycle.')`; reports.js filesPage folder body → `empty('folder','Nothing archived yet','Runs move here once a report has more than 3.')` and drop the 4 zero KPI tiles; authviews.js mySecurity flag-off branch → `card('', empty('lock','Sign-in is off in this demo','Turn the portal flag on from the sign-in footer to manage sessions.') + UI.lockTag('Portal'))`.","functional_flag":false,"scope":"staff"},"DA-STAFF-30":{"id":"DA-STAFF-30","phase":3,"dimension":"loading states","screen":"all staff screens","wrong":"There is no loading or skeleton treatment anywhere in the stylesheet — no `.skeleton`, `.shimmer`, `.spinner` or `.loading` rule exists across app.css (938 lines) and schedule.css (319). Every route change is a hard swap wrapped in a single 240ms `screen-fade`, and the two staff screens that will be slowest against a real API (Payslips history, Punch history, report runs) will pop in with no reserved space.","should":"A `.skeleton` token-built shimmer (`--line-2` base, `--surface-2` highlight, 1.2s ease loop, respecting prefers-reduced-motion) applied to `.rowitem`, `.tbl tr` and `.kpi .k-value` shapes, with the rows' heights reserved so nothing shifts on arrival.","why":"On a phone over plant Wi-Fi the punch list and payslip history are the two screens most likely to wait; with no reserved space the whole card jumps when data lands.","impl_note":"app.css — add `.skeleton{ background:linear-gradient(90deg, var(--line-2) 25%, var(--surface-2) 37%, var(--line-2) 63%); background-size:400% 100%; animation:skel 1.2s var(--ease) infinite; border-radius:var(--r-sm); color:transparent; }` + `@keyframes skel{ from{background-position:100% 0} to{background-position:0 0} }` and add `.skeleton{animation:none}` to the existing `@media (prefers-reduced-motion:reduce)` block at app.css:53. Provide `UI.skeletonRows(n)` emitting n `.rowitem` shells at the live row height (57px web / 58px mobile).","functional_flag":false,"scope":"staff"},"DA-STAFF-31":{"id":"DA-STAFF-31","phase":3,"dimension":"error states","screen":"staff/mobile/request-new, staff/mobile/advance, staff/mobile/home","wrong":"The only feedback surface in the product is `.toast-wrap{ position:fixed; bottom:26px; right:26px }`, anchored to the browser viewport. In the mobile preview the toast therefore renders **outside the phone frame**, at the bottom-right of the desktop page, for every staff mobile commit — submit-request, adv-request, clock in/out. There is no inline error style at all: `.field` has `.hint` but no `.field.err` / `.input[aria-invalid]` treatment, so a rejected amount (over the 50% advance cap) or a missing date has nowhere to be shown next to the field.","should":"Toasts render inside `.phone-screen` when device=mobile (absolute, bottom 78px to clear the tab bar), and `.field` gains an error state — `--bad` border, `--bad-text` message under the control — so validation lands beside the field that failed.","why":"The employee taps Submit and the confirmation appears somewhere else on the screen entirely; and the one form with a hard numeric limit (advance ≤ 50% of earned-to-date) has no way to say no.","impl_note":"app.css — add `.phone-screen{ position:relative }` (already set) and `body[data-device=\"mobile\"] .toast-wrap{ position:absolute; bottom:78px; right:12px; left:12px; }` scoped inside `.phone-screen`, appending the toast wrapper to `.phone-screen` rather than `<body>` when the mobile frame is active. Add `.field.err .input{ border-color:var(--bad); box-shadow:0 0 0 3px var(--bad-bg); }` and `.field .err-msg{ font-size:11px; color:var(--bad-text); font-weight:600; }` beside `.field .hint` (app.css:431).","functional_flag":true,"scope":"staff"},"DA-STAFF-32":{"id":"DA-STAFF-32","phase":3,"dimension":"motion","screen":"all staff screens","wrong":"Feedback is inconsistent across the persona's controls. `.btn` animates `filter: brightness(.94)` on hover plus `translateY(1px)` on active; `.ch-btn` (the clock button — the single most-tapped control) has only `transform:scale(.97)` on :active and no hover state at all; `.choice` transitions `all var(--t)` (animating border-color, background and colour together, and any future layout property); `.tab` transitions colour only, so the aria-current dot appears instantly. `.rowitem.click` is the only element with a proper background transition.","should":"One interaction contract: hover = background/border change over 160ms var(--ease), active = `transform:scale(.98)`, focus = the existing 3px `--acc-bg` ring. Never `transition:all`.","why":"The clock-in button is the product's signature interaction and it is the only primary control with no hover feedback; `transition:all` on `.choice` is the kind of rule that starts animating layout the moment someone adds a padding change.","impl_note":"app.css:445 `.choice{ transition:all var(--t) }` → `transition:background var(--t), border-color var(--t), color var(--t)`. app.css:533 `.ch-btn{ transition:transform var(--t) }` → `transition:transform var(--t), box-shadow var(--t)` and add `.clock-hero .ch-btn:hover{ box-shadow:0 10px 24px -10px rgba(0,0,0,.5); }`. app.css:416 `.btn:hover{ filter:brightness(.94) }` → `.btn:hover{ background:var(--acc); }` (pairs with DA-STAFF-02) and `.btn:active{ transform:translateY(1px) }` → `transform:scale(.98)` for parity with `.ch-btn`. app.css:512 `.tab{ transition:color var(--t) }` → `transition:color var(--t), background var(--t)`; add `.tab .tdot{ transition:background var(--t) }`.","functional_flag":false,"scope":"staff"},"DA-SYS-01":{"id":"DA-SYS-01","phase":1,"dimension":"components","screen":"sysadmin/web/backups, sysadmin/web/sched-connector, sysadmin/mobile/health, sysadmin/mobile/devmonitor","wrong":"icon() emits <svg> with no width/height attributes (ui.js:64-66) and app.css has no global svg fallback rule - only 40 context-specific selectors. In four sysadmin contexts no selector matches, so the SVG falls back to its 300x150 intrinsic default and stretches to the container: backups renders a ~470x600px black box glyph between the upload field and the set table (sysadmin.js:332, inside div.strong.small); sched-connector renders three ~190x190px glyphs inside td cells of the Connector manifest table, pushing the connector name out of its cell (schedule.js:586, inside span.strong); mobile/health and mobile/devmonitor render ~100x90px check and alert glyphs in the status card (sysadmin.js:660).","should":"Every icon() SVG has an intrinsic size. Add a single base rule so an unmatched context can never blow out, and keep the existing per-context overrides.","why":"This is the largest single visual defect in the persona - an 800px column of solid --ink on a backup screen reads as a rendering failure, and it destroys the primary table on sched-connector. It also inverts hierarchy absolutely: the loudest object on sysadmin/web/backups is a decorative folder glyph.","impl_note":"css/app.css: add after the token import, before line 104 - `svg{ width:15px; height:15px; flex:none; }` as the base (all 40 existing `<scope> svg{}` rules already override it by specificity). Additionally scope the four call sites: `.strong > svg, .sec-h > svg{ width:14px; height:14px; vertical-align:-2px; }` and `.tbl td .strong svg{ width:14px; height:14px; }`. No JS change needed.","functional_flag":false,"scope":"sysadmin"},"DA-SYS-02":{"id":"DA-SYS-02","phase":1,"dimension":"responsiveness","screen":"all sysadmin web screens","wrong":"The icon-rail collapse never applies its width. `@container shell (max-width:1024px){ .rail{width:74px} }` sits at app.css:173-179, but the base `.rail{ width:242px }` is declared *after* it at app.css:180 with identical (0,1,0) specificity, so source order wins. Every other declaration in that block does apply - labels, group headings, rail-foot note and tier-chip text all collapse to 0px and .nav-item{justify-content:center} centres the icons. Result at 1024: a 242px rail holding 17px icons centred at x=120 and absolutely-positioned count badges at x=213, with ~168px of empty rail; the content container drops to 782px inside a 1024px viewport.","should":"Rail is 74px at 1024 as designed, returning 168px to the content column.","why":"This one line causes most of the persona's 1024 damage - 132 clipped elements, the amputated status/actions columns in DA-SYS-10 and DA-SYS-11, and the 28 ellipsised rows in DA-SYS-03 all stop being clipping problems once the content column is 950px instead of 782px. It also leaves a nav badge floating 80px from the icon it counts, which reads as a stray chip.","impl_note":"css/app.css: move the whole `@container shell (max-width:1024px){…}` block (lines 173-179) to immediately after the base `.rail{…}` rule block ends (after line 218, `.rail-foot .note{…}`). Do not raise specificity or add !important - source order is the fix. Verify `.nav-item .count{ position:absolute; top:3px; right:3px }` then lands inside the 74px item.","functional_flag":false,"scope":"sysadmin"},"DA-SYS-03":{"id":"DA-SYS-03","phase":1,"dimension":"responsiveness","screen":"sysadmin/web/database","wrong":"The Demo reset list hard-truncates its own content and then overlaps it. 28 clipped elements: `div.rmain > div.rt` and `div.rmain > div.rs` measure scrollWidth 166-233px against clientWidth 161px, ellipsised with no title attribute - 'Time & Attenda…', 'Requests …', 'resets to fact…'. 8 overlapping text-box pairs where `div.rt > span.small.muted` runs underneath `div.rside > button.btn.xs.soft` (intersection areas 55-437px2).","should":"Row main column gets the width it needs (a 74px rail returns 168px), the sub-line wraps to a second line instead of ellipsising, and .rside is allotted a fixed track so text can never pass under the button.","why":"The truncated text is the only identification a store has in this list - the operator is being asked to reset 'db_time · Time & Attenda…' with the consequence text ('resets to fact…') cut off. Truncating the warning on a destructive row is the worst possible place to lose characters.","impl_note":"css/app.css .rowitem: `display:flex` → `display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center;` so .rside gets its own track and cannot be overlapped. `.rmain .rs{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis }` → `white-space:normal; overflow:visible; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;`. Ship with DA-SYS-02.","functional_flag":false,"scope":"sysadmin"},"DA-SYS-04":{"id":"DA-SYS-04","phase":1,"dimension":"components","screen":"sysadmin/web/dbops","wrong":"Reset, Purge and Migrate are drawn in one row per store (15 rows, 45 buttons) at identical size, radius, border and background. Reset and Migrate are `.btn.xs.ghost` (surface bg, --line border, --ink-2 text); Purge is `.btn.xs.danger`, which app.css:423 defines as the *same* surface bg and *same* --line border, differing only in text colour (--bad #B5675C = 4.15:1 on white, below 4.5 at 11.3px). Reset and Migrate are destructive too and carry no signal at all.","should":"A single destructive tier that is unmistakable at a glance: --bad-bg fill, --bad border, --bad-text label (6.04:1). Reset and Migrate carry it too, since both rewrite the store; only genuinely reversible actions stay ghost.","why":"This is the screen where an admin destroys production data 15 different ways, and the page's own subtitle says 'every destructive op auto-snapshots first'. If the chrome does not separate destructive from routine, the snapshot is the only thing between a mis-click and data loss - design should be the first guard, not the last.","impl_note":"css/app.css:423-424: `.btn.danger{ background:var(--bad-bg); border-color:var(--bad); color:var(--bad-text); }` and `.btn.danger:hover{ background:var(--bad); border-color:var(--bad); color:#fff; filter:none; }`. js/screens/sysadmin.js:755: `class=\"btn xs ghost\"` on `dbops:reset` and `dbops:migrate` → `class=\"btn xs danger\"`. Line 415 `.btn:not(.ghost):not(.danger):hover` keeps danger out of the accent glow.","functional_flag":false,"scope":"sysadmin"},"DA-SYS-05":{"id":"DA-SYS-05","phase":1,"dimension":"hierarchy","screen":"sysadmin/web/database","wrong":"Destructive weight is inverted in the Demo reset footer. 'Reset all stores' is `.btn.soft` - a filled --acc-bg pill with --acc-ln border, the heaviest treatment on the card. 'Factory reset — stores + snapshots', which additionally wipes the custodial backup area (L-CU), is `.btn.danger` - white surface, --line border, 4.15:1 red text. The more catastrophic action is visually the lighter of the two, and both sit at 12.8px side by side in the same row.","should":"Factory reset is the only filled-red control on the screen; Reset all stores drops to ghost, since the sectional per-store Reset above it is the routine path.","why":"A user scanning this row sees one filled button and reaches for it - and the filled one is the wider-blast-radius action dressed as the safe default. Visual weight must track consequence, not frequency.","impl_note":"js/screens/dbviews.js:173: `class=\"btn soft\"` → `class=\"btn ghost\"`. Line 174 stays `.btn.danger` and inherits the filled --bad-bg treatment from the DA-SYS-04 CSS change. Add `margin-left:auto` to the Factory reset button so the two controls are not adjacent in the same tap zone.","functional_flag":false,"scope":"sysadmin"},"DA-SYS-06":{"id":"DA-SYS-06","phase":1,"dimension":"hierarchy","screen":"sysadmin/web/database","wrong":"The page header pairs 'Backup center' (.btn.soft) with 'Reseed all stores' (.btn.ghost). Reseed all stores overwrites every one of the 15 live stores, yet it is rendered in the exact chrome used for pure navigation ghosts elsewhere in the persona ('db_identity', 'Providers', 'BioMetrics', 'Directory sync'). Database@1440 reports aboveFoldPrimary=0, aboveFoldButtons=2 - neither header control is a primary, and the destructive one is indistinguishable from a link.","should":"Header carries one primary ('Backup center', .btn) and the destructive reseed moves out of the header entirely, into the Demo reset card where its consequence text lives.","why":"A header action is the most-clicked target on a screen. Putting a 15-store overwrite there in navigation chrome, with no consequence text within 400px, is the single highest-risk placement on the worst-scoring screen in the product.","impl_note":"js/screens/sysadmin.js:244: remove the `Reseed all stores` button from `actions`; change the remaining `Backup center` button from `class=\"btn soft\"` to `class=\"btn\"`. The reset path already exists in the Demo reset card (dbviews.js:173) - no new control is needed.","functional_flag":false,"scope":"sysadmin"},"DA-SYS-07":{"id":"DA-SYS-07","phase":1,"dimension":"components","screen":"sysadmin/web/identity","wrong":"The same action is rendered two different ways in the same table. In the Directory, an invited row draws Revoke as `.btn.xs.ghost` (authviews.js:397) while an active row draws the identical Revoke as `.btn.xs.danger` (authviews.js:400); a locked row draws Force reset as `.btn.xs.ghost` (:398) while Resend - a harmless re-send - gets `.btn.xs.soft`, the heaviest weight in the column. 11 rows x 2 buttons = 22 controls in an ACTIONS column with three different weights and no mapping to consequence.","should":"One treatment per action across every row state: Revoke and Force reset are always `.btn.xs.danger`; Resend and Unlock are always `.btn.xs.ghost`.","why":"Row-level actions are learned by shape. Teaching a user that red-bordered means Revoke and then shipping a grey Revoke two rows up destroys that learning and makes the whole column untrustworthy - exactly the wrong outcome on the console that revokes access.","impl_note":"js/screens/authviews.js:397: `btn xs ghost` on `auth-revoke-access` → `btn xs danger`. :398: `btn xs ghost` on `auth-force-reset` → `btn xs danger`; `btn xs soft` on `auth-unlock` → `btn xs ghost`. :397 `btn xs soft` on `auth-resend` → `btn xs ghost`. :471 (mobile access card) apply the same two swaps.","functional_flag":false,"scope":"sysadmin"},"DA-SYS-08":{"id":"DA-SYS-08","phase":1,"dimension":"components","screen":"sysadmin/web/dbstore","wrong":"Row delete - the most destructive control in the Console - has no button chrome at all. It is `.btn.xs.danger.ghost-d`, and app.css:634 defines `.ghost-d{ background:transparent; border-color:transparent }`, stripping both the surface and the border that .btn.danger provides. What renders is a bare 13px x glyph in --bad (4.15:1) at the right edge of every row - 37 of them on db_people - lighter than the body text beside it and with no hit-area boundary. The border only appears on :hover (app.css:635).","should":"A visible destructive control at rest: 28x28 min hit area, --bad-bg fill, --bad-text glyph, so the row's delete affordance is legible before the pointer arrives.","why":"An invisible-at-rest destructive control fails both the eye and the thumb: there is nothing to aim at, nothing to avoid, and hover-only chrome means keyboard and touch users never see the boundary. Delete must be the most carefully drawn control on a data table, not the least.","impl_note":"js/screens/dbviews.js:38: remove `ghost-d`, leaving `class=\"btn xs danger\"` so it picks up the DA-SYS-04 filled treatment. css/app.css: add `.tbl .btn.xs.danger{ padding:5px; min-width:28px; min-height:28px; border-radius:var(--r-sm); }`. Delete the now-unused `.btn.ghost-d` rules at app.css:634-635 (single consumer).","functional_flag":false,"scope":"sysadmin"},"DA-SYS-09":{"id":"DA-SYS-09","phase":1,"dimension":"hierarchy","screen":"sysadmin/web/dbstore","wrong":"The 'Module actions — blast radius: this store only' card stacks three full-width buttons in descending weight: 'Snapshot this store now' `.btn.soft` (filled --acc-bg), 'Restore latest snapshot · BK-1001' `.btn.ghost`, 'Reseed sample data' `.btn.ghost`. Snapshot is purely additive and gets the heaviest treatment; Restore and Reseed both overwrite every live row in the store and get the lightest, in chrome identical to the persona's navigation ghosts.","should":"Snapshot is the card's primary (.btn); Restore and Reseed carry the destructive tier.","why":"Inside a card whose own title promises 'blast radius' framing, the two buttons that actually have a blast radius are the two that look inert. The card teaches the opposite of what it says.","impl_note":"js/screens/sysadmin.js:283 `class=\"btn soft\"` → `class=\"btn\"`; :284 and :285 `class=\"btn ghost\"` → `class=\"btn danger\"`. Insert `<hr style=\"border:0;border-top:1px solid var(--line-2);margin:10px 0\">` between :283 and :284 so additive and destructive actions are not one continuous stack.","functional_flag":false,"scope":"sysadmin"},"DA-SYS-10":{"id":"DA-SYS-10","phase":1,"dimension":"responsiveness","screen":"sysadmin/web/biometrics","wrong":"The Connected fleet table's STATUS column is amputated at the card edge - the Online/Degraded/Offline badge renders as 'Onlin' with the pill clipped mid-glyph. The tablewrap reports scrollWidth > clientWidth with scrollable:true, so the only recovery is a horizontal scroll inside a card with no visible scroll affordance. Five overlapping text pairs accompany it.","should":"At 1024 the fleet table drops its two lowest-value columns (LANE, METHODS move into the device sub-line) so DEVICE / VENDOR / ZONE / TODAY / STATUS fit without scroll.","why":"Status is the only reason an admin opens a device fleet screen. Clipping the one column that answers 'is anything broken' turns a monitoring table into a decoration.","impl_note":"css/app.css: add `@container content (max-width:820px){ .tbl th:nth-child(3), .tbl td:nth-child(3), .tbl th:nth-child(4), .tbl td:nth-child(4){ display:none } }` scoped to a new `.tbl.fleet` class, and add that class in js/screens/sysadmin.js at the `biometrics()` fleet `table(...)` call. Ship after DA-SYS-02, which alone recovers 168px and may resolve the clip.","functional_flag":false,"scope":"sysadmin"},"DA-SYS-11":{"id":"DA-SYS-11","phase":1,"dimension":"alignment","screen":"sysadmin/web/providers","wrong":"The screen has the highest overlap count in the persona: 15 intersecting text-box pairs at 1024 (8 at 1440), driven by `details.pv-worker > pre.pv-snippet` escaping its bounds and landing on top of `div.card-head > span.t`, `tr > th` and `p.small.muted` - the largest intersection is 11,264px2, a full paragraph rendered underneath a code block. Separately, the directory simulator table clips its ACTIONS column so the Disable control reads 'Dis', and `input#pv-PROV-AD-bindDN` clips its value (scrollWidth 418 vs clientWidth 298).","should":"The <details> worker snippet is laid out in normal flow with its own block box; the simulator table sheds the TYPE or GROUP column at 1024 so ACTIONS survives.","why":"Overlapping text is the one defect users read as 'this app is broken' rather than 'this app is dense'. On the screen that configures LDAP/RADIUS binds, an unreadable config snippet also has a direct operational cost.","impl_note":"css/app.css: `.pv-worker{ display:block; }` and `.pv-snippet{ display:block; position:static; white-space:pre-wrap; overflow-x:auto; max-width:100%; margin:8px 0 0; }` - the overlap pattern (a pre intersecting the *following* card-head and th) indicates the snippet is out of flow. Add `.pv-worker[open]{ margin-bottom:12px }`. Apply the DA-SYS-10 column-priority approach to the simulator table.","functional_flag":false,"scope":"sysadmin"},"DA-SYS-12":{"id":"DA-SYS-12","phase":1,"dimension":"typography","screen":"sysadmin/web/devmonitor","wrong":"The clock-in/out chart's y-axis renders as meaningless digit strings: '000004', '000002', '0'. lines2() (ui.js:176-193) computes `min = Math.min(...all)*0.97` and `max = Math.max(...all)*1.03`, then prints `[max,(max+min)/2,min]` through an identity formatter with no rounding. The float artefacts produce ~17-character labels which, anchored `text-anchor=\"end\"` at x=padL-6=28 inside `viewBox=\"0 0 680 200\"`, extend past x=0 and are clipped by the viewBox - only the trailing digits survive.","should":"Axis labels are rounded integers ('48', '24', '0') that fit inside the 28px left gutter.","why":"The only quantitative chart in the Devices group is currently unreadable - an admin cannot tell whether the morning peak is 4 punches or 47. A chart with a broken scale is worse than no chart, because it looks authoritative.","impl_note":"js/ui.js:185: `const fmt = opts.fmt || (v => v);` → `const fmt = opts.fmt || (v => Math.round(v).toLocaleString());`. js/ui.js:177: `padL = 34` → `padL = 42` so a 3-digit label clears the gutter. js/ui.js:188: `font-size=\"8.5\"` → `font-size=\"10\"` and `fill=\"var(--muted-2)\"` → `fill=\"var(--muted)\"` (2.29:1 → 4.40:1 on surface).","functional_flag":false,"scope":"sysadmin"},"DA-SYS-13":{"id":"DA-SYS-13","phase":1,"dimension":"color","screen":"sysadmin/web/database","wrong":"The Provisioning grid encodes its entire payload - 3 tenants x 13 stores = 39 cells - as a 13px glyph with colour as the only variable: filled circle in --ok #5E8C63 (3.88:1) for provisioned, hollow circle in --muted-2 #AFABA1 (2.29:1) for not provisioned, set by an inline style. The hollow glyph at 2.29:1 is the single largest contributor to the screen's 211 contrast failures at 1440 and 203 at 1024. The only text alternative is a `title` tooltip, and the legend sits below the table in --muted.","should":"A provisioned/not-provisioned state that survives greyscale and meets 4.5:1 - a filled --ok-bg cell with an --ok-text check for provisioned, an empty cell with a --line dash for not, plus a visible column/row header pairing rather than a tooltip.","why":"This grid answers the screen's central question - which tenant has which store - and it answers it in a hue difference that fails contrast twice over and disappears entirely for a colour-blind admin. Colour may reinforce state; it may not be the state.","impl_note":"js/screens/dbviews.js:81: replace the inline style with a class - `<span class=\"pg ${on?'on':'off'}\" title=…>${on?'✓':'—'}</span>`. css/app.css add: `.pg{ display:inline-grid; place-items:center; width:22px; height:22px; border-radius:var(--r-sm); font-size:12px; font-weight:700 } .pg.on{ background:var(--ok-bg); color:var(--ok-text) } .pg.off{ background:transparent; color:var(--muted) }`. Update the legend at dbviews.js:84 to '✓ provisioned · — not yet'.","functional_flag":false,"scope":"sysadmin"},"DA-SYS-14":{"id":"DA-SYS-14","phase":1,"dimension":"hierarchy","screen":"all sysadmin web screens","wrong":"21 of 29 web screens report aboveFoldPrimary=0 - database, dbops, dbstore, identity, providers, sync, devmonitor, gates, gate, device, device-new, functions, roles, health, audit, security, outbox, report-run, report-files, template, sched-connector. Where a header action exists it is `.btn.soft` (10 uses) or `.btn.ghost` (17 uses) against only 8 `.btn` in the whole of sysadmin.js. On health the only header control is a soft 'Test gateways'; on audit a ghost 'Export'; on sync a ghost 'Providers' (pure navigation).","should":"Every screen states its one primary action in `.btn` (filled --acc) and demotes cross-navigation to a text link in the crumbs or card-head, not a header bu
