hr/web/group","wrong":"The six clock-in method cards offer three visual states and two different affordances: 'Biometric' = accent border + tint + a 'Primary' badge; 'Card / RFID' and 'Mobile' = accent ring + tint + a real 'Make primary' button; 'Gate / access', 'Web clock', 'Device PIN' = plain border with the muted 11.5px sentence 'tap to allow' where the button sits on the others. The grid is also uneven — five cards on row 1 at alternating 195/200px and one orphan on row 2.","should":"One card component with two states (allowed / not allowed) and one control in the same slot on all six: a `.btn.xs` reading 'Allow' or 'Make primary'; a 3-column grid so 6 cards fill two equal rows.","why":"'tap to allow' is instructional text standing in for a control — the user has to be told the card is clickable, which is the definition of a failed affordance, and the mixed states make it impossible to scan which methods are on.","impl_note":"js/screens/hr.js group (~575) — wrap the method cards in `<div class=\"grid cols-3\">`; replace the 'tap to allow' span with `<button class=\"btn xs ghost\" data-act=\"method-allow:${m.id}\">Allow</button>` and keep `.btn.xs.soft` 'Make primary' for allowed-but-not-primary; the primary card keeps only the `.badge.acc` 'Primary'.","functional_flag":false,"scope":"hr"},"DA-HR-16":{"id":"DA-HR-16","phase":1,"dimension":"accessibility","screen":"hr/web/sched-staff, hr/web/sched-control, hr/web/pay-otq, hr/web/pay-ot","wrong":"Unlabelled inputs cluster on the four densest screens: sched-staff has 32 of 33 inputs with no label/aria-label/placeholder (one `<select class=\"input sm sched-divsel\">` per roster row, schedule.js:368, each showing the truncated placeholder option 'Move to…'); sched-control 9 of 19; pay-otq 10 of 10 (the LIMIT (H) number fields); pay-ot 5 of 5.","should":"Every in-row control carries `aria-label` naming its subject (`aria-label=\"Move Souksavanh Phommachanh to another division\"`, `aria-label=\"Monthly OT limit — Production\"`); the column header alone is not a label.","why":"32 identical selects in a 32-row table are indistinguishable to a screen reader and to anyone tabbing; on a screen whose only write action is reassignment, that is the whole screen.","impl_note":"js/screens/schedule.js:368 — add `aria-label=\"Move ${esc(e.name)} to another division\"`. js/screens/hr.js payOtq (~774) — add `aria-label=\"${d} monthly OT limit in hours\"` to each limit input; payOt (~746) same for the inline Limit fields; sched-control forms — add `aria-label` to the 9 bare inputs.","functional_flag":false,"scope":"hr"},"DA-HR-17":{"id":"DA-HR-17","phase":1,"dimension":"components","screen":"hr/web/pay-slips","wrong":"'Save schedule' is rendered disabled via `.btn[disabled]{opacity:.45}` (app.css:427). At 45% opacity `--acc-d` on `--acc-bg` measures ≈2.1:1 — below the 3:1 floor for any meaningful UI text — and nothing on the card says why it is disabled. The only hint is a separate 11px muted footnote ('PDF render & dispatch are build-phase') 40px lower.","should":"A disabled control keeps ≥3:1: `background:var(--line-2); color:var(--muted); border-color:var(--line)`, and the reason sits directly under the button as `.field .hint`.","why":"An unreadable grey rectangle reads as a rendering fault, not as a state, and the user has no way to learn what would enable it.","impl_note":"css/app.css:427 — replace with `.btn[disabled]{background:var(--line-2);border-color:var(--line);color:var(--muted);box-shadow:none;cursor:not-allowed;filter:none}`. js/screens/hr.js paySlips (~718) — move the build-phase note into a `<span class=\"hint\">` immediately below the button.","functional_flag":false,"scope":"hr"},"DA-HR-18":{"id":"DA-HR-18","phase":2,"dimension":"components","screen":"all hr web screens","wrong":"Stat tiles exist in two incompatible designs and three grid widths. Design A (`.kpi`, 20 screens): uppercase 10.8px label → 32px value → 11.5px subline, with the first tile accent. Design B (sched-cal, sched-manage): 26px value → uppercase 10px label, no subline, 5 across, values colour-coded per status. Grid width flips with no rule — `cols-4` ×16, `cols-3` ×20, `cols-2` ×12 in hr.js, so the same console shows 4-up (pulse, people, payroll), 3-up (docs, reports, holidays, advances, leveling) and 5-up (sched-cal) rows of identical-looking cards.","should":"One `.kpi` component. Row width is a function of the metric count: 4-up when there are 4 KPIs, 3-up when 3 — but the label/value order, sizes and subline never change.","why":"The KPI strip is the first thing read on every screen; two layouts for it means the eye re-learns the reading order on the schedule screens, and the 3-up/4-up flip makes card width — and therefore apparent importance — arbitrary.","impl_note":"js/screens/schedule.js — replace the `.cal-quick` tiles with `UI.kpi(label, value, sub)` inside `<div class=\"grid cols-4\">`; delete `css/schedule.css:21-31 .cal-quick*`. Keep `--acc-d` for the hero tile only (see DA-HR-01).","functional_flag":false,"scope":"hr"},"DA-HR-19":{"id":"DA-HR-19","phase":2,"dimension":"typography","screen":"hr/web/data, hr/web/group, hr/web/payroll, hr/web/pay-tax, hr/web/pay-dash, hr/web/sched-backup","wrong":"`.kpi .k-value` is fixed at 32px `--display` with `letter-spacing:-.035em`, which is sized for 2-4 digits. Six HR tiles put a string in it: 'phoungern-people' wraps mid-word to 2 lines at 1440 (253px track), 'Biometric (face / finger)' wraps to 2 lines, 'BCEL format', 'Oct 15, 2026', 'Sep 19 · 21:33', 'Compliant'. The wrap stretches the whole KPI row from 116px to 150px, so the three numeric siblings gain 34px of dead space under their subline.","should":"A `.kpi.text` modifier at 20px/1.25 with normal tracking and `overflow-wrap:anywhere` for identifier values; numeric tiles keep 32px.","why":"32px display type is the console's loudest typographic rank and it is being spent on labels; the wrap then dictates the height of the whole row, so the layout is driven by the longest string rather than by the data.","impl_note":"css/app.css — add `.kpi.text .k-value{font-size:20px;line-height:1.25;letter-spacing:-.01em;overflow-wrap:anywhere}`. js/ui.js:75 kpi() — accept `opts.text` and emit the class. Apply on hr.js:186 (Store), 575 (Primary method), 402 (Current run), 804 (Compliance), 607 (Remittance due), schedule backup (Last backup) and payroll 'Bank file'.","functional_flag":false,"scope":"hr"},"DA-HR-20":{"id":"DA-HR-20","phase":2,"dimension":"components","screen":"all hr web screens","wrong":"`.input, select.input, textarea.input` (app.css:431-434) never sets `appearance:none`, so every `<select>` in the console keeps the browser's own arrow, inner padding and focus chrome next to the custom 10px-radius text inputs — visible on comms (Template, Fallback), holidays (native date picker), clocking (Primary method), person-new (Division, Team), cashbook (Kind), pay-slips (When, Day), sched-staff (Move to…). The same rule's `width:100%` makes the sched-cal division filter span the full 1078px content width for a 6-option list, and the pay-tax number fields 325px wide for the value '6'.","should":"`appearance:none` plus an inline `--chevD` background chevron on `select.input`; `select.input{width:auto;min-width:180px;max-width:280px}` with an explicit `width:100%` only inside `.field`.","why":"Native select chrome is the single most obvious 'unfinished' tell in an otherwise consistent control set, and a 1078px-wide dropdown for six divisions destroys the proportion of the filter row.","impl_note":"css/app.css:431 — add to `select.input`: `appearance:none; -webkit-appearance:none; padding-right:32px; background-image:url(\"data:image/svg+xml,…chevD…\"); background-repeat:no-repeat; background-position:right 11px center; background-size:14px;`. css/schedule.css — add `.statusfilter .sf-scope{width:auto;min-width:180px;max-width:260px}`. css/app.css — `.field .input.numeric{max-width:140px}` and apply it on the pay-tax rate fields (hr.js ~804).","functional_flag":false,"scope":"hr"},"DA-HR-21":{"id":"DA-HR-21","phase":2,"dimension":"color","screen":"all hr web screens","wrong":"Border-radius is declared 10 different ways against 4 tokens: `.btn` 10px, `.btn.sm` 9px, `.btn.xs` 8px, `.input` 10px, `.rowitem .ric` 10px, `.qrow` 14px, `.idtag` 6px, `.cal-block` 7px, `.card` `var(--r)` 16px, `.app-body .card` 15px — none of the button or input values reference `--r-sm` (11px). Runtime sampling shows up to 7 distinct radii on one HR screen (access, sched-staff, sched-swaps).","should":"Buttons and inputs → `var(--r-sm)` (11px); small/xs buttons → a new `--r-xs` (8px); `.qrow` and `.app-body .card` → `var(--r)`; `.idtag`/`.cal-block` → `--r-xs`. Four radii total.","why":"Radius is the console's quietest consistency signal; seven values in one viewport is exactly the kind of drift the eye registers as 'assembled' rather than 'designed'.","impl_note":"css/tokens.css — add `--r-xs:8px`. css/app.css — `.btn{border-radius:var(--r-sm)}`, `.btn.sm{border-radius:var(--r-xs)}`, `.btn.xs{border-radius:var(--r-xs)}`, `.input{border-radius:var(--r-sm)}`, `.rowitem .ric{border-radius:var(--r-sm)}`, `.qrow{border-radius:var(--r)}`, `.idtag{border-radius:var(--r-xs)}`, `.app-body .card{border-radius:var(--r)}`; css/schedule.css:94 `.cal-block{border-radius:var(--r-xs)}`.","functional_flag":false,"scope":"hr"},"DA-HR-22":{"id":"DA-HR-22","phase":2,"dimension":"components","screen":"hr/web/holidays, hr/web/clocking, hr/web/data, hr/web/profile-view, hr/web/report-run, hr/web/sched-backup","wrong":"`UI.badge()` (ui.js:98-112) falls through to `[\"\", status]` for any unmapped value and prints the raw enum verbatim: 'public', 'company' (holidays KIND), 'face' (clocking PRIMARY METHOD, in the same column as the Title-case 'Biometric (face / finger)'), 'recent' (report-run), 'scheduled' (sched-backup). Mapped labels are Title case ('Pending', 'Expiring', 'Draft') except `ok:'OK'` which is all-caps — three casings for one component. Separately, data-manager STATE ('present', 'late', 'onleave') and profile-view Status ('present') render as plain `.tbl td` text with no badge at all, while the People directory renders the same concept as a `.badge.ok` pill.","should":"Every status passes through `UI.badge()`; the fallback title-cases and de-snakes the value; 'OK' becomes 'OK' only where it is an acronym; and the STATE/Status cells use the badge component.","why":"Status is the fastest read in a table. When the same field is a green pill on one screen and lowercase grey prose on another, the user has to read the word instead of seeing the colour.","impl_note":"js/ui.js:110 — change the fallback to `[\"\", String(status).replace(/[_-]/g,' ').replace(/^./,c=>c.toUpperCase())]` and add map entries `public:[\"acc\",\"Public\"], company:[\"\",\"Company\"], scheduled:[\"\",\"Scheduled\"], recent:[\"acc\",\"Recent\"]`. js/screens/dbviews.js + js/screens/hr.js profileView (~977) — wrap the STATE/Status value in `UI.badge(v)`.","functional_flag":false,"scope":"hr"},"DA-HR-23":{"id":"DA-HR-23","phase":2,"dimension":"spacing","screen":"hr/web/holidays, hr/web/cashbook","wrong":"The form's submit button is detached from its fields. holidays: the Date and Name inputs are 480px wide at x=324, the '+ Add holiday' primary is at x=1226-1358 — 746px to the right, past 600px of empty card. cashbook: fields 560px at x=324, 'Post to cashbook' at x=1195 — 611px away. person-new and profile-edit place the same pattern correctly (Cancel + primary directly under the last field, x≈700-992).","should":"The action row is right-aligned to the FIELD column, not to the card: `.pv-form + .form-actions{max-width:560px;display:flex;justify-content:flex-end}`.","why":"Gutenberg's terminal area is empty card; the eye finishes the last field and finds nothing, then has to travel 600px to the right to commit. person-new proves the correct pattern already exists in the same file.","impl_note":"css/app.css — add `.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:8px;max-width:560px}`. js/screens/hr.js:905 (cashbook) and the holidays form (~440) — replace the inline `style=\"display:flex;justify-content:flex-end\"` wrapper with `class=\"form-actions\"` and set the same `max-width` as the `.pv-form` above it.","functional_flag":false,"scope":"hr"},"DA-HR-24":{"id":"DA-HR-24","phase":2,"dimension":"components","screen":"hr/web/people, hr/web/pay-staff, hr/web/sched-staff, hr/web/sched-cal","wrong":"Four different components filter by division inside one persona: people = bare pill row under a search box (`All | Production | Sales | Finance`, accent-filled selected); pay-staff = the same pills inside a titled card 'Filter by division' 76px tall; sched-staff = a compact 19px tab strip with inline counts ('All staff 32 · Production 17 …') flush to the card edge; sched-cal/sched-manage = four status pills plus a full-width native select. Selected state differs too: accent-filled (people, pay-staff) vs white pill on a grey strip (sched-staff).","should":"One `.filterbar`: pill chips with counts, `[aria-pressed=true]` = `--acc-bg`/`--acc-ln`/`--acc-d`, sitting directly above the table it filters with 12px of space, no wrapper card.","why":"The same decision (which division am I looking at?) is made on four screens with four different controls; the user re-learns the filter on every screen and can't tell selected from hovered on sched-staff.","impl_note":"css/app.css — add `.filterbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}` reusing `.choice` for the chips. js/screens/hr.js people (~249), payStaff (~666) — drop the 'Filter by division' wrapper card and render `<div class=\"filterbar\">`. js/screens/schedule.js:368-area tab strip → the same `.filterbar` markup with `<b class=\"num\">` counts.","functional_flag":false,"scope":"hr"},"DA-HR-25":{"id":"DA-HR-25","phase":2,"dimension":"typography","screen":"hr/web/costbenefit, hr/web/time, hr/web/clocking, hr/web/pay-dash, hr/web/access","wrong":"The five HR bar charts follow no shared spec. costbenefit 'Top expenses' sets its value labels at 20px and its category labels at 20px — the largest chart type in the product, against 9.5-11px on every other chart (min font on that screen is 8.5px, so one screen spans 8.5→20px in chart text alone). Bar width is derived from the label width rather than being fixed: on time 'By division' the bars measure 66 / 55 / 66 / 55 / 54px because 'Production' and 'Logistics' are longer words. Three of the five charts have no axis or baseline at all; only costbenefit's second chart draws a gridline (labelled '257.5').","should":"One chart spec: value label 11px/700, category label 10.5px/600 uppercase `--muted`, fixed bar width `minmax(28px,1fr)` on a shared baseline, a single `--line` baseline rule on every chart.","why":"Bars whose width encodes label length encode nothing — the reader compares two visual variables (height and width) when only one is data. And 20px axis labels outrank the card title next to them.","impl_note":"css/app.css — add `.bars{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(28px,1fr);align-items:end;gap:clamp(8px,2cqi,24px);border-bottom:1px solid var(--line);padding-bottom:0}` `.bars .bv{font:700 11px/1 var(--font);font-variant-numeric:tabular-nums}` `.bars .bl{font:600 10.5px/1 var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}`. js/ui.js — route all five charts through one `bars()` helper and delete the per-chart inline font-size styles in js/screens/hr.js (costbenefit ~915, time ~347, clocking ~533, pay-dash ~607, access ~300).","functional_flag":false,"scope":"hr"},"DA-HR-26":{"id":"DA-HR-26","phase":2,"dimension":"spacing","screen":"hr/web/docs, hr/web/leave, hr/web/approval, hr/web/person, hr/web/sched-control","wrong":"`.grid.cols-2` stretches both children to the taller card, so the shorter one carries a large void: docs 'Generate now' is 3 buttons + 1 line in a 262px card (≈150px empty); leave 'Leave types & accrual' is a 4-row table in a 470px card (≈250px empty); approval 'Item' is 5 rows in a 400px card while 'Decide' is 175px (≈480×500px of empty canvas bottom-right); person's left field table is 5 rows in a 660px card (≈330px empty) while the right rail overflows below the fold; sched-control's shift-period column leaves ≈250px under 'Morning'.","should":"Two-column rows use `align-items:start` so each card sizes to its content; where the imbalance is structural (approval, person) the short card moves under the long one at the card level rather than being stretched.","why":"Stretched cards make emptiness look like missing content — on approval the eye reads a 500px blank as 'something failed to load' rather than 'this decision needs three fields'.","impl_note":"css/app.css:240 — add `align-items:start` to `.grid`. Where a card must still fill (KPI rows), add `.grid.cols-4{align-items:stretch}`. Verify docs/leave/approval/person/sched-control at 1440 and 1024.","functional_flag":false,"scope":"hr"},"DA-HR-27":{"id":"DA-HR-27","phase":2,"dimension":"color","screen":"hr/web/pay-ot","wrong":"On the same card the progress bar and the status chip disagree. Production: 412 / 480 h used (86%) draws an amber `--warn` bar but the card's top-right chip is `.badge.ok` green '50 h left'. Sales: 86/120 (72%) green bar, green chip. Logistics: 132/120 (110%) red bar, red '0 h left'. So the amber threshold fires on the bar but not on the chip, and the user sees green and amber describing the same quota 900px apart.","should":"One threshold table drives both (`<75%` ok, `75-99%` warn, `≥100%` bad) so bar fill and chip class are always the same status token.","why":"Two contradicting colour signals for one number is worse than no signal — the reader trusts the green chip and misses the division about to breach its OT cap.","impl_note":"js/screens/hr.js payOt (~746) — compute `const st = pct>=100?'bad':pct>=75?'warn':'ok'` once and use it for BOTH `UI.badge()` class and the bar fill (`background:var(--${st})`). Remove the independent chip logic.","functional_flag":false,"scope":"hr"},"DA-HR-28":{"id":"DA-HR-28","phase":2,"dimension":"typography","screen":"hr/web/payroll-run, hr/web/pay-dash, hr/web/pay-staff, hr/web/cashbook","wrong":"The same month's gross is formatted two ways across adjacent screens: payroll-run prints '₭ 186M' and '₭ 158M' (abbreviated), while pay-dash, pay-staff and cashbook print '₭ 193,760,226' and '₭ 176,959,809' (full grouping) for the same run. Payroll's own KPI shows '₭ 186M' while its Runs table on the same screen shows '₭ 276M / ₭ 271M / ₭ 268M' — three different totals in three different roundings within one viewport.","should":"One money formatter: `UI.kip()` full grouping with `font-variant-numeric:tabular-nums` in tables and detail cards; abbreviation (`₭ 194M`) allowed only in `.kpi .k-value` and always with the full figure in `.k-sub`.","why":"A reader comparing the dashboard to the run cannot tell whether 186M and 193,760,226 are the same number; on a payroll console that is the difference between reconciling and re-checking.","impl_note":"js/ui.js — add `kipShort(n)` returning `₭ ${(n/1e6).toFixed(0)}M`; use it ONLY inside `UI.kpi()` values and always pass the exact figure as the `sub`. js/screens/hr.js payrollRun (~432) — replace the hand-written '186M'/'158M' strings with `UI.kipShort()` + full figure in the subline.","functional_flag":false,"scope":"hr"},"DA-HR-29":{"id":"DA-HR-29","phase":2,"dimension":"components","screen":"hr/web/leveling","wrong":"The L0-L3 compliance chips render in two styles — L0 solid `--acc` with white text, L1/L2/L3 tinted `--acc-bg` — while the KPI above reads 'COMPLIANCE / L1'. The solid chip therefore marks L0, not the current level: the selected state points at the wrong value. Separately, 'Close run' — described one line above as immutable ('A closed run is immutable and posts staff cost to the cashbook') — is a `.btn.soft` tinted secondary with a check icon.","should":"`[aria-pressed=true]` on the chip matching `comp.level` only; 'Close run' is a full-weight `.btn` with a confirmation step, and a `.badge.warn` 'irreversible' sits beside it.","why":"A selected state on the wrong chip is worse than none — it tells the user the org is at L0 when the KPI says L1. And the console's most irreversible action carries its lightest button weight.","impl_note":"js/screens/hr.js leveling (~804 region) — render the four chips with `aria-pressed=\"${lvl===comp.level}\"` and style via `.choice[aria-pressed=\"true\"]` (see DA-HR-07); change `class=\"btn soft\"` on Close run to `class=\"btn\"` and add `${UI.badge('irreversible')}` beside it. The confirmation step itself is functional.","functional_flag":true,"scope":"hr"},"DA-HR-30":{"id":"DA-HR-30","phase":2,"dimension":"hierarchy","screen":"hr/web/advances","wrong":"32 identical `.btn.soft` 'Advance' buttons stack in the last column, producing a 90px-wide, 1500px-tall column of `--acc-bg` that is the most saturated area on the page — while the screen's three KPIs all read zero ('0', '₭ 0', '₭ 0'). The accent weight is on a per-row action that has never been used; the page has no primary and no empty state.","should":"Row action is `.btn.xs.ghost`, revealed on row hover/focus; the accent belongs to a single page-level action if one exists. With all KPIs at zero the table renders an empty state instead of 32 cap rows.","why":"Visual weight is inverted: a never-taken row action outweighs the summary numbers, and a screen whose data is entirely zero still looks busy.","impl_note":"js/screens/hr.js advances (~ line 860) — row button `class=\"btn soft\"` → `class=\"btn xs ghost\"`. css/app.css — add `.tbl tr .row-act{opacity:0;transition:opacity var(--t)} .tbl tr:hover .row-act, .tbl tr:focus-within .row-act{opacity:1}`.","functional_flag":false,"scope":"hr"},"DA-HR-31":{"id":"DA-HR-31","phase":3,"dimension":"empty states","screen":"hr/web/report-files, hr/web/reports, hr/web/pay-ot, hr/web/advances, hr/web/sched-swaps, hr/web/outbox","wrong":"There is no empty-state component. report-files stacks six folder cards each repeating the identical 22-word sentence 'Empty — runs land here automatically once a report has more than 3 (retention keeps 12 per report).' as 12.5px `--muted` body text — 1227px of near-identical copy. reports prints 'No runs yet — generate the first one.' as a bare line; pay-ot 'No pending OT for Sales.'; advances, sched-swaps and outbox render KPI rows of zeros instead of an empty state (0 / ₭ 0 / ₭ 0 and 1 / 0 / 0 / 1). `UI.empty()` exists (used by the mobile agenda) but no web screen calls it.","should":"`UI.empty(icon, title, body, action)` on every zero-data surface: 34px `.ric` icon, 13px `--ink` title, 11.5px `--muted` one-liner, one `.btn.ghost` next action. The retention rule appears once, in the page subtitle.","why":"Six cards saying the same sentence teach the user to stop reading cards; a zero-KPI row looks like a loading failure rather than a deliberate 'nothing here yet'.","impl_note":"js/ui.js — promote the `empty()` helper from js/screens/schedule.js into UI with signature `empty(icon,title,body,action)` and CSS `.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:32px 16px;text-align:center}`. js/screens/hr.js reportFiles (~505) — one folder row per report with the retention sentence moved to the page subtitle; reports (~494), payOt (~746), advances, schedSwaps, outbox — call `UI.empty()` when the collection is length 0.","functional_flag":false,"scope":"hr"},"DA-HR-32":{"id":"DA-HR-32","phase":3,"dimension":"loading states","screen":"all hr web screens","wrong":"No loading affordance exists anywhere in the HR persona: hr.js, schedule.js and reports.js render final markup synchronously with no skeleton, spinner or `aria-busy` state, and the 'Generate now' / 'Dry-run' / 'Snapshot now' / 'Validate run' / 'Send' actions have no pending style — the button stays fully interactive and identical while work is nominally in flight.","should":"A `.skeleton` shimmer block for the table/card body and a `.btn.is-busy` state (spinner glyph, `pointer-events:none`, `aria-busy=\"true\"`) applied to those five actions.","why":"Every long action in the console gives zero feedback, so the only way to know a run started is that the content changed — the app feels inert on exactly the operations that matter most.","impl_note":"css/app.css — add `.skeleton{background:linear-gradient(90deg,var(--line-2),var(--surface-2),var(--line-2));background-size:200% 100%;animation:sk 1.2s var(--ease) infinite;border-radius:var(--r-sm)}` + `@keyframes sk{to{background-position:-200% 0}}` (already covered by the `prefers-reduced-motion` block at app.css:52) and `.btn.is-busy{pointer-events:none;opacity:.7}`. Wire the class on the Generate now / Dry-run / Snapshot now / Validate run / Send handlers in js/screens/hr.js and js/screens/reports.js.","functional_flag":false,"scope":"hr"},"DA-HR-33":{"id":"DA-HR-33","phase":3,"dimension":"error states","screen":"hr/web/sched-control, hr/web/pay-otq, hr/web/import, hr/web/cashbook, hr/web/holidays","wrong":"The only error surface in HR is a `.badge.bad` status pill on data already in the table ('Failed', 'Flagged'). No field-level error style exists: `.input` has a focus rule (app.css:436) but no `.input.err`, and the 19 sched-control, 10 pay-otq, 4 cashbook and 2 holidays inputs have no error slot — an over-cap OT limit or a malformed CSV row can only be reported by the global toast.","should":"`.input[aria-invalid=\"true\"]{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad-bg)}` plus a `.field .err{font-size:11px;color:var(--bad-text)}` line under the field, matching the existing `.field .hint` pattern.","why":"A toast that disappears cannot be re-read next to the field that caused it; on a statutory config screen the user is left guessing which of four numbers was rejected.","impl_note":"css/app.css — after :436 add `.input[aria-invalid=\"true\"]{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad-bg)}` and `.field .err{font-size:11px;font-weight:600;color:var(--bad-text)}`. js/screens/hr.js + schedule.js — render `<span class=\"err\">` under the offending field instead of only firing the toast. Validation logic itself is functional.","functional_flag":true,"scope":"hr"},"DA-HR-34":{"id":"DA-HR-34","phase":3,"dimension":"motion","screen":"all hr web screens","wrong":"`--t:160ms var(--ease)` is applied to background/border/filter only (`.nav-item`, `.btn`, `.card` hover, `.tbl tr.click`, `.sc-track span`). Nothing animates on state change: the filter chips, the Month/Week/People/Shift segment, the calendar drag-drop target, the change-log row removal and the stepper's current-step advance all snap. The only press feedback in the console is `.btn:active{transform:translateY(1px)}`.","should":"Add a 160ms `--ease` transition to chip/segment `aria-pressed` changes, a 120ms scale-in on the calendar `.drop-hot` outline, and a 200ms height/opacity collapse on change-log row dismissal — all already covered by the `prefers-reduced-motion` reset at app.css:52.","why":"The schedule screens are the only direct-manipulation surface in the product; without transition the drop target and the published chip appear instantly, so the user cannot tell whether their drag registered.","impl_note":"css/app.css — `.choice, .seg button{transition:background var(--t), border-color var(--t), color var(--t)}`. css/schedule.css:55 — `.cal-day{transition:outline-color var(--t), background var(--t)}` and `.cal-day.drop-hot{transform:scale(1.015)}`. css/app.css — `.qrow.is-leaving{opacity:0;transform:translateY(-4px);transition:opacity var(--t),transform var(--t)}`.","functional_flag":false,"scope":"hr"},"DA-HR-35":{"id":"DA-HR-35","phase":3,"dimension":"empty states","screen":"hr/web/security, hr/mobile/me","wrong":"Two destinations are explanations standing in for content. hr/web/security renders 421 characters total — an H1, a one-line subtitle and a single card holding one paragraph ('auth_portal is currently off — the persona menu stands in for login…') above 830px of empty canvas; it is the emptiest screen in the persona. hr/mobile/me is a name card plus a card reading 'Mobile is deliberately light… That split is a v2.3 design decision, not a gap.'","should":"Both use `UI.empty()` with a single next action: security → 'Turn the portal flag on' (linking to the identity console); me → the profile row plus the two things the phone can do (Queue, Alerts) as `.btn.ghost` links.","why":"A rail item that opens a paragraph about why there is nothing here spends a navigation slot on an apology; an empty-state component with one action turns the same message into a route forward.","impl_note":"js/screens/hr.js — security: replace the prose card with `UI.empty('key','Portal sign-in is off','The persona menu stands in for login, so there is no live session to manage.', '<button class=\"btn ghost\" data-go=\"sysadmin/web/identity\">Open identity console</button>')`; mobile me: keep the profile row, replace the explanation card with two `.btn.ghost` links to Queue and Alerts.","functional_flag":false,"scope":"hr"}},"personas":{"staff":"Staff · Adeptio Me","manager":"Manager · Adeptio Team","hr":"HR · Adeptio Ops","ceo":"CEO · Adeptio Board","sysadmin":"Sys Admin · Adeptio Console"}}</script>
<script>
(function(){
"use strict";

var DATA = JSON.parse(document.getElementById('data').textContent);
var journeys = DATA.journeys || [];
var flows = DATA.flows || {};
var hotspots = DATA.hotspots || {};
var themes = DATA.themes || {};
var proposals = DATA.proposals || {};
var design = DATA.design || {};
var personas = DATA.personas || {};

var SHOT_DIR = "audit-shots";
var SHORT_PERSONA = {staff:"Staff", manager:"Manager", hr:"HR", ceo:"CEO", sysadmin:"Sys Admin"};
var PERSONA_ORDER = ["staff","manager","hr","ceo","sysadmin"];

var journeyById = {};
journeys.forEach(function(j){ journeyById[j.id] = j; });
var maxScore = journeys.reduce(function(m,j){ return Math.max(m, j.score); }, 1);

// theme -> journeys reverse index
var themeJourneys = {};
journeys.forEach(function(j){
  (j.themes||[]).forEach(function(tid){
    (themeJourneys[tid] = themeJourneys[tid] || []).push(j.id);
  });
});

/* ---------------- helpers ---------------- */
function esc(s){
  s = (s === undefined || s === null) ? "" : String(s);
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function code(s){ // escape then turn `x` into <code>x</code>
  // a short, space-free token (an id, a css var, a file:line ref) gets white-space:nowrap
  // so it never breaks mid-word at an internal hyphen; a longer code/CSS snippet keeps
  // normal wrapping (it may contain its only safe break points at hyphens, so it must be
  // allowed to break there to avoid overflowing a narrow column).
  return esc(s).replace(/`([^`]+)`/g, function(_,m){
    var atomic = (m.indexOf(" ") === -1 && m.length <= 36) ? ' class="atomic"' : "";
    return "<code"+atomic+">"+m+"</code>";
  });
}
function titleCase(s){ return String(s||"").replace(/(^|\s|-)\w/g, function(c){ return c.toUpperCase(); }); }

function shotPath(screen){
  var parts = String(screen||"").split("/");
  var persona, device, name;
  if (parts.length >= 3){ persona = parts[0]; device = parts[1]; name = parts.slice(2).join("-"); }
  else { persona = parts[0]; name = parts[1]; device = "shell"; }
  var width = (device === "mobile") ? 390 : 1440;
  return encodeURI(SHOT_DIR + "/" + persona + "--" + device + "-" + name + "-" + width + ".jpg");
}

function personaChip(p){
  if (!p) return "";
  return '<span class="chip persona" data-p="'+esc(p)+'">'+esc(SHORT_PERSONA[p] || titleCase(p))+'</span>';
}
function statusChips(status){
  var out = [];
  ["live","partial","stub"].forEach(function(k){
    var n = status && status[k];
    if (n){ out.push('<span class="chip status st-'+k+'">'+n+' '+k+'</span>'); }
  });
  return out.join("");
}
function areaChips(areas){
  return (areas||[]).map(function(a){ return '<span class="chip area">'+esc(titleCase(a))+'</span>'; }).join("");
}
function sevChip(sev){ return '<span class="chip sev sev-'+esc(sev)+'">'+esc(sev)+'</span>'; }
function effortChip(e){ return '<span class="chip effort">'+esc(e)+'</span>'; }
function themeTitle(id){ return themes[id] ? themes[id].title : id; }

function scoreBar(score){
  var pct = Math.round((score / maxScore) * 100);
  return '<div class="score-wrap"><div class="score-bar"><div class="score-fill" style="width:'+pct+'%"></div></div><span class="score-num">'+score+'</span></div>';
}

/* ---------------- nav model ---------------- */
function navItems(){
  var items = [{href:"#overview", label:"Overview", group:null}];
  journeys.forEach(function(j, i){
    items.push({href:"#journey/"+j.id, label:j.title, id:j.id, rank:i+1, group:"journeys"});
  });
  items.push({href:"#matrix", label:"Matrix", group:null});
  items.push({href:"#themes", label:"Themes ("+Object.keys(themes).length+")", group:null});
  return items;
}
var NAV = navItems();

function buildRail(){
  var rail = document.getElementById("rail");
  var html = "";
  var inGroup = false;
  NAV.forEach(function(it){
    if (it.group === "journeys" && !inGroup){ html += '<div class="rail-label">Journeys, ranked</div>'; inGroup = true; }
    if (it.group !== "journeys" && inGroup){ inGroup = false; }
    var rankHtml = it.rank ? '<span class="rail-rank">'+it.rank+'</span>' : "";
    html += '<a class="rail-link" href="'+it.href+'" data-href="'+it.href+'"><span class="rail-jtitle">'+rankHtml+esc(it.label)+'</span></a>';
  });
  rail.innerHTML = html;

  var sel = document.getElementById("rail-select");
  sel.innerHTML = NAV.map(function(it){
    return '<option value="'+it.href+'">'+ (it.rank ? it.rank+". " : "") + esc(it.label) +'</option>';
  }).join("");
  sel.addEventListener("change", function(){ location.hash = sel.value; });
}

function highlightRail(hash){
  document.querySelectorAll(".rail-link").forEach(function(a){
    a.classList.toggle("active", a.getAttribute("data-href") === hash);
  });
  var sel = document.getElementById("rail-select");
  if (sel && [].slice.call(sel.options).some(function(o){ return o.value === hash; })) sel.value = hash;
}

/* ---------------- top bar meta ---------------- */
document.getElementById("tb-date").textContent = DATA.generated || "";
document.getElementById("tb-counts").textContent =
  journeys.length + " journeys · " + Object.keys(hotspots).length + " hotspots · " + Object.keys(design).length + " design findings";

/* ---------------- collapsible rows (>6) ---------------- */
function applyRowCollapse(container, limit){
  var rows = container.querySelectorAll(".row");
  if (rows.length <= limit) return;
  for (var i = limit; i < rows.length; i++) rows[i].classList.add("hidden-extra");
  var btn = document.createElement("button");
  btn.type = "button"; btn.className = "show-all-btn";
  btn.textContent = "Show all " + rows.length;
  btn.addEventListener("click", function(){
    for (var i = limit; i < rows.length; i++) rows[i].classList.remove("hidden-extra");
    btn.setAttribute("hidden","");
  });
  container.parentElement.appendChild(btn);
}

/* ---------------- views ---------------- */
var main = document.getElementById("main");
var searchInput = document.getElementById("search");
var currentView = "overview";

function renderOverview(filter){
  currentView = "overview";
  searchInput.placeholder = "Filter journeys by title, persona or area…";
  var f = (filter||"").trim().toLowerCase();
  var rows = journeys.map(function(j, i){ return {j:j, rank:i+1}; }).filter(function(r){
    if (!f) return true;
    var hay = (r.j.title + " " + r.j.persona + " " + (r.j.areas||[]).join(" ")).toLowerCase();
    return hay.indexOf(f) !== -1;
  });

  var trs = rows.map(function(r){
    var j = r.j;
    return '<tr data-goto="#journey/'+j.id+'">'
      + '<td class="rank" data-label="Rank">'+r.rank+'</td>'
      + '<td class="title" data-label="Journey"><a href="#journey/'+j.id+'">'+esc(j.title)+'</a></td>'
      + '<td data-label="Persona">'+personaChip(j.persona)+'</td>'
      + '<td class="areas-cell" data-label="Areas">'+areaChips(j.areas)+'</td>'
      + '<td class="status-cell" data-label="Status">'+statusChips(j.status)+'</td>'
      + '<td data-label="Hotspots"><span class="count-num">'+(j.hotspots||[]).length+'</span></td>'
      + '<td data-label="Findings"><span class="count-num">'+(j.design_findings||[]).length+'</span></td>'
      + '<td data-label="Score">'+scoreBar(j.score)+'</td>'
      + '</tr>';
  }).join("");

  main.innerHTML =
    '<section class="view" id="view-overview">'
    + '<div class="view-head">'
    + '<h2>Journeys to fix</h2>'
    + '<p class="lede">A journey is one user’s task carried end to end across screens and, often, more than one persona — assembled from the app’s real dataflows, not the nav tree. Each row below is one journey: its primary persona, the product areas it touches, how much of its path is live versus partial or stub, how many logic hotspots and design findings sit on it, and a score (100 = works cleanly end to end) shown relative to the worst journey in the set. Click a row to see its step-by-step path, what breaks, and the fix.</p>'
    + '</div>'
    + '<table class="j-table"><thead><tr>'
    + '<th>Rank</th><th>Journey</th><th>Persona</th><th>Areas</th><th>Status</th><th>Hotspots</th><th>Findings</th><th>Score</th>'
    + '</tr></thead><tbody id="ov-tbody">' + (trs || '<tr><td colspan="8" style="padding:18px 12px;color:var(--muted-2);">No journeys match “'+esc(filter)+'”.</td></tr>') + '</tbody></table>'
    + '</section>';

  main.querySelectorAll("#ov-tbody tr[data-goto]").forEach(function(tr){
    tr.addEventListener("click", function(e){
      if (e.target.closest("a")) return;
      location.hash = tr.getAttribute("data-goto");
    });
  });
}

function stepCard(step, j){
  var chips = (step.design||[]).map(function(id){
    return '<button type="button" class="chip finding" data-finding="'+esc(id)+'">'+esc(id)+'</button>';
  }).join("");
  var src = shotPath(step.screen);
  return '<div class="step-card" data-persona="'+esc(step.persona)+'">'
    + '<div class="step-top"><span class="step-num">'+step.n+'</span>'+personaChip(step.persona)+'</div>'
    + '<div class="step-screen">'+esc(step.screen)+'</div>'
    + '<p class="step-does">'+esc(step.does)+'</p>'
    + '<div class="step-thumb"><img loading="lazy" alt="Screenshot of '+esc(step.screen)+'" src="'+src+'" onerror="this.parentElement.classList.add(\'broken\')">'
    + '<span class="fallback">screenshot folder not found</span></div>'
    + (chips ? '<div class="step-chips">'+chips+'</div>' : '')
    + '</div>';
}

function renderStepStrip(j){
  var html = '<div class="steps-row">';
  j.steps.forEach(function(s, i){
    html += stepCard(s, j);
    if (i < j.steps.length - 1) html += '<div class="step-arrow" aria-hidden="true">›</div>';
  });
  html += '</div>';
  return html;
}

function renderBreaks(j){
  // Logic: hotspots grouped by theme
  var byTheme = {};
  var themeOrder = [];
  (j.hotspots||[]).forEach(function(hid){
    var h = hotspots[hid];
    if (!h) return;
    var tid = h.theme || "?";
    if (!byTheme[tid]){ byTheme[tid] = []; themeOrder.push(tid); }
    byTheme[tid].push(h);
  });
  var logicHtml = themeOrder.map(function(tid){
    var rows = byTheme[tid].map(function(h){
      return '<li class="row"><span class="row-id">'+esc(h.id)+'</span>'+sevChip(h.severity)
        + '<span class="row-text">'+code(h.note)+'</span>'
        + '<span class="row-evidence">'+code(h.evidence)+'</span></li>';
    }).join("");
    return '<h4 class="group-h">'+esc(themeTitle(tid))+'</h4><ul>'+rows+'</ul>';
  }).join("") || '<p class="empty-note">No logic hotspots recorded on this journey.</p>';

  // Design: findings grouped by phase
  var byPhase = {1:[],2:[],3:[]};
  (j.design_findings||[]).forEach(function(did){
    var d = design[did];
    if (!d) return;
    (byPhase[d.phase] = byPhase[d.phase] || []).push(d);
  });
  var designHtml = [1,2,3].map(function(ph){
    if (!byPhase[ph] || !byPhase[ph].length) return "";
    var rows = byPhase[ph].map(function(d){
      return '<li class="row"><span class="row-id">'+esc(d.id)+'</span>'
        + '<span class="mono" style="font-size:11px;color:var(--muted);">'+esc(d.screen)+'</span>'
        + '<span class="row-text">'+code(d.wrong)+'</span></li>';
    }).join("");
    return '<h4 class="group-h">Phase '+ph+'</h4><ul>'+rows+'</ul>';
  }).join("") || '<p class="empty-note">No design findings recorded on this journey.</p>';

  return '<div class="section-block"><h3>What breaks in this journey</h3>'
    + '<div class="breaks-grid">'
    + '<div class="breaks-col"><h4 style="font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;">Logic</h4><div class="breaks-list" id="logic-list">'+logicHtml+'</div></div>'
    + '<div class="breaks-col"><h4 style="font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;">Design</h4><div class="breaks-list" id="design-list">'+designHtml+'</div></div>'
    + '</div></div>';
}

function renderProposals(j){
  var ids = (j.proposals||[]).slice();
  ids.sort(function(a,b){
    var pa = proposals[a], pb = proposals[b];
    var ca = (pa && pa.area === "cross") ? 0 : 1;
    var cb = (pb && pb.area === "cross") ? 0 : 1;
    return ca - cb;
  });
  var rows = ids.map(function(pid){
    var p = proposals[pid];
    if (!p) return "";
    var crossBadge = p.area === "cross" ? '<span class="chip cross">cross-cutting</span>' : "";
    return '<div class="prop-row">'
      + '<div class="prop-id">'+esc(p.id)+'</div>'
      + '<div class="prop-body">'
      + '<div class="prop-title-row"><span class="prop-title">'+esc(p.title)+'</span>'+effortChip(p.effort)+crossBadge+'</div>'
      + '<button type="button" class="clamp-btn"><span class="clamp-text">'+code(p.what)+'</span> <span class="more-hint">more / less</span></button>'
      + '</div></div>';
  }).join("");
  return '<div class="section-block"><h3>Proposals that fix it</h3>' + (rows || '<p class="empty-note">No proposals linked yet.</p>') + '</div>';
}

function renderFlows(j){
  var ids = j.flows || [];
  var rows = ids.map(function(fid){
    var f = flows[fid];
    if (!f) return "";
    var stepsHtml = (f.steps||[]).map(function(s){
      return '<tr><td class="wnum">'+s.n+'</td><td>'+personaChip(s.persona)+'</td><td>'+esc(s.menu||"")+'</td>'
        + '<td>'+code(s.action||"")+'</td>'
        + '<td>'+ ((s.writes && s.writes.length) ? '<ul>'+s.writes.map(function(w){ return '<li>'+code(w)+'</li>'; }).join("")+'</ul>' : '<span class="empty-note">none</span>') +'</td></tr>';
    }).join("");
    return '<div class="flow-row">'
      + '<div class="flow-top"><span class="flow-id">'+esc(f.id)+'</span><span class="flow-name">'+esc(f.name)+'</span><span class="chip status st-'+esc(f.status)+'">'+esc(f.status)+'</span></div>'
      + '<button type="button" class="clamp-btn" style="margin-top:4px;"><span class="clamp-text">'+code(f.outcome)+'</span> <span class="more-hint">more / less</span></button>'
      + '<button type="button" class="flow-toggle" aria-expanded="false"><span class="caret">▸</span> Steps (' + (f.steps||[]).length + ')</button>'
      + '<div class="flow-steps-wrap" hidden>'
      + '<table class="flow-mini"><thead><tr><th>#</th><th>Persona</th><th>Menu</th><th>Action</th><th>Writes</th></tr></thead><tbody>'+stepsHtml+'</tbody></table>'
      + '</div></div>';
  }).join("");
  return '<div class="section-block"><h3>Flows behind it</h3>' + (rows || '<p class="empty-note">No flows linked.</p>') + '</div>';
}

function renderJourney(id){
  currentView = "journey";
  var j = journeyById[id];
  if (!j){
    main.innerHTML = '<section class="view"><p>Journey “'+esc(id)+'” was not found. <a href="#overview">Back to overview</a>.</p></section>';
    return;
  }
  main.innerHTML =
    '<section class="view" id="view-journey">'
    + '<div class="j-crumb"><a href="#overview">Journeys</a> / '+esc(j.id)+'</div>'
    + '<div class="j-head"><h2>'+esc(j.title)+'</h2>'
    + '<p class="j-goal">'+esc(j.goal)+'</p>'
    + '<div class="j-meta">'+personaChip(j.persona)+areaChips(j.areas)+statusChips(j.status)+scoreBar(j.score)+'</div>'
    + '</div>'
    + '<div class="section-block"><h3>The journey, step by step</h3>'+renderStepStrip(j)+'</div>'
    + renderBreaks(j)
    + '<div class="section-block"><h3>To be</h3><div class="tobe">'+code(j.tobe)+'</div></div>'
    + renderProposals(j)
    + renderFlows(j)
    + '</section>';

  var logicList = document.getElementById("logic-list");
  var designList = document.getElementById("design-list");
  if (logicList) applyRowCollapse(logicList, 6);
  if (designList) applyRowCollapse(designList, 6);
}

function renderMatrix(){
  currentView = "matrix";
  searchInput.placeholder = "Filter journeys…";
  var head = '<tr><th>Journey</th>' + PERSONA_ORDER.map(function(p){ return '<th>'+esc(SHORT_PERSONA[p])+'</th>'; }).join("") + '</tr>';
  var rows = journeys.map(function(j){
    var present = {};
    j.steps.forEach(function(s){ present[s.persona] = true; });
    var cells = PERSONA_ORDER.map(function(p){
      var on = !!present[p];
      return '<td class="mdot" data-label="'+esc(SHORT_PERSONA[p])+'"><span class="pdot '+(on?'on':'off')+'" data-p="'+p+'"></span></td>';
    }).join("");
    return '<tr><td class="mj-title" data-label="Journey"><a href="#journey/'+j.id+'">'+esc(j.title)+'</a></td>'+cells+'</tr>';
  }).join("");
  main.innerHTML = '<section class="view" id="view-matrix">'
    + '<div class="view-head"><h2>Journeys × personas</h2><p class="lede">Which persona’s screens sit on each journey’s path — so a fix on one screen is read against who it actually reaches.</p></div>'
    + '<table class="matrix-table"><thead>'+head+'</thead><tbody>'+rows+'</tbody></table>'
    + '</section>';
}

function renderThemes(filter){
  currentView = "themes";
  searchInput.placeholder = "Filter themes by title or note…";
  var f = (filter||"").trim().toLowerCase();
  var ids = Object.keys(themes).sort();
  var cards = ids.filter(function(tid){
    if (!f) return true;
    var t = themes[tid];
    return (t.title + " " + t.note).toLowerCase().indexOf(f) !== -1;
  }).map(function(tid){
    var t = themes[tid];
    var jids = themeJourneys[tid] || [];
    var chips = jids.map(function(jid){
      var j = journeyById[jid];
      return '<a class="chip" href="#journey/'+jid+'">'+esc(j ? j.title : jid)+'</a>';
    }).join("") || '<span class="empty-note">No journey currently carries this theme.</span>';
    return '<div class="theme-card"><h4><span class="theme-id">'+esc(tid)+'</span>'+esc(t.title)+'</h4>'
      + '<p class="theme-note">'+code(t.note)+'</p>'
      + '<div class="theme-jlist">'+chips+'</div></div>';
  }).join("");
  main.innerHTML = '<section class="view" id="view-themes">'
    + '<div class="view-head"><h2>Themes</h2><p class="lede">Thirteen recurring root causes behind the '+Object.keys(hotspots).length+' logic hotspots, and which journeys carry each one.</p></div>'
    + (cards || '<p class="empty-note">No themes match “'+esc(filter)+'”.</p>')
    + '</section>';
}

/* ---------------- router ---------------- */
function route(){
  var hash = decodeURIComponent(location.hash || "").replace(/^#\/?/, "");
  var full = "#" + hash;
  document.body.scrollTop = 0; document.documentElement.scrollTop = 0;

  if (!hash || hash === "overview"){ full = "#overview"; renderOverview(searchInput.value); }
  else if (hash.indexOf("journey/") === 0){ renderJourney(hash.slice(8)); }
  else if (hash === "matrix"){ renderMatrix(); }
  else if (hash.indexOf("themes") === 0){ renderThemes(searchInput.value); }
  else { full = "#overview"; renderOverview(searchInput.value); }

  highlightRail(full);
  main.focus({preventScroll:true});
}

/* ---------------- events ---------------- */
searchInput.addEventListener("input", function(){
  if (currentView === "overview") renderOverview(searchInput.value);
  else if (currentView === "themes") renderThemes(searchInput.value);
});

main.addEventListener("click", function(e){
  var chip = e.target.closest(".chip.finding");
  if (chip){ openPopover(chip.getAttribute("data-finding")); return; }
  var clampBtn = e.target.closest(".clamp-btn");
  if (clampBtn){ clampBtn.classList.toggle("expanded"); return; }
  var flowToggle = e.target.closest(".flow-toggle");
  if (flowToggle){
    var wrap = flowToggle.nextElementSibling;
    var open = flowToggle.getAttribute("aria-expanded") === "true";
    flowToggle.setAttribute("aria-expanded", open ? "false" : "true");
    if (wrap) wrap.hidden = open;
    return;
  }
});

function openPopover(id){
  var d = design[id];
  var pop = document.getElementById("popover");
  var backdrop = document.getElementById("pop-backdrop");
  document.getElementById("pop-title").textContent = id + (d ? " · " + titleCase(d.dimension) : "");
  document.getElementById("pop-screen").textContent = d ? d.screen : "";
  document.getElementById("pop-wrong").innerHTML = d ? code(d.wrong) : "Not found.";
  document.getElementById("pop-should").innerHTML = d ? code(d.should) : "";
  document.getElementById("pop-impl").innerHTML = d ? code(d.impl_note) : "";
  pop.hidden = false; backdrop.hidden = false;
  document.getElementById("pop-close").focus();
}
function closePopover(){
  document.getElementById("popover").hidden = true;
  document.getElementById("pop-backdrop").hidden = true;
}
document.getElementById("pop-close").addEventListener("click", closePopover);
document.getElementById("pop-backdrop").addEventListener("click", closePopover);
document.addEventListener("keydown", function(e){
  if (e.key === "Escape") closePopover();
});

window.addEventListener("hashchange", route);

/* ---------------- boot ---------------- */
buildRail();
route();

})();
</script>
</body>
</html>
