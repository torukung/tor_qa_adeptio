tton.","why":"An operator landing on a Console screen should know in two seconds what this screen is for. When 72% of screens open with two equal-weight grey pills, every screen reads as a report rather than a place where work happens - and it leaves the destructive controls (DA-SYS-04 to DA-SYS-09) as the only high-contrast targets on the page.","impl_note":"js/screens/sysadmin.js: promote one action per screen to `class=\"btn\"` - health:'Test gateways', devmonitor:'Test all', sync:'Sync Active Directory' (move from body to actions), identity:'Demo outbox'→ replace with a `.btn` 'Invite account', audit:'Export', dbops: add nothing (destructive-only screen). Convert `data-go` header buttons (db_identity, Providers, BioMetrics, Directory sync, Identity console) from `.btn.ghost` to `<button class=\"link\">…${icon('chevR')}</button>` using the existing app.css:277 .card-head .link pattern.","functional_flag":false,"scope":"sysadmin"},"DA-SYS-15":{"id":"DA-SYS-15","phase":2,"dimension":"color","screen":"sysadmin/web/devmonitor","wrong":"The Clock-out comparison series is drawn in --muted-2 #AFABA1 at 1.6px with a 4-4 dash, and its legend swatch uses the same token - 2.29:1 against --surface. Against a --line-2 gridline at 3.76:1 the dashed path is effectively invisible; the chart reads as single-series despite the legend promising two.","should":"The comparison series uses a token that survives against white at 3:1 for non-text graphics - --muted #7C786F, at 2px with a 6-3 dash so the dash pattern itself carries the distinction.","why":"Clock-out against clock-in is the comparison the chart exists to make. If the second series cannot be seen, the card is a single line plus a misleading legend.","impl_note":"js/ui.js:189: `stroke=\"var(--muted-2)\" stroke-width=\"1.6\" stroke-dasharray=\"4 4\"` → `stroke=\"var(--muted)\" stroke-width=\"2\" stroke-dasharray=\"6 3\"`. js/screens/sysadmin.js:638: legend entry `c: \"var(--muted-2)\"` → `c: \"var(--muted)\"`.","functional_flag":false,"scope":"sysadmin"},"DA-SYS-16":{"id":"DA-SYS-16","phase":2,"dimension":"iconography","screen":"sysadmin/web/roles","wrong":"The Capability matrix introduces a second, incompatible icon system: six Unicode glyphs (✎ ✓ ⚙ ◴ ∑ ⚒) carry the meaning of all 50 cells, rendered in the body font at 12px rather than in the app's 1.7-weight stroked SVG set, with a legend strip at the bottom of the card to decode them. Two of the six (◴ and ⚒) have no counterpart in the SVG set at all. Separately, the 12 '— none' cells use --muted-2 #AFABA1 at 2.29:1 while carrying essential information - that a persona has no access to a module.","should":"Capability is expressed by the existing SVG icon set (edit, check, settings, eye, chart, key) at 14px, and '— none' uses --muted (4.40:1) or, better, an empty cell with a --line-2 rule so absence reads as absence.","why":"A legend is a confession that the symbols failed. Mixing a glyph 'library' into an app with a coherent stroked icon set is the most visible consistency break in the persona, and the one cell state that matters most for a permissions audit - 'no access' - is the one rendered at 2.29:1.","impl_note":"js/screens/sysadmin.js:204: change the '—' branch colour from `var(--muted-2)` to `var(--muted)`. Replace the six glyph literals at :194-203 with `${icon('edit')}` / `${icon('check')}` / `${icon('settings')}` / `${icon('eye')}` / `${icon('chart')}` / `${icon('key')}` and add `css/app.css .tbl td .small svg{ width:13px; height:13px; vertical-align:-2px; opacity:.85 }` (also covered by the DA-SYS-01 base rule). Rewrite the legend at :206 with the same icon() calls.","functional_flag":false,"scope":"sysadmin"},"DA-SYS-17":{"id":"DA-SYS-17","phase":2,"dimension":"typography","screen":"sysadmin/web/sync","wrong":"The card title renders the literal string 'Find a directory user — query &amp; bind one'. card() in ui.js:84 runs esc() over the title, so a source string that already contains the entity `&amp;` is escaped a second time into `&amp;amp;` and displays as raw markup at 13.2px/700 in the card head.","should":"'Find a directory user — query & bind one'.","why":"Raw HTML entities in a heading are the most immediately visible sign of an unfinished build, and it sits at the top of the persona's search card.","impl_note":"js/screens/authviews.js:689: `card(\"Find a directory user — query &amp; bind one\", …)` → `card(\"Find a directory user — query & bind one\", …)`. Leave ui.js:84 esc() in place; audit no other card() title for pre-escaped entities (this is the only one).","functional_flag":false,"scope":"sysadmin"},"DA-SYS-18":{"id":"DA-SYS-18","phase":2,"dimension":"color","screen":"all sysadmin web screens","wrong":"Every filled primary in the Console is white text on --sys #5E91A0 = 3.48:1, below 4.5 for the 12.8px/700 label .btn ships, and below 4.5 for the 11.3px .btn.xs and 10.5px .nav-item .count badge. On backups this hits 'Full backup now', 'Back up now (full)', 'Back up now' and the row 'Restore'; on biometrics 'Add device' plus five 'Add <Vendor>' buttons; on every screen the rail count badges.","should":"Filled accent buttons and count badges use --sys-d #345661 (7.93:1 with white) as the fill, keeping --sys for borders, focus rings and chart strokes where the 3:1 non-text threshold applies.","why":"The primary action is the one element that must never be hard to read, and the Console's accent is the weakest of the five personas as a text background. Fixing it here also makes DA-SYS-04's destructive tier legible by contrast rather than by hue alone.","impl_note":"css/app.css:411: `background:var(--acc)` → `background:var(--acc-d)` and `border-color:var(--acc-d)` on `.btn`; app.css:415 `.btn:not(.ghost):not(.danger):hover{ box-shadow:0 6px 16px -8px var(--acc) }` stays (shadow, not text). app.css:210: `.nav-item .count{ background:var(--acc) }` → `background:var(--acc-d)`. This is a shared token path - coordinate with the design-system reviewer, since it improves all five personas (staff 2.99:1, mgr 3.23:1, hr 3.31:1, ceo 3.72:1 all fail the same way).","functional_flag":false,"scope":"sysadmin"},"DA-SYS-19":{"id":"DA-SYS-19","phase":2,"dimension":"components","screen":"sysadmin/web/functions","wrong":"16 binary feature flags are controlled by a button whose label is the *destination* state and whose weight is inverted: an ON row shows 'Turn off' in `.btn.xs.soft`, an OFF row shows 'Turn on' in filled `.btn.xs`. Scanning the column, the accent-filled buttons mark the features that are *disabled* - the eye is pulled to everything that is switched off. Current state is only discoverable from the row's leading check/x circle and the sub-line text. The design system already ships a `.switch` component (app.css:453-456) that is used nowhere in sysadmin.js.","should":"A `.switch` per row, right-aligned, reading current state directly; the row label and sub-line stop restating 'on'/'paused'.","why":"A feature-flag screen is read as a column of states, not a column of commands. Encoding the state in a verb, and then giving the strongest colour to the off state, forces the reader to invert the whole page mentally.","impl_note":"js/screens/sysadmin.js:713: replace the side button with `<button class=\"switch\" role=\"switch\" aria-checked=\"${on}\" aria-label=\"${esc(r.label)}\" data-act=\"flag:${k}\"></button>` and drop the trailing `· ${on ? \"on\" : \"paused…\"}` from the sub-line. Keep the leading `.ric` icon neutral (`icon('flag')`) for every row rather than check/x, since the switch now carries state.","functional_flag":false,"scope":"sysadmin"},"DA-SYS-20":{"id":"DA-SYS-20","phase":2,"dimension":"hierarchy","screen":"sysadmin/web/biometrics","wrong":"The Vendor catalogue puts five filled `.btn.sm` accent CTAs on the page ('Add ZKTeco', 'Add Hikvision', 'Add Dahua', 'Add Sunmi', 'Add HIP'), each identical in weight to the page's single header primary 'Add device'. Six equal-weight filled buttons compete on one screen, and all five vendor buttons route to the same device-new flow the header primary reaches.","should":"Vendor cards use `.btn.sm.ghost`; 'Add device' in the header remains the only filled accent control.","why":"Five identical primaries is the same as zero. The header CTA is the general path and the vendor cards are the specific ones - that relationship should be visible in weight, not flattened.","impl_note":"js/screens/sysadmin.js:41: `class=\"btn sm\"` → `class=\"btn sm ghost\"`.","functional_flag":false,"scope":"sysadmin"},"DA-SYS-21":{"id":"DA-SYS-21","phase":2,"dimension":"components","screen":"sysadmin/web/biometrics","wrong":"'Vendor catalogue — integrate by lane' and 'Premium & open — Enterprise' are rendered with `.sec-h` (app.css:863, 13px/700 --ink) floating on the raw canvas between cards, with an inline `style=\"margin:18px 0 2px\"` and `margin:18px 0 8px` - two different values for the same construct. Every other section on this screen and across the persona is a `.card` with a `.card-head` (13.2px + 15px accent icon). This is a third heading level used twice in 29 screens.","should":"One section-heading construct across the persona - either both become card-wrapped sections, or `.sec-h` is promoted into the system with a fixed margin and an accent rule above it, and adopted everywhere a group of sibling cards needs a label.","why":"Two ad-hoc headings in 29 screens is the definition of an un-owned pattern; readers cannot tell whether `.sec-h` outranks or underranks a card head, so the page's outline is ambiguous.","impl_note":"css/app.css:863: add `margin:24px 0 10px; padding-top:18px; border-top:1px solid var(--line-2); letter-spacing:.06em; text-transform:uppercase; font-size:11px; color:var(--muted);` so .sec-h reads clearly *below* a card head. js/screens/sysadmin.js:446 and :449: delete the inline `style=\"margin:…\"` attributes.","functional_flag":false,"scope":"sysadmin"},"DA-SYS-22":{"id":"DA-SYS-22","phase":2,"dimension":"typography","screen":"sysadmin/web/platsettings, sysadmin/web/licensing, sysadmin/web/dbops, sysadmin/web/gate, sysadmin/web/dbstore, sysadmin/web/audit","wrong":"The KPI value slot (.k-value, 32px display) has no content discipline and is being fed non-numeric strings of wildly different optical mass: 'Open', 'OFF', '∞', 'stub', 'nightly', 'face + card', 'DEV-ZK01', '7 years', 'Secured'. In a four-up row this produces values ranging from a 14px-tall ∞ glyph to an 11-character string, so the row loses its baseline rhythm and the numerals that *are* numerals ('242', '51 KB', '15 / 15') no longer stand out.","should":"The KPI value is a number, a ratio or a short unit-bearing figure; any word-valued state moves to the k-sub line with the label carrying the noun, or uses a badge instead of the 32px slot.","why":"The KPI strip is the persona's scan line - four large figures the eye reads in one pass. Once half of them are words, the strip stops being a dashboard and becomes a paragraph set in display type.","impl_note":"js/screens/sysadmin.js: platsettings `kpi(\"Config\",\"Open\",…)` → `kpi(\"Config lock\",\"1 owner\",\"unlocked · pathom.bot@gmail.com\")`; `kpi(\"Open-tier users\",\"∞\",…)` → `kpi(\"Open-tier users\",\"No cap\",…)` with css/app.css `.kpi .k-value{ font-variant-numeric:tabular-nums }` and a new `.kpi.word .k-value{ font-size:23px; letter-spacing:-.01em }` applied via `kpi(label, value, sub, {word:1})`. Apply `{word:1}` to the 9 listed KPIs (dbops 'stub', gate 'Secured'/'face + card'/'DEV-ZK01', dbstore 'nightly'/'P1', audit '7 years', licensing 'OFF'/'Open').","functional_flag":false,"scope":"sysadmin"},"DA-SYS-23":{"id":"DA-SYS-23","phase":2,"dimension":"accessibility","screen":"sysadmin/web/device-new, sysadmin/web/template, sysadmin/web/providers, sysadmin/web/backups","wrong":"Form labels are visually present but programmatically unattached: `.field label` (app.css:430) carries no `for` and the inputs it labels carry no `id`. device-new reports 5 of 8 inputs with no label/aria-label/placeholder ('div.field > input.input.mono', 'div.field > select.input' x2, 'div.field > input.input' x2); template 2 of 2; providers 2 (`select#pv-PROV-AD-transport`, `select#pv-PROV-RAD-transport` - these have ids but no `for`); backups 1 (`input#bk-upload`). Separately every text input is stretched to the full 668px column regardless of content, so a 2-character 'Heartbeat (sec)' value of '30' sits in a 668px box.","should":"Each `.field` label is bound to its control by for/id, and input width tracks content class (short numeric = 120px, identifiers = 340px, URLs = full).","why":"An unlabelled select on the screen that binds LDAP transport is a screen-reader dead end, and 668px boxes holding two characters make a dense form feel unconsidered while burning vertical space.","impl_note":"js/screens/sysadmin.js:50 and :57: emit `<label for=\"f-${f.key}\">` and add `id=\"f-${f.key}\"` to the matching input/select in the same helper. js/screens/authviews.js: add `for` to the labels of `#pv-PROV-AD-transport` and `#pv-PROV-RAD-transport`. js/screens/sysadmin.js:330: add `<label for=\"bk-upload\">` binding. css/app.css: add `.input.w-xs{ max-width:120px } .input.w-sm{ max-width:340px }` and apply w-xs to Heartbeat / Transaction interval, w-sm to Device serial and Comm key.","functional_flag":false,"scope":"sysadmin"},"DA-SYS-24":{"id":"DA-SYS-24","phase":2,"dimension":"density","screen":"all sysadmin web screens","wrong":"Sysadmin averages 44.6 text nodes below 12px per shot (2,853 across 64 shots) - the densest persona in the product - peaking at identity 131, database 124, biometrics 106 and providers 91 at 1440. Five to six font weights per screen, including the non-standard 650 on backups and biometrics. On biometrics the fleet table stacks 10.8px method chips three-deep inside a 44px row; on identity the sign-in-method sub-lines run at 11.3px and then ellipsise.","should":"A bounded type scale for the persona - 11 / 12 / 13 / 15 / 17 / 22 / 32 with weights 400 / 600 / 700 only, and nothing below 11px anywhere. Chips, meta lines and table sub-text all resolve to 11px or 12px.","why":"Density is the Console's legitimate character, but 41 rendered sizes and eight weights is not density, it is the absence of a scale - and the sub-11px tier is unreadable for the long shifts an admin console is used in.","impl_note":"css/app.css: collapse the sub-12 tier - `.badge`(10.8) → 11px, `.nav-item .count`(10.5) → 11px, `.btn.xs`(11.3) → 11.5px, `.crumbs`(11.5) stays, `.rail-foot .note`(10.5) → 11px, `.field .hint`(11) stays. Collapse weights - every `font-weight:650` → 700, every `550` → 600, every `800` → 700 except `.k-value`. This is a shared surface - coordinate the scale with the design-system reviewer; the sysadmin-only part is that this persona has the highest count and should be the pilot.","functional_flag":false,"scope":"sysadmin"},"DA-SYS-25":{"id":"DA-SYS-25","phase":2,"dimension":"alignment","screen":"sysadmin/web/database, sysadmin/web/gate, sysadmin/web/channels","wrong":"Two-column rows are height-matched by stretching the shorter card rather than by balancing content, producing large blank card interiors. On database the Provisioning grid card runs its table to y≈1210 but the card stretches to y≈1490 to match the 15-row Demo reset card beside it - ~490px of empty white - and directly below, the Placement registry table sits in a half-width card with ~550px of empty canvas to its right. On channels the Fallback policy card holds one sentence and one button against ~140px of dead space. On gate the whole page ends at y≈610 leaving 290px of empty canvas at 1440.","should":"Unequal-height siblings use `align-items:start` so a short card ends where its content ends; a table that needs 1135px (Provisioning grid) takes the full-width row rather than a 486px column.","why":"Stretched-empty cards read as missing content, not as breathing room - and in the Provisioning grid's case the stretch coexists with a horizontal clip, so the same card is simultaneously too tall and too narrow.","impl_note":"css/app.css `.grid`: add `align-items:start`. js/screens/sysadmin.js database body: move the Provisioning grid card out of the two-column row into its own full-width row below the Demo reset card (it needs 1135px; the content container is 1080px, so it will still scroll ~55px rather than 649px). Same for the Placement registry card - give it `span-3`.","functional_flag":false,"scope":"sysadmin"},"DA-SYS-26":{"id":"DA-SYS-26","phase":2,"dimension":"components","screen":"sysadmin/web/integrations","wrong":"The page's only call to action, 'Add integration', is `.btn.soon`, which app.css:567-569 renders at `opacity:.5`, `filter:grayscale(.45)` and `cursor:not-allowed !important` - it reads as a disabled control - yet it is fully interactive and fires a toast explaining the feature is build-phase. The same pattern appears on sched-connector's three 'Configure' buttons and on gates.","should":"A build-phase action is a normal-weight `.btn.ghost` with a visible 'build-phase' badge beside it, not a disabled-looking control; genuinely unavailable controls use `[disabled]` (app.css:427, opacity .45) and are not clickable.","why":"Two states currently share one appearance: 'you cannot do this' and 'you can do this and I will explain why it is not wired yet'. A user who reads not-allowed will never click, so the explanation never reaches them.","impl_note":"css/app.css:567-569: `.soon, .soon *{ cursor:not-allowed !important }` → `cursor:help`; `button.soon{ opacity:.5; filter:grayscale(.45) }` → `button.soon{ opacity:1; filter:none }`; add `button.soon::after{ content:\"soon\"; margin-left:6px; font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; padding:1px 5px; border-radius:99px; background:var(--line-2); color:var(--muted) }`. js/screens/sysadmin.js:215: `class=\"btn soon\"` → `class=\"btn ghost soon\"`.","functional_flag":false,"scope":"sysadmin"},"DA-SYS-27":{"id":"DA-SYS-27","phase":2,"dimension":"hierarchy","screen":"sysadmin/web/health","wrong":"The 'Needs attention' card lists four items of different severity - a down webhook, an expiring cert, two templates awaiting review, one role request - and gives them three unrelated action treatments: 'Reconnect' `.btn.soft` (filled accent), 'Review' `.btn.ghost`, 'Decide' `.btn.ghost`, with the expiring cert getting a badge and no action at all. Severity is carried only by the leading circle icon and a badge; the button weight does not track it.","should":"Action weight tracks severity - the one failed item gets the filled control, warnings get ghost, and the item with no action gets a ghost 'View' rather than nothing, so every row terminates the same way.","why":"This is the Console's landing screen and its triage list. If the filled button happens to be on the item that also happens to be first, the user learns nothing about priority; a triage list must rank by consequence in the chrome itself.","impl_note":"js/screens/sysadmin.js health(): derive the side button class from the row's tone - `class=\"btn xs ${tone==='bad' ? '' : 'ghost'}\"` so only `bad` rows get the filled `.btn`; give the 'SMS sender ID cert' row a `<button class=\"btn xs ghost\">Renew</button>` beside its Expiring badge.","functional_flag":false,"scope":"sysadmin"},"DA-SYS-28":{"id":"DA-SYS-28","phase":3,"dimension":"empty states","screen":"all sysadmin web screens","wrong":"Across 29 web screens only two designed empty states exist - sync's Review queue ('Nothing waiting' / 'Run a delta sync — proposals land here for approval') and identity's Live sessions ('No live sessions' / 'Sign in from the portal and it appears here'). Everywhere else absence is an em dash: the audit log ORIGIN column, dbstore IN column, channels DELIVERY column, gates TODAY column. Neither designed empty state guides to the action that fills it with anything but prose - sync's has a `.empty` icon at `opacity:.4` and 30px (app.css:396) that is barely visible against --surface. No loading state exists anywhere; no error state exists outside the toast.","should":"Every table that can render zero rows gets the `.empty` component with a title, one sentence and a `.btn.ghost` that performs the filling action; the `.empty` icon sits at opacity 1 in --muted-2 on --line-2; a `.skeleton` shimmer covers the first paint of every table and chart.","why":"An admin console spends its first day empty - no devices, no backups, no directory members, no audit events. Right now that state is undesigned on 27 of 29 screens, so a fresh tenant sees a wall of em dashes and cannot tell broken from new.","impl_note":"css/app.css:396: `opacity:.4` → `opacity:1; color:var(--muted-2); background:var(--line-2); padding:12px; border-radius:var(--r); width:54px; height:54px; box-sizing:content-box`. js/ui.js: extend `empty(iconName,title,sub,action)` to accept an optional `{label,act}` and render `<button class=\"btn ghost\">`; wire it into table() so `rows.length===0` renders `empty()` instead of an empty tbody. Add `.skeleton{ background:linear-gradient(90deg,var(--line-2),var(--surface-2),var(--line-2)); background-size:200% 100%; animation:sk 1.4s var(--ease) infinite }` guarded by the existing prefers-reduced-motion media query.","functional_flag":false,"scope":"sysadmin"},"DA-SYS-29":{"id":"DA-SYS-29","phase":3,"dimension":"density","screen":"sysadmin/mobile/templates, sysadmin/mobile/audit, sysadmin/mobile/health","wrong":"Inside the phone frame (≈330px inner width) the mobile routes use a fraction of the available height and carry no primary action. mobile/templates renders one card with two rows and then ~220px of empty canvas before the tab bar; 5 of 6 mobile routes report aboveFoldPrimary=0. mobile/audit repeats the identical `history` icon in a 32px `.ric` circle on all six rows, so the icon column carries zero information across the whole list. mobile/health and mobile/devmonitor are additionally hit by DA-SYS-01.","should":"Each mobile route carries one thumb-reachable primary above the tab bar (Templates → 'Review TPL-023'; Audit → 'Export today'), and the audit list drops its constant icon column in favour of a time-first two-column row.","why":"The mobile Console is explicitly 'health & alerts only' - a triage surface. A triage surface with no action and a 220px void does not earn the route.","impl_note":"js/screens/sysadmin.js mobile.audit(): replace `rowitem({icon:'history', …})` with a two-column row - `<div class=\"rowitem\"><div class=\"rmain\"><div class=\"rt\">${a.act}</div><div class=\"rs\">${a.who}</div></div><div class=\"rside\"><span class=\"mono small muted\">${a.ts}</span></div></div>` (no .ric). mobile.templates(): append `<button class=\"btn lgbtn\" data-go=\"sysadmin/mobile/template/TPL-023\">Review TPL-023</button>` using the existing app.css:680 .btn.lgbtn full-width pattern.","functional_flag":false,"scope":"sysadmin"},"DA-SYS-30":{"id":"DA-SYS-30","phase":3,"dimension":"motion","screen":"all sysadmin web screens","wrong":"Every control in the persona shares one feedback recipe: `filter:brightness(.94)` on hover, `transform:translateY(1px)` on active, 160ms. A 'Purge' on dbops, a 'Revoke' on identity and a 'View all' link on health feel physically identical under the finger, and the accent hover glow (app.css:415) is explicitly excluded from `.danger` so destructive controls get *less* feedback than routine ones. There is no confirmation motion, no state transition when a flag toggles, and no motion difference between a reversible and an irreversible act.","should":"A destructive hover that reads as a warning - `.btn.danger:hover` fills --bad with white text over 120ms - and a short settle animation on any control that has just changed shared state, so an admin gets a physical confirmation that the irreversible thing happened.","why":"Motion is the last chance to signal consequence before the click lands. Making the most dangerous button in the app the least responsive one removes the only remaining pre-commit cue.","impl_note":"css/app.css:424: `.btn.danger:hover{ border-color:var(--bad); filter:none }` → `.btn.danger:hover{ background:var(--bad); border-color:var(--bad); color:#fff; filter:none; box-shadow:0 6px 16px -8px var(--bad); transition:background 120ms var(--ease), color 120ms var(--ease) }`. Add `@keyframes settle{ 0%{transform:scale(1)} 40%{transform:scale(.97)} 100%{transform:scale(1)} }` and `.btn.danger.did{ animation:settle 220ms var(--ease) }`, applied by the existing toast handler. Both must sit inside the existing `@media (prefers-reduced-motion: reduce)` guard.","functional_flag":false,"scope":"sysadmin"},"DA-MGR-01":{"id":"DA-MGR-01","phase":1,"dimension":"responsiveness","screen":"manager/mobile/approvals (also home, team, sched-cal, sched-swaps)","wrong":"In the phone frame (≈265px inner row width) `.rowitem .rside` is `flex:none` and holds a 170px Approve+Return pair, so `.rmain > .rt` renders 38px of a 275px title and `.rs` 38px of 244px — the request ID, requester and type collapse to 'SW…' / 'Shift …'. The harness also records `div.rt > span.idtag` physically overlapping `button.btn.xs.ok` (3 pairs, 89px² each). On manager/mobile/team the same rule cuts 5 of 8 member names ('Souksavanh Phom…', 'Manysone Vongph…'), rt 173→131px.","should":"Below a 420px content container the row must stack: title + sub on line 1–2 at full width, the action pair on its own full-width line beneath, each button 50% width and ≥44px tall. Nothing that identifies the request may be truncated on the screen where the decision is taken.","why":"This is the app's primary action. A manager tapping Approve on a row reading 'SW…' is approving an unidentified request — the decision surface has no context at all, which is worse than a missing feature.","impl_note":"app.css — add inside `@container content (max-width: 420px)`: `.rowitem{flex-wrap:wrap} .rowitem .rmain{flex:1 1 100%} .rowitem .rt{white-space:normal} .rowitem .rside{flex:1 1 100%; margin-top:8px; justify-content:stretch} .rowitem .rside > span{display:flex; width:100%; gap:8px} .rowitem .rside .btn{flex:1 1 0; min-height:44px; padding:10px 12px; font-size:var(--fs-12,12.8px)}`. Keep `border-radius:var(--r-sm)` on the buttons so they match the card radius.","functional_flag":false,"scope":"manager"},"DA-MGR-02":{"id":"DA-MGR-02","phase":1,"dimension":"responsiveness","screen":"manager/mobile/sched-swaps","wrong":"The pending-swap row renders only the green ✓ (Approve); the Return button sits past the card's right edge and is not reachable — the row's `.rside` span (2 × `.btn.xs` ≈ 170px) exceeds the remaining track and the card clips it. Title clipped rt 224→162px, sub 244→162px.","should":"Both decisions must be present and equally reachable. Same stacked action row as DA-MGR-01; no decision control may be clipped by its container at any width.","why":"The manager can approve but cannot return a swap on mobile — the queue becomes one-way, and 'approve because I can't decline' is the exact failure mode an approval UI must not create.","impl_note":"Same `@container content (max-width:420px)` block as DA-MGR-01 (the inline `display:inline-flex` span becomes `display:flex;width:100%`). Additionally set `.card{overflow:visible}` is NOT the fix — the row must wrap, not overflow.","functional_flag":false,"scope":"manager"},"DA-MGR-03":{"id":"DA-MGR-03","phase":1,"dimension":"responsiveness","screen":"all manager web screens","wrong":"At 1024 the rail keeps its full 242px width while every label inside it is `display:none` — a 242px column containing a single 17px icon column centred at x=120, with the `.nav-item .count` badge absolutely positioned at the far right (x≈213), ~93px away from the icon it belongs to. Cause is CSS source order: `@container shell (max-width:1024px){ .rail{width:74px;padding:18px 10px} }` is declared at app.css:173 **before** the base `.rail{width:242px; padding:20px 14px 18px}` at app.css:180 — equal specificity, so the later base rule wins for `width`/`padding` while the `display:none` declarations (uncontested) still apply.","should":"The folded rail is 74px wide with the icon centred and the count badge tucked to the icon's top-right; the 168px reclaimed goes to the content container (782px → 950px).","why":"Every 1024 screen in this persona loses ~170px of usable width to an empty gutter, which is what forces the calendar chips (DA-MGR-07), the teamdata table (DA-MGR-10) and the KPI bands to 2-up. One CSS ordering fix removes the cause of four other findings.","impl_note":"app.css — move the whole `@container shell (max-width: 1024px){…}` block (lines 173-179) to immediately AFTER the `.rail`, `.rail-head`, `.nav-item` base rules (i.e. after line ~213). No declaration values change.","functional_flag":false,"scope":"manager"},"DA-MGR-04":{"id":"DA-MGR-04","phase":1,"dimension":"hierarchy","screen":"manager/web/approval","wrong":"At 1024 the `.grid.cols-3` collapses and the 'Decide' card (the only card holding Approve / Return) drops below the 6-row Request table and the Team-conflict card — first paint of the Approve button is at y≈960, off a 900px fold. `primaryActions.aboveFoldPrimary = 0`, `aboveFoldButtons = 0`: the decision screen renders with zero controls visible.","should":"The decision block is pinned above the fold at every width — at ≤1020px the Decide card renders directly under the page header as a horizontal action bar (Approve | Return with note | Delegate), before the Request table.","why":"A decision screen that shows no decision on first paint forces a scroll-hunt on every single approval and inverts the screen's whole purpose.","impl_note":"manager.js web.approval(): move the Decide card out of the right-hand column into its own `<div class=\"decide-bar\">` rendered immediately after the screen header. app.css add `.decide-bar{display:flex;gap:10px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-sm);margin-bottom:16px}` and `@container content (min-width:1021px){ .decide-bar{display:none} }` keeping the sidebar card above 1020. Buttons keep `.btn.ok` / `.btn.danger` / `.btn.ghost`.","functional_flag":false,"scope":"manager"},"DA-MGR-05":{"id":"DA-MGR-05","phase":1,"dimension":"components","screen":"all manager approval surfaces (overview, approvals, approval, sched-swaps, mobile home)","wrong":"The same Approve/Return decision is rendered in four different components: `.btn.ok` full-width 38px (approval detail), `.btn.ok.sm` 12px/28px (overview `.qrow`), `.btn.xs.ok` 11.3px/22px (unified inbox + swaps), and an unlabelled 30×30 icon-only circle (mobile `queue(device, compact)` drops the text). The most important control in the persona is smallest on the screen dedicated to it (approvals) and largest on the screen where one item is already chosen (detail).","should":"One `.btn.ok` / `.btn.danger` size for a decision — `.btn.sm` minimum (12px, 32px tall) in any list context, full `.btn` in the detail — and the label is never dropped, on any device.","why":"Visual weight must track functional importance; today it tracks list density instead, so the queue screen reads as less consequential than the detail screen and the mobile queue reads as two anonymous glyphs.","impl_note":"approvalsview.js:18 `btn xs ok`→`btn sm ok`, `btn xs danger`→`btn sm danger`; schedule.js:511 same swap; manager.js:32-33 remove the `compact ? \"\" :` ternary so the label always renders. app.css `.btn.sm{padding:6px 12px;font-size:12px;border-radius:9px}` unchanged — it becomes the single list-decision size.","functional_flag":false,"scope":"manager"},"DA-MGR-06":{"id":"DA-MGR-06","phase":1,"dimension":"accessibility","screen":"all manager approval surfaces","wrong":"Both decision labels fail WCAG AA. `.btn.ok` is white on `--ok #5E8C63` = **3.88:1** at 11.3px (needs 4.5); `.btn.danger` is `--bad #B5675C` on `--surface` = **4.15:1**. The harness lists `span > button.btn.xs.ok` 'Approve' 3.88 among the worst-10 on manager/mobile/approvals. The generic `.btn` primary is worse: white on `--acc` (`--mgr #6E9A6E`) = **3.23:1**, which is every 'Open queue', 'Publish planned', 'Publish plan', 'Create division' and 'Generate now' label in the persona.","should":"Approve = white on `--ok-text #3F6244` (6.90:1). Return = `--bad-text #94503F` on `--surface` (6.04:1). Primary `.btn` = white on `--acc-d` (manager `--mgr-d #3F623F`, 6.93:1), keeping `--acc` for the hover/focus ring only.","why":"The two labels a manager must read under time pressure are the two that fail contrast; at `.btn.xs`'s 11.3px this is below-threshold small text, not a borderline large-text case.","impl_note":"app.css .btn.ok `background:var(--ok); border-color:var(--ok)` → `background:var(--ok-text); border-color:var(--ok-text)`. .btn.danger `color:var(--bad)` → `color:var(--bad-text)`; `:hover{border-color:var(--bad)}` → `var(--bad-text)`. .btn `background:var(--acc);border-color:var(--acc)` → `background:var(--acc-d);border-color:var(--acc-d)`; keep `.btn:not(.ghost):not(.danger):hover{box-shadow:0 6px 16px -8px var(--acc)}`.","functional_flag":false,"scope":"manager"},"DA-MGR-07":{"id":"DA-MGR-07","phase":1,"dimension":"responsiveness","screen":"manager/web/sched-cal, manager/web/sched-manage","wrong":"At 1024 every shift chip in the month grid renders as 'Line …': `div.shiftchip > span.sc-name` is clipped from 84–93px to **37px** on 7 chips per screen. Morning vs Afternoon then differs only by chip tint (`--mgr-bg #DEEBDD` vs `--staff-bg #F4E8D6`) with no legend. Cause: `.shiftchip .sc-cap` (the `2/6` figure, `flex:none`, ~30px with gap) is only dropped at `@container content (max-width:560px)`, but the content container at 1024 is 704px — above the threshold, so the figure survives and eats the name.","should":"The shift name is never shorter than ~9 characters. Drop `.sc-cap` from 820px down, or let the chip wrap to two lines (name / cap) inside the day cell.","why":"A roster grid whose entries read 'Line …' cannot be scanned; the manager must click every cell to learn what is scheduled, and the colour channel that survives is a 1.1:1 pastel difference.","impl_note":"css/schedule.css — move `.shiftchip .sc-cap{display:none}` from the 560px block into a new `@container content (max-width: 820px){ … }` block. Add a persisting cap readout on the day cell instead: `.cal-day .cd-num::after` is not suitable — put the figure in the existing chip `title` attribute (calendar-core.js:83 already sets `title=\"${label} · ${time}\"`, append ` · ${cap}`). Pairs with DA-MGR-03, which returns 168px to the grid.","functional_flag":false,"scope":"manager"},"DA-MGR-08":{"id":"DA-MGR-08","phase":1,"dimension":"iconography","screen":"manager/web/schedule","wrong":"A 720×730px `sparkle` SVG is rendered in `--muted` grey in the middle of the Schedule card, stretching the page to 1724px (vs 1028px for the comparable Team screen). `UI.icon(name, cls)` emits `<svg class=\"\">` with no intrinsic size; sizing comes only from context selectors (`.btn svg`, `.rowitem .ric svg`, `.crumbs svg`…). `manager.js:228` calls `icon(\"sparkle\", \"\")` inside a `<p class=\"small muted\">`, which matches no sizing rule, so the SVG takes 100% of the card width.","should":"Any inline icon in body copy renders at 13–14px on the text baseline. The footnote should read as one 11.5px line with a 13px leading glyph.","why":"It is the single most visible defect in the persona — a broken 730px graphic on a top-level nav screen — and the same call pattern will blow up anywhere `icon()` is used outside a button or row.","impl_note":"css/app.css §06 — add a defensive default `p svg, .small svg, .hint svg{ width:13px; height:13px; vertical-align:-2px; flex:none; }` and a floor `svg[class=\"\"]{ width:14px; height:14px; }`. Then manager.js:228 `${icon(\"sparkle\", \"\")}` → `${icon(\"sparkle\")}` for consistency.","functional_flag":false,"scope":"manager"},"DA-MGR-09":{"id":"DA-MGR-09","phase":1,"dimension":"hierarchy","screen":"manager/web/sched-manage","wrong":"The same five-metric band appears twice on one screen with contradicting numbers: the top `.cal-quick` strip reads Total 32 · Active 30 · Leave 1 · **Available 30 · On shift 0**, and the 'Data summary — 2026-06-08' card at the bottom reads Total 32 · Active 30 · Leave 1 · **Available 26 · On shift 4** — identical component, identical labels, identical styling, different values, and only the lower one carries a date.","should":"One band. If the top strip is 'today' and the lower one is the selected date, the top strip must carry its own scope label in the same position the lower card carries its date, and the two must never render adjacent unscoped.","why":"Two authoritative-looking numbers for 'On shift' on one screen destroys trust in every other figure on it; the manager has no way to tell which is the roster they are about to publish against.","impl_note":"schedule.js shiftManage(): delete the duplicated top `.cal-quick` render (keep only the dated 'Data summary' card), or give the top strip a scope caption — wrap it as `card('Today — ' + todayISO, …, {icon:'calendar'})` using the same `.cal-quick` markup. Do not introduce a third variant.","functional_flag":true,"scope":"manager"},"DA-MGR-10":{"id":"DA-MGR-10","phase":1,"dimension":"alignment","screen":"manager/web/teamdata","wrong":"The `db_people.employees` editor renders 8 columns in a 658px card while a 380px sidebar sits beside it, so 6 of 8 columns wrap every row: the monospace ID breaks mid-token ('EMP-' / '0214'), 'Machine Operator' and 'Line A' both wrap, and one-line data occupies 62px rows. The inline add-row form below it breaks its own grid — row 1 is five ~130px inputs, row 2 is two 270–280px inputs plus an 'Add row' button squeezed to ~100px.","should":"A data-editor table gets the full content width (sidebar below it at ≤1020px); columns sized to content with `white-space:nowrap` on the ID and code columns; the add-row form uses one repeating grid track so all seven inputs share a width.","why":"A table whose primary key visually splits across two lines cannot be read as a key, and the wrap doubles the table height for no information gain on the densest manager screen (2981px at 1024).","impl_note":"manager.js web.teamdata(): change the wrapper from `grid cols-3` + `span-2` to a single full-width column for the two `DBV.tableEditor` cards and move the right-hand column ('Assign existing staff', 'Stores you touch', 'One writer per store') below them as a `grid cols-3`. app.css add `.tbl td .mono, .tbl td:first-child{white-space:nowrap}`. dbviews.js add-row form: `display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px` so all inputs share a track.","functional_flag":false,"scope":"manager"},"DA-MGR-11":{"id":"DA-MGR-11","phase":1,"dimension":"alignment","screen":"manager/web/sched-staff","wrong":"The Staff cell packs name + employee ID inline (`span.strong` + `span.mono.small.muted`) into a 253px column holding ~290px of content, so row 1 wraps and the ID hyphen-splits ('EMP-' / '0214'); the harness records the two spans as an overlapping pair (area 2219px²). Rows are then unevenly tall (60px vs 54px) down the whole 32-row table.","should":"Name on line 1, ID on line 2 as an explicit two-line cell (like the Team roster's `.strong` + `.small.muted` stack), or widen the column to `minmax(320px,1fr)`.","why":"This is the only manager table where identity wraps mid-token; it also produces the persona's only recorded text-overlap at both desktop widths.","impl_note":"js/screens/schedule.js staffDivision(): wrap the cell as `<div><div class=\"strong\">name</div><div class=\"small muted mono\">id</div></div>` — the exact markup manager.js:184 already uses for the Team roster. Removes the overlap and normalises row height to the roster's 60px.","functional_flag":false,"scope":"manager"},"DA-MGR-12":{"id":"DA-MGR-12","phase":1,"dimension":"components","screen":"manager/web/overview, manager/web/member","wrong":"`.btn.xs.soft` renders as a sage pill (`--acc-bg` fill, `--acc-ln` border, 99px-ish radius, 11.3px bold) that is visually the same object as `badge()` — on the Alerts card 'Coach' (a button) sits in the same row position and at the same size as 'Late' and 'Pending' (badges); on Capture & devices 'Monitor' (button) sits beside the 'online' badge; on member/Recent items an 'Edit' `.btn.xs.ghost` sits beside two 'Pending' badges. The only differentiator is the badge's 5px leading dot.","should":"List-side actions use `.btn.sm.ghost` with a visible 1px `--line` border, `--surface` fill and a leading icon; badges stay fill-only, no border, no icon. A control and a status must not share a silhouette.","why":"Three of the four items in the manager's alert column are non-interactive; the one that is actionable is indistinguishable, so the coaching action is effectively invisible.","impl_note":"manager.js:89 `btn xs soft`→`btn sm ghost` (+ leading `${icon('user')}`), manager.js:61 Monitor `btn xs soft`→`btn sm ghost`, manager.js:211 Edit `btn xs ghost`→`btn sm ghost`. app.css: restrict `.btn.soft` to header/actions context only (`.screen-head .btn.soft`), and add `.rowitem .rside .btn{border:1px solid var(--line); background:var(--surface)}`.","functional_flag":false,"scope":"manager"},"DA-MGR-13":{"id":"DA-MGR-13","phase":1,"dimension":"hierarchy","screen":"manager/web/approvals, manager/mobile/approvals","wrong":"The unified-inbox row shows id + requester + type badge + one `detail` sub-line and nothing else. The SLA countdown (`<span class=\"sla\">14h left</span>`), the dates and the submitted timestamp — all present on the overview `.qrow` for the same three requests — are dropped. The inbox is the screen dedicated to deciding, and it is the one surface with the least context per row.","should":"The inbox row carries the same context set as the overview queue row: `id · requester · type` on line 1 with the `.sla` chip right-aligned before the action pair, `dates · submitted` on line 2.","why":"Urgency is the only ordering signal in an approvals queue; without the SLA the three sections are an unranked list and the manager must open each item to learn which is about to breach.","impl_note":"approvalsview.js row(): `sub:` → `` `${esc(r.dates||'')} · submitted ${esc(r.submitted||'')}` `` and append `` `<span class=\"sla\">${esc(r.sla)}</span>` `` to the `side` string ahead of the button span. `.sla` already exists (app.css:345, `--warn-text`, mono 10.5px) — raise it to 11.5px there so it is legible at row scale.","functional_flag":false,"scope":"manager"},"DA-MGR-14":{"id":"DA-MGR-14","phase":1,"dimension":"color","screen":"manager/web/sched-cal, manager/web/sched-manage","wrong":"Holidays (Jun 1, Jun 15) are encoded as a full-cell `--hol-bg #F3E3EF` fill — **1.23:1 against `--surface`** — plus a 7px dot in the corner, with no label, no name and no legend anywhere on either screen. Public vs company holiday is encoded as filled-dot vs ring-dot at 7px. The `.cal-legend` component exists in schedule.css:127-134 but is not rendered on these screens.","should":"Render `.cal-legend` under the month grid (holiday · morning · afternoon · over-cap), and put the holiday name in the cell as a 10px `--hol-d` caption next to the day number — text, not a dot.","why":"Colour-only semantics at 1.23:1 is invisible to a normally-sighted user at arm's length and entirely absent for a colour-blind one; the manager publishes a roster without seeing that two of the days are holidays.","impl_note":"calendar-core.js month renderer: append `<span class=\"cdc-hol\">${esc(holidayName)}</span>` inside the holiday `.cal-day` (schedule.css:305-307 already styles `.cdc-hol` at `600 10px --hol-d` with ellipsis) and emit the existing `<div class=\"cal-legend\">` after `.cal-weekrail` with `i.is-mgr`, `i.is-staff`, a `--hol` swatch and an `over` swatch. Add `.cal-legend i.is-hol{background:var(--hol)}`.","functional_flag":false,"scope":"manager"},"DA-MGR-15":{"id":"DA-MGR-15","phase":1,"dimension":"hierarchy","screen":"manager/web/reports","wrong":"Each report section leads with a full-width monospace SQL string (`SELECT * FROM people_employees WHERE team='Line A'; punches WHERE status='flagged' — db_people · db_time`) repeated verbatim on all three run rows — four identical copies per section, twelve on the screen — rendered at 11.5px across ~660px, which makes it the widest and most repeated text block on a line-manager screen. The section's actual primary action, `Generate now` (`.btn` filled), is at the **bottom-left** of each section below the runs, while the least-used route ('File storage', `.btn.ghost`) owns the page header. `aboveFoldPrimary` = 1@1440, 0@1024.","should":"Run rows are identified by `RPT-1010 · Jun 10 17:30 · essential` alone; the query string collapses to one `<details>` line per section ('Query'), not per run. `Generate now` moves to the section header, right-aligned, as the section's primary.","why":"The manager persona's job on this screen is 'get me this month's numbers'; today the loudest element is a database query they cannot act on and the action they came for is below three rows of it.","impl_note":"reports.js library(): delete the per-run query line from the run row (keep id · timestamp · tier); wrap the section-level query in `<details class=\"qdetail\"><summary class=\"small muted\">Query</summary><code class=\"mono small\">…</code></details>`. Move the `Generate now` button from the section footer into the card header slot (`UI.card(…, {icon, link})` already right-aligns a header action). app.css add `.qdetail summary{cursor:pointer;list-style:none} .qdetail code{display:block;margin-top:6px;color:var(--ink-2)}`.","functional_flag":false,"scope":"manager"},"DA-MGR-16":{"id":"DA-MGR-16","phase":1,"dimension":"components","screen":"manager/web/report-run, manager/web/teamdata","wrong":"The same attendance state is rendered three different ways in the persona: `badge('present')` pills on Team/Overview, plain right-aligned lowercase text 'present / late / onleave / absent' on report-run, and plain lowercase text again in the teamdata editor. Column headers on report-run are raw DB names — `ID · NAME · STATUS · ATTEND_PCT · OT_H` — against 'Member · Position · Today · Attend. · OT MTD' for the identical fields on the Team roster. The categorical STATUS column is also right-aligned, colliding visually with the numeric ATTEND_PCT beside it.","should":"Status always renders through `badge()`. Column headers use the persona's own labels (Member / Status / Attendance % / OT h). Categorical columns left-aligned; only numerics right-aligned.","why":"Three renderings of one value across four screens means the manager re-learns the same data on every screen, and 'onleave' as bare text is not the same word as the 'On leave' badge they were taught on the roster.","impl_note":"reports.js runPage(): map status cells through `UI.badge(v)` and replace the header row with a display-label map (`{id:'ID', name:'Member', status:'Status', attend_pct:'Attendance', ot_h:'OT h'}`); drop `{r:1}` from the status column so it left-aligns. dbviews.js tableEditor(): same `UI.badge()` pass for any column named `state`/`status`.","functional_flag":false,"scope":"manager"},"DA-MGR-17":{"id":"DA-MGR-17","phase":1,"dimension":"accessibility","screen":"all manager mobile routes","wrong":"19 of 23 interactive targets on manager/mobile/approvals, 19 of 26 on home and 13 of 25 on team are under 44×44. The decision controls themselves measure ~30×30 (icon-only queue buttons on home) and ~38px tall (`.btn.ok` on the approval detail); bottom-tab labels render at 9.8px.","should":"Every control in the phone frame has a ≥44px hit area (visual box may stay smaller with padding), and tab labels sit at 11px minimum.","why":"This is a shop-floor manager approving on a phone; a 30px unlabelled ✓ sitting 6px from a 30px ✗ is a mis-tap that silently writes to the ledger.","impl_note":"app.css inside `@container content (max-width:420px)`: `.btn{min-height:44px} .btn.sm,.btn.xs{min-height:44px;padding:10px 14px;font-size:12.8px} .tab span{font-size:11px}`. Combine with DA-MGR-01's stacked action row so the larger targets have somewhere to go.","functional_flag":false,"scope":"manager"},"DA-MGR-18":{"id":"DA-MGR-18","phase":2,"dimension":"components","screen":"manager/web/sched-cal, sched-manage, sched-control vs overview, approvals, team, member, reports","wrong":"Two KPI components coexist in one persona. `UI.kpi` (`.kpi`): uppercase 10.8px `--muted` label ABOVE a 32px `--display` value, in a white `.card` with `--r` radius and `--sh`. `.cal-quick .qv-cell`: an 18–24px value ABOVE a 10.5px uppercase label, in a `--r-sm` box with `--sh-sm`, five-up. A manager moving Overview → Calendar sees the same class of information inverted, resized and re-shadowed.","should":"One KPI component. Keep `.kpi` (label over value) and restyle `.cal-quick` to compose `.kpi` inside a `grid cols-4`; drop the five-up track, which does not divide into the 3- and 2-column grids at 1024 and orphans the fifth tile.","why":"The schedule group is four of the manager's eleven nav items; a different metric component there makes it read as a bolted-on second product.","impl_note":"calendar-core.js:93 and schedule.js:446: emit `UI.kpi(label, value, sub)` inside `<div class=\"grid cols-4\">` instead of `.cal-quick`/`.qv-cell`; fold the fifth metric ('On shift') into the hero KPI's sub-line. Delete `.cal-quick`/`.qv-cell` from schedule.css:21-29 once unreferenced.","functional_flag":false,"scope":"manager"},"DA-MGR-19":{"id":"DA-MGR-19","phase":2,"dimension":"color","screen":"manager/web/sched-cal, manager/web/sched-manage","wrong":"The month grid's structural labels use `--muted-2 #AFABA1`: the MON–SUN weekday header row (`.cal-dows span`, 10px, **2.2:1** on canvas) and the trailing/leading day numbers (`.cal-day.muted .cd-num`, 11px, 2.2:1 on `--surface-2`). The week rail (`.cal-wk`, `--muted`, 10.5px mono) is 3.89:1. These are the grid's only orientation cues.","should":"Weekday headers and out-of-month day numbers at `--muted` minimum (4.40:1) — better, `--ink-2` for the weekday row since it is a persistent header, not decoration.","why":"Per the brief, muted text is flagged where it carries essential information — a calendar's column headers are the most essential labels on the screen.","impl_note":"css/schedule.css:33 `.cal-dows span{ … color:var(--muted-2) }` → `color:var(--ink-2)`; line 47 `.cal-day.muted .cd-num{color:var(--muted-2)}` → `color:var(--muted)`; line 40 `.cal-wk{color:var(--muted)}` → `color:var(--ink-2)`.","functional_flag":false,"scope":"manager"},"DA-MGR-20":{"id":"DA-MGR-20","phase":2,"dimension":"typography","screen":"manager/web/member, manager/mobile/member","wrong":"The June attendance heatcal renders 30 day-numbers at **9–9.5px** (the persona's smallest type; member@1440 records 30 nodes at 9.5px and `fonts.min` 9) in `--muted-2`, and the weekday letters are the screen's worst contrast pair (`div.heatcal > div.hc.dow` **2.29:1** at 9px on mobile). Cells use a 6px radius — 37 instances of a value that is not one of the four radius tokens (`--r-sm` 11px is the nearest). The grid has three visual states (sage fill, beige fill, white dashed) and no legend, and it is stretched to a 790px-tall card while the paired 'Recent items' card ends at 584px, leaving 218px of empty card.","should":"Day numbers at 11px `--ink-2`; cells on `--r-sm`; a three-item legend under the grid; cap the heatcal at ~420px so the two cards in the row balance.","why":"The whole point of a heat calendar is glanceability; at 9px/2.29:1 with no key it conveys a mood, not attendance.","impl_note":"app.css `.heatcal .hc{font-size:9px→11px; color:var(--muted-2)→var(--ink-2); border-radius:6px→var(--r-sm)}`; `.heatcal .hc.dow{font-size:9px→10.5px; color:var(--muted)}`; add `.heatcal{max-width:420px}` and render `UI`'s existing legend pattern (`.cal-legend`) beneath with three swatches (present / no data / weekend).","functional_flag":false,"scope":"manager"},"DA-MGR-21":{"id":"DA-MGR-21","phase":2,"dimension":"alignment","screen":"manager/web/sched-swaps","wrong":"The 'Pending approvals' table gives 'Roster impact' ~515px (still wraps) while 'Requested by' gets ~170px (wraps 'Manysone Vongphachanh' onto two lines) and 'SLA' gets ~60px, wrapping '12h left' into '12h' / 'left'. Meanwhile ~230px of table width sits unused to the right of the action buttons. One row of data occupies a 4-column table plus a 4-tile KPI band (Pending 1 · Approved 0 · Returned 0 · Total 1) across 360px of vertical.","should":"`table-layout:auto` with `white-space:nowrap` on the SLA and requester columns; a `--warn`-toned SLA chip inline with the id; the KPI band removed (see reduction).","why":"A wrapped '12h / left' beside a two-line name in a table that is two-thirds empty reads as a broken grid, on the screen with the fewest elements in the persona.","impl_note":"schedule.js swaps(): column defs → `[{h:'ID'},{h:'Requested by'},{h:'Roster impact'},{h:'SLA'},{h:'',r:1}]` and wrap the SLA cell as `<span class=\"sla\">`; app.css add `.tbl td .sla, .tbl td .mono{white-space:nowrap}` and `.tbl th:nth-child(2),.tbl td:nth-child(2){white-space:nowrap}`.","functional_flag":false,"scope":"manager"},"DA-MGR-22":{"id":"DA-MGR-22","phase":2,"dimension":"spacing","screen":"manager/web/overview","wrong":"`.qrow .qt` is `display:flex; flex-wrap:wrap`, so when a request title is long (SW-0325 'Manysone · Shift swap · Jun 12 Afternoon → Souksavanh P.') the `.sla` chip wraps to its own line and that row grows to ~100px against ~62px for the two rows above it. The three-row queue therefore has no vertical rhythm, and the wrapped `.sla` loses its association with the title.","should":"`.qt` holds the title on one line with `min-width:0; overflow:hidden; text-overflow:ellipsis`, and `.sla` is pulled out of `.qt` into a fixed slot before `.qact` so every queue row is the same height.","why":"The queue is the first card on the persona's home screen; an irregular row height there reads as three different components rather than one list.","impl_note":"app.css:342 `.qrow .qt{ … flex-wrap:wrap }` → `flex-wrap:nowrap; min-width:0` and add `.qrow .qt > span:not(.idtag){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}`. manager.js:28 move `<span class=\"sla\">` out of `.qt` into a new `<div class=\"qsla\">` sibling before `.qact`; app.css `.qrow .qsla{flex:none;margin-left:auto;padding-right:12px}`.","functional_flag":false,"scope":"manager"},"DA-MGR-23":{"id":"DA-MGR-23","phase":2,"dimension":"responsiveness","screen":"manager/web/overview","wrong":"The right column of the overview is 348px against 690px for the left, so three of the four sub-lines in it truncate at full desktop width: '2nd this month · policy ladder ste…', 'Hikvision · Warehouse entry, Da…', 'Team clocks via Biometric (face / fin…'. The truncation happens at 1440 — the widest supported viewport — not only at a breakpoint.","should":"Either a 2:1 split (`.span-2` + 1fr at 1180px max-width already gives 690/348 — change to `grid-template-columns:1.6fr 1fr` ≈ 640/400), or let `.rs` wrap to two lines in sidebar cards (`.card--aside .rowitem .rs{white-space:normal}`).","why":"If the only place a piece of information appears is truncated at the largest viewport, it is not in the product.","impl_note":"app.css add `.grid.cols-3.aside-2{grid-template-columns:1.6fr 1fr}` and use it on manager.js:82 (`grid cols-3` → `grid cols-3 aside-2`), plus `.aside-2 > :last-child .rowitem .rs{white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}`.","functional_flag":false,"scope":"manager"},"DA-MGR-24":{"id":"DA-MGR-24","phase":2,"dimension":"spacing","screen":"manager/mobile/team, member, sched-cal, home","wrong":"The mobile scroll root has no bottom padding clearing the fixed tab bar, so the last list rows sit under it: manager/mobile/team records 6 overlap pairs against `button.tab > span` (areas 369/255/252/185px²), member 6 (heatcal cells), sched-cal 2, home 2. `.app-body` ends in `padding:16px 16px 20px`.","should":"`.app-body` bottom padding ≥ tab-bar height + 16px so the last row always clears the bar.","why":"The bottom item of every list in the manager's mobile app is partly hidden behind opaque chrome — on Team that is a team member's status badge.","impl_note":"app.css:497 `.app-body{ padding:16px 16px 20px }` → `padding:16px 16px 76px` (tab bar 56px + 20px).","functional_flag":false,"scope":"manager"},"DA-MGR-25":{"id":"DA-MGR-25","phase":2,"dimension":"iconography","screen":"manager/web/approvals, manager/mobile/approvals","wrong":"'Recently decided' renders a check-mark icon for every decided item regardless of outcome — 'TC-0107 · Keo · Missing punch' carries a ✓ in a sage `.ric` tile while its badge reads 'Returned' (`--bad` tone). The `neutral` flag (`manager.js:120 neutral: r.status !== 'approved'`) only greys the tile background; the glyph stays a tick. On the Requester snapshot card the same ✓ is used for the informational 'Attendance 98%'.","should":"Icon tracks outcome: `check` for approved, `x` for returned, `history` for anything else; informational rows use a neutral glyph (`user`, `sun`, `history`), never a confirmation mark.","why":"A tick is a semantic claim. Showing one on a returned request tells the manager the opposite of what happened at the exact glance-speed the row is designed for.","impl_note":"manager.js:120 `icon: \"check\"` → `icon: r.status === \"approved\" ? \"check\" : r.status === \"returned\" ? \"x\" : \"history\"`; same at manager.js:308 (mobile 'Decided'). manager.js:158 Requester-snapshot 'Attendance 98%' `icon:\"check\"` → `icon:\"trend\"`.","functional_flag":false,"scope":"manager"},"DA-MGR-26":{"id":"DA-MGR-26","phase":2,"dimension":"typography","screen":"manager/web/security, manager/web/sched-control","wrong":"Notice cards set body copy to the full card width: the 'Portal flag is off' paragraph runs ~1000px ≈ 160 characters per line, and the 'Read-only for managers' notice on sched-control ~170 characters, both at 12.5px in `--muted` (4.40:1 on white). The most consequential sentence on each screen — 'you cannot edit this' — is the lowest-contrast, longest-measure text on it.","should":"Body copy in a notice/empty card is capped at `max-width:62ch`, set in `--ink-2`, with the card centred or left-aligned at that measure.","why":"160-character lines break line-tracking on return sweeps; combined with `--muted` the reader's eye skips the constraint entirely and then wonders why the controls do nothing.","impl_note":"app.css add `.card > p.small, .card .hint{ max-width:62ch; color:var(--ink-2) }` and `.row-locked p{ max-width:62ch }`. (Shared AUTHV/SCHEDVIEWS components — the change lands for every persona.)","functional_flag":false,"scope":"manager"},"DA-MGR-27":{"id":"DA-MGR-27","phase":3,"dimension":"empty states","screen":"manager/web/security, manager/web/reports, manager/web/report-files, manager/web/approvals","wrong":"Empty and near-empty states are inconsistent. The inbox has a designed `empty('calcheck','Inbox clear', …)` and the overview queue has `empty('check','Queue clear', …)`, but 'Recently decided' falls back to a bare `<p class=\"small muted\">Nothing decided yet.</p>` (manager.js:123), and manager/web/security renders an entire nav destination as one 120px notice card in 830px of empty canvas with no illustration, no heading hierarchy and no action. No loading state exists anywhere in the persona — screens paint fully or not at all, so a slow ledger read shows a blank card.","should":"Every zero-data surface uses `UI.empty(icon, title, line)` with one suggested action; add a shared `.skel` shimmer block for card bodies awaiting data.","why":"The manager's screens are mostly lists; the first time a queue is genuinely clear or a report has not run, three different treatments appear in one session.","impl_note":"manager.js:123 → `empty(\"history\", \"Nothing decided yet\", \"Decisions you make appear here with their audit trail.\")`. manager.js:351 wrap AUTHV.mySecurity output so the flag-off case renders `empty(\"shield\", \"Portal flag is off\", …)` with a `.btn.soft` linking to the identity console. app.css add `.skel{background:linear-gradient(90deg,var(--line-2),var(--surface-2),var(--line-2));background-size:200% 100%;animation:skel 1.2s var(--ease) infinite;border-radius:var(--r-sm);height:14px}` + `@keyframes skel{to{background-position:-200% 0}}`, guarded by the existing `prefers-reduced-motion` block.","functional_flag":false,"scope":"manager"},"DA-MGR-28":{"id":"DA-MGR-28","phase":3,"dimension":"motion","screen":"all manager screens","wrong":"Motion is applied to one component only: `.qrow:hover` lifts `translateY(-1px)` with a shadow, while `.rowitem.click:hover` (the same affordance, used on team, member, alerts, inbox, swaps and every mobile list) only changes background, and `.cal-day`/`.cal-lane` animate outline-colour on drag but not on hover. There is no press feedback on `.rowitem.click` and no transition on the `.inbox-jchip` / `.statusfilter .sf-pill` toggles.","should":"One interaction grammar: all clickable rows share `background var(--t)` + `transform:translateY(-1px)` on hover and `translateY(0)` on `:active`; toggles animate `background`/`border-color` on `var(--t)`.","why":"Inconsistent feedback makes some rows feel clickable and others feel inert even though both navigate; the app reads as assembled rather than designed.","impl_note":"app.css:317-318 `.rowitem.click{ … transition:background var(--t) }` → `transition:background var(--t), transform var(--t)`; add `.rowitem.click:hover{ transform:translateY(-1px) }` and `.rowitem.click:active{ transform:translateY(0) }`. `.inbox-jchip` add `transition:background var(--t),border-color var(--t)`. All already covered by the existing `@media (prefers-reduced-motion:reduce)` blocks in app.css/schedule.css — extend the schedule.css:149 selector list with `.rowitem.click`.","functional_flag":false,"scope":"manager"},"DA-HR-01":{"id":"DA-HR-01","phase":1,"dimension":"hierarchy","screen":"all hr web screens","wrong":"`{hero:1}` is passed to the FIRST kpi() call on 20 of 22 HR screens that have a KPI row (hr.js:29,78,186,249,347,378,402,462,533,575,607,666,700,750,804,900,915…), and `.kpi.hero .k-value{color:var(--acc-d)}` is the only accent-coloured number on the page. On 6 screens the accent-highlighted 'hero' value is not a metric at all: data='phoungern-people' (a store name), payroll='PR-2026-06' (an id), pay-staff='All' (the current filter), pay-tax='Compliant', group='Biometric (face / finger)', pay-dash='Oct 15, 2026'.","should":"`hero` is a semantic flag for the one number the screen exists to report, applied per screen (pulse→Headcount, approvals→Waiting on HR, pay-dash→Gross (month), data→Rows, payroll→Gross (draft)), never by list position. Non-numeric tiles never take it.","why":"Accent is the console's only attention token. Spending it on whichever tile happens to be first teaches the eye that the colour means nothing, so the real lead metric on every screen loses its rank.","impl_note":"js/screens/hr.js — remove `{hero:1}` from the first kpi() call on data (line 186), payroll (402), pay-staff (666), pay-tax (804), group (575), pay-dash (607) and move it to the quantity tile in the same row (Rows / Gross (draft) / Gross Σ / NSSF (employee) / Members / Gross (month)). Leave app.css:287 unchanged.","functional_flag":false,"scope":"hr"},"DA-HR-02":{"id":"DA-HR-02","phase":1,"dimension":"responsiveness","screen":"all hr web screens","wrong":"At 1024 the rail renders icon-only but keeps its full 242px width: `@container shell (max-width:1024px){.rail{width:74px}}` (app.css:173-179) is declared BEFORE the base `.rail{width:242px}` (app.css:180-185) at equal specificity, so source order wins and only the label-hiding declarations take effect. Result: 33 icons at x≈113-128 with 168px of empty rail, and the 4 count badges (`position:absolute;right:3px` from the container block) float at x≈214 — ~90px from the icon they belong to, with no visual link.","should":"Rail 74px at ≤1024 with icons centred and each count badge pinned to its own icon's top-right corner.","why":"A third of the horizontal canvas is spent on nothing at exactly the width where the content is already starved (content container drops to 782px), and the detached badges attach unread counts to no object.","impl_note":"css/app.css — move the whole `@container shell (max-width:1024px){…}` block (lines 172-179) to immediately AFTER the `.rail{…}` base rule (ends line 185), or scope it as `.shell .rail{width:74px}`. No token change.","functional_flag":false,"scope":"hr"},"DA-HR-03":{"id":"DA-HR-03","phase":1,"dimension":"hierarchy","screen":"all hr web screens","wrong":"The breadcrumb slot prints a hard-coded string `admin.adeptio.hr/pulse` (hr.js:1017 `domain`, rendered by app.js:210 as the fallback `<nav class=\"crumbs\">`) on 32 of 42 HR web screens — including People & Org, Payroll, Data manager, Shift control and Cashbook, none of which are /pulse. Only 10 screens (approval, person, person-new, payroll-run, report-run, report-files, group, pay-ot, pay-otq, profile-edit) render a real breadcrumb in the identical slot at the identical y (102px).","should":"One breadcrumb system: every screen emits `crumbs` derived from its rail group and label (e.g. HR › Payroll › Staff pay); the static domain fallback is deleted.","why":"The same 10.5px mono line at the same position means 'where you are' on 10 screens and prints a wrong location on 32 — the one wayfinding affordance above the H1 is unreliable, so users stop reading it.","impl_note":"js/screens/hr.js — add `crumbs:[{label:<group>,go:<group index route>},{label:<screen title>}]` to the 32 screen defs that lack it, using the rail group/label already declared at hr.js:1040-1068. js/app.js:210 — replace the `${P.domain}` fallback with an empty `<nav class=\"crumbs\">` so a missing crumbs array renders nothing rather than a wrong path.","functional_flag":false,"scope":"hr"},"DA-HR-04":{"id":"DA-HR-04","phase":1,"dimension":"iconography","screen":"hr/web/sched-connector","wrong":"The two connector icons in the manifest table render unconstrained at ~190×190px (calendar glyph spans y=375-563, grid glyph y=675-865) because the cell holds a bare `icon()` SVG with no sizing rule — every other icon in the console is 12-17px (`.btn svg{14px}`, `.nav-item svg{17px}`, `.card-head .t svg{15px}`, `.rowitem .ric svg{16px}`). Row height is forced to ~240px and the page is 1763px tall for a 2-row table; the row label ('External calendar') is pushed below the icon instead of beside it.","should":"Connector icon in a 34×34 `.ric` tile with a 16px SVG, label to its right on the same baseline, row height ≈56px.","why":"It is the single loudest element in the persona and it carries no information — a 190px decorative glyph outranks every real control on the screen and makes a 2-row table three screens tall.","impl_note":"js/screens/schedule.js — wrap the connector cell glyph in `<span class=\"ric n\">${icon(...)}</span>` so app.css:305-306 (`.rowitem .ric{34×34;border-radius:10px}`, `.ric svg{16px}`) applies; or add `css/schedule.css .conn-cell svg{width:16px;height:16px;flex:none}`.","functional_flag":false,"scope":"hr"},"DA-HR-05":{"id":"DA-HR-05","phase":1,"dimension":"responsiveness","screen":"hr/mobile/queue, hr/mobile/sched-cal, hr/mobile/sched-swaps","wrong":"In the phone frame `.rowitem .rmain{flex:1;min-width:0}` collapses under a `flex:none` `.rside`: on queue the row title column measures 38px clientWidth against 289px of content (title renders as 'EX…', subtitle as 'Expe…'); on sched-cal 116px against 180-218px (all five rows read '2026-06-08 · Lin…'); on sched-swaps 162px against 224px. 15 / 31 / 9 hard-clipped nodes respectively, none scrollable.","should":"Below 360px inner width the row stacks: `.rmain` on its own line at full width, `.rside` actions/badges on a second line right-aligned, minimum 44px tall.","why":"The only text that identifies a request — who, what, how much — is truncated to 4-14 characters, so a user cannot tell the four queue rows apart before acting on them.","impl_note":"css/app.css — add `@container card (max-width:340px){ .rowitem{flex-wrap:wrap} .rowitem .rmain{flex:1 1 100%} .rowitem .rside{flex:1 1 100%;justify-content:flex-end;margin-top:8px} }` (the `.card` already declares `container-type:inline-size` at app.css:270).","functional_flag":false,"scope":"hr"},"DA-HR-06":{"id":"DA-HR-06","phase":1,"dimension":"accessibility","screen":"hr/mobile/approval, hr/mobile/queue, hr/mobile/sched-swaps","wrong":"The decision controls in the phone frame are 28-32px tall: 'Settle' 150×28 and 'Return' 150×28 on approval, 'Approve' 96×32 / 'Return' 84×32 on queue. On sched-swaps the approve control is an unlabelled 34×28 green check icon with no text. All are below the 44×44 minimum and the icon-only one has no accessible name.","should":"`.btn` in the phone frame ≥44px tall, full-width stacked at ≤340px, and the swap approval carries a visible 'Approve' label (icon + text) like every other queue row.","why":"These are irreversible decisions on a roster and a leave balance; a 28px target with a 4px gap invites mis-taps, and a bare ✓ gives no confirmation of what is being approved.","impl_note":"css/app.css — in the `.app-body` (phone frame) block near :499 add `.app-body .btn{min-height:44px;padding:12px 16px}` and `.app-body .row-acts{gap:8px}`. js/screens/schedule.js — give the swap approve button `${icon('check')} Approve` instead of the bare icon.","functional_flag":false,"scope":"hr"},"DA-HR-07":{"id":"DA-HR-07","phase":1,"dimension":"components","screen":"hr/web/comms, hr/web/pay-slips","wrong":"Selected toggle chips render three ways inside one card. On comms: 'Division · Production' = `--acc-bg` fill + `--acc-ln` border + `--acc-d` text; 'Email' = `--acc-bg` fill + icon; 'Push / in-app' = white fill + `--acc` border; 'Send now' = `--acc-bg` fill. So two chips that are both ON (Email, Push / in-app) look like different states, and one that is ON looks like the hover state of one that is OFF. pay-slips repeats the split (Email tinted, Push outlined).","should":"One selected treatment for `[aria-pressed=true]` across `.choice`, the composer chips and `.statusfilter .sf-pill`: `background:var(--acc-bg); border-color:var(--acc-ln); color:var(--acc-d)` — no outline-only variant.","why":"The composer's whole job is to show who and through which channels; if two ON chips look different the user cannot read the current selection at a glance and re-checks the '≈ 18 recipients · 2 channels' line instead.","impl_note":"css/app.css — add `.choice[aria-pressed=\"true\"], .choice.on{ background:var(--acc-bg); border-color:var(--acc-ln); color:var(--acc-d); }` and delete the outline-only selected rule used by the channel chips in js/screens/hr.js:140-150 (drop the inline `style=\"border-color:var(--acc)\"` and use the class).","functional_flag":false,"scope":"hr"},"DA-HR-08":{"id":"DA-HR-08","phase":1,"dimension":"hierarchy","screen":"hr/web/access, hr/web/time, hr/web/pay-dash, hr/web/pay-ot, hr/web/pay-otq","wrong":"Navigation is dressed as the page's primary action while the real actions are ghosts. access: three nav pills ('Import accounts', 'Demo outbox', 'Directory') where 'Directory' is `.btn` accent-filled — it reads as a selected segment but navigates away; the page's own actions (Resend / Revoke / Switch on) are all ghost. time: 'Clock-in/out setup' accent-filled, 'Exceptions' ghost — both are rail destinations. pay-dash: 'Pay runs' accent-filled, 'Staff pay' ghost — both nav. Measured: access@1440 aboveFoldPrimary=1 of 12 buttons and that 1 is a link.","should":"Page-level nav uses `.btn.ghost` or a `.card-head .link`; the accent fill is reserved for the one action that changes state on this screen (access → 'Resend invite'; time → 'Escalate'; pay-dash → none, leave the row ghost).","why":"The heaviest element on the page teleports the user off it. Every screen then reads as if its main job is to leave.","impl_note":"js/screens/hr.js — access (line ~300): change the three nav pills to `class=\"btn ghost\"`; time (~347): `Clock-in/out setup` → `btn ghost`; pay-dash (~607): `Pay runs` → `btn ghost`; pay-ot (~746) and pay-otq (~774): drop the duplicate top-right button entirely (see DA-HR-09).","functional_flag":false,"scope":"hr"},"DA-HR-09":{"id":"DA-HR-09","phase":1,"dimension":"components","screen":"hr/web/sched-cal, hr/web/pay-tax, hr/web/pay-ot, hr/web/pay-otq","wrong":"The same action is offered twice, in two different components, within one viewport. sched-cal: 'Publish planned' (accent-filled, top-right, y=195) and 'Publish plan' (accent-filled, in the Change log card, y=424) — two labels, one act, 229px apart. pay-tax: 'Save config' (top-right) and 'Save' (in the Configure card) plus 'Reset to statutory' twice. pay-ot / pay-otq: a tab strip 'Approvals | Quota management' at y=257 and a ghost button for the other tab at y=195 — the same two destinations, 62px apart, in two components.","should":"One instance per action, placed where its object is: publish sits in the Change log card (it acts on those moves); save sits under the Configure fields; the Approvals/Quota switch exists only as the tab strip.","why":"Two equal-weight primaries in one viewport means neither is the primary, and the user must work out whether the two buttons do the same thing before committing a roster or a statutory config.","impl_note":"js/screens/schedule.js calendar() — delete the top-right 'Publish planned' button, keep the 'Publish plan' button inside the change-log card. js/screens/hr.js payTax (~804) — delete the top-right 'Reset to statutory' + 'Save config' pair, keep the in-card pair. js/screens/hr.js payOt (~746) / payOtq (~774) — delete the top-right ghost button, keep the tab strip.","functional_flag":false,"scope":"hr"},"DA-HR-10":{"id":"DA-HR-10","phase":1,"dimension":"color","screen":"hr/web/approval, hr/web/approvals, hr/web/sched-swaps, hr/mobile/approval","wrong":"`.btn.ok{background:var(--ok);border-color:var(--ok)}` paints the decision button solid green on every approval surface, while `--acc` is the primary fill on all other 38 HR screens. On the approval detail the green 'Settle via payroll' sits directly above an equal-rank ghost 'Settle via finance' — colour says one route is the correct/safe one when they are two equivalent settlement paths.","should":"Approve / Settle uses the standard `.btn` (`--acc`) fill; `--ok` stays a status colour (`.badge.ok`, the chips and the capacity track) and is never a button fill.","why":"Green reads as confirmation, not as 'primary'. Using it for one of two symmetric choices biases an irreversible financial decision, and it breaks the single rule the rest of the console follows: accent = act.","impl_note":"css/app.css:422 — delete `.btn.ok`. js/screens/approvalsview.js + js/screens/hr.js + js/screens/schedule.js — replace `class=\"btn ok\"` with `class=\"btn\"` on Approve / Settle / Settle via payroll; leave Return as `.btn.ghost`.","functional_flag":false,"scope":"hr"},"DA-HR-11":{"id":"DA-HR-11","phase":1,"dimension":"responsiveness","screen":"hr/web/comms, hr/web/person, hr/web/pulse, hr/web/docs, hr/web/pay-dash, hr/web/pay-tax, hr/web/pay-slips, hr/web/clocking","wrong":"When the 2-column screens stack at 1024 the former right-rail card keeps a ~346px width inside the 704px content container, leaving ~360px of dead gutter to its right. On comms the 'Delivery — last 7 days' card is 345px wide with the Compose card above it at 704px; the same happens on person, docs, pay-dash, pay-tax, pay-slips and clocking.","should":"`.cols-2` children go to `minmax(0,1fr)` at the stack breakpoint (they already do) — the aside cards must also drop their inline width so the stacked card fills 704px.","why":"Half the usable canvas is blank at the exact width where the adjacent table is wrapping employee IDs mid-token; the page looks broken rather than adapted.","impl_note":"js/screens/hr.js — remove the `style=\"max-width:…\"` inline widths on the aside cards (comms ~line 155, pay-tax ~815, pay-slips ~720, docs ~470, clocking ~545) and let `.grid.cols-2 > .card` size from the grid track. Confirm app.css:264 is the rule that fires at 1024.","functional_flag":false,"scope":"hr"},"DA-HR-12":{"id":"DA-HR-12","phase":1,"dimension":"alignment","screen":"hr/web/pay-staff","wrong":"At 1024 the 8-column money table breaks the currency glyph off its number: the OT and MISC cells render '₭' on line 1 and '184,091' on line 2, and the NET column is pushed past the card edge (9 intersecting text pairs, 1 hard-clipped node, 375 contrast-checked nodes). `.tbl` has `width:100%` with no min-width and `.tablewrap{overflow-x:auto}` never engages because the cells wrap instead.","should":"`.tbl td` for money cells is `white-space:nowrap`, the table gets `min-width` so `.tablewrap` scrolls horizontally at 1024, and the ₭ glyph moves to the column header (see reduction).","why":"A split currency symbol makes a payroll figure unreadable and, worse, ambiguous — and the NET column, the one number the screen exists for, is off-canvas.","impl_note":"css/app.css — add `.tbl td.r, .tbl th.r{white-space:nowrap}` and `.tbl.money{min-width:760px}`; js/screens/hr.js payStaff (~666) — add the `money` class to the table and mark the 6 numeric columns with `cls:'r'`.","functional_flag":false,"scope":"hr"},"DA-HR-13":{"id":"DA-HR-13","phase":1,"dimension":"alignment","screen":"hr/web/data, hr/web/group","wrong":"Employee ids wrap mid-token at the widest breakpoint: the data-manager ID column renders 'EMP-' / '0214' on two lines (column ~68px inside a 693px table), and the group roster STAFF cell renders 'Souksavanh Phommachanh EMP-' / '0214'. Every other cell on those rows also wraps ('Machine' / 'Operator', 'Line' / 'A'), doubling row height to ~62px.","should":"Identifier cells (`.mono`, `.idtag`) are `white-space:nowrap`; the table gets a min-width and scrolls in `.tablewrap` rather than wrapping.","why":"A broken record id is not a record id — it can be mis-read or mis-copied, and it is the join key the whole HR console is built on.","impl_note":"css/app.css — add `.tbl td .mono, .tbl td.id{white-space:nowrap}` and `.tbl.dense{min-width:640px}`. js/screens/dbviews.js — wrap the ID cell value in `<span class=\"mono\">`; js/screens/hr.js group (~575) — put the EMP id in `UI.idtag()` like the People directory does.","functional_flag":false,"scope":"hr"},"DA-HR-14":{"id":"DA-HR-14","phase":1,"dimension":"components","screen":"hr/web/pay-otq","wrong":"The utilisation column is clipped at the card edge in both quota tables: the header reads 'UTILIS' (a cut word, no ellipsis, no title attribute) and the 28px utilisation bars are cut by the card padding at x=810 (monthly) and x=1358 (yearly). 5 intersecting text pairs at 1440, 11 at 1024. The bar itself carries no value — the percentage exists only as the three-colour fill.","should":"Header reads 'Utilisation'; the bar is ≥64px with its percentage printed beside it in `.num`; the table min-width forces `.tablewrap` to scroll instead of clipping.","why":"A quota screen whose utilisation column is both truncated and unlabelled cannot be read — the colour alone (amber/green/red) is the only signal and it fails for colour-blind users and at a glance.","impl_note":"js/screens/hr.js payOtq (~774) — header 'UTILIS' → 'Utilisation'; render the cell as `<span class=\"shift-cap\"><span class=\"sc-track\"><span style=\"width:${pct}%\"></span></span><b class=\"num\">${pct}%</b></span>`. css/app.css — `.tbl.quota{min-width:560px}`.","functional_flag":false,"scope":"hr"},"DA-HR-15":{"id":"DA-HR-15","phase":1,"dimension":"components","screen":"
