Let the submit command take a subject employee so an action taken on someone's behalf is filed against them.","why":"Ownership is matched on the display name so a rename orphans the history, ids derive from the row count and collide after a delete, and an HR-initiated advance is filed as a request by the HR user.","links":["H-APR-18","H-APR-03","H-PPL-17","H-EWA-07","H-APR-14","T13"],"effort":"M","area":"cross"},"X-10":{"id":"X-10","title":"Flags and licensing become real gates, with a guided first-run setup","what":"Every flag declares the menus, routes and engine paths it gates, and boot fails when a registered flag has no consumer. One tier, always-visible licensing behind an owner gate that can actually close. A thirteen-stage setup wizard walks the prerequisite graph in order and disables what is not yet configurable, with the reason shown.","why":"Five flags have no consumer, a flag that is off hides the menu while the route still works, two tier systems coexist and one is settable from a URL, the owner gate passes because the acting email falls back to an allowlisted address, and the licensing menu hides itself from the person who needs to enable it.","links":["F-PLT-01","F-PLT-02","F-PLT-03","H-PLT-01","H-PLT-03","H-PLT-04","H-PLT-05","H-EWA-05","H-ACC-02","T11"],"effort":"M","area":"cross"},"X-11":{"id":"X-11","title":"Delete the vanity complexity before adding structure","what":"Remove, in this order: the second pay-run lifecycle, the second channel registry, the second tier system, the legacy manager schedule frame, the duplicated connector stub, the saved-views API with no caller, the dead bulk credential setter, the never-submitted Expense type, the protective-check and flagged-grade machinery that nothing sets, and the second static profile table on the staff Me screen.","why":"Each of these is a parallel mechanism that costs maintenance and confuses readers while delivering nothing: two lifecycles named PR-2026-06, two channel registries neither of which knows about the other, a writer API with no caller, a registry attribute with no reader. This is the cheapest work on the list and it makes everything above smaller.","links":["H-PAY-02","H-COM-03","H-PLT-04","H-SCH-16","H-SCH-15","H-SCH-13","H-IDN-18","H-APR-09","H-APR-06","H-PPL-06","T12","T07","T08"],"effort":"M","area":"cross"},"X-12":{"id":"X-12","title":"Close the demo-to-real security seam before anything ships","what":"Move the sync bearer token server-side, require a session on the Worker's identity mutations, decide which Worker is deployed, require a session for the outbox, take the portal switch off the public page, stop putting live tokens in a replicated store, and write one custody rule that restore, export and import all obey.","why":"The shared bearer secret is in the public client bundle, the Worker's invite, mode and import endpoints need no session at all, the deployed Worker may have no auth routes so the whole remote path could be dead, the outbox with live reset links needs no session, and restore rehydrates identity hashes from a browser snapshot against the stated custody rule.","links":["F-IDN-12","F-IDN-01","F-IDN-11","F-PLT-05","F-PLT-07","H-IDN-27","H-IDN-28","H-IDN-04","H-IDN-25","H-IDN-01","H-IDN-09","H-PLT-08","H-PLT-12","T09"],"effort":"L","area":"cross"}},"design":{"DA-CEO-01":{"id":"DA-CEO-01","phase":1,"dimension":"hierarchy","screen":"ceo/web/packs","wrong":"Board packs renders two solid accent buttons (.btn.sm — plum fill, white label) reading 'Generate now'; they are the only filled primary buttons in the entire read-only persona (primaryActions aboveFoldPrimary=2 on packs@1440, 0 on the other 11 web screens) and they sit 30px under a READ-ONLY chip.","should":"The strongest control on a read-only screen must be a read act. 'Generate now' drops to .btn.sm.ghost; 'Export board pack' / 'Download file' become the one accent-tinted (.btn.soft) weight in the persona.","why":"A solid accent button is the app's loudest hierarchy signal. Spending it on the only write-shaped verb tells the board member this lens edits the ledger, contradicting the chip, the sub-line and the rail's whole promise.","impl_note":"reports.js:268 `<button class=\"btn sm\" data-act=\"report-gen:${id}\">` → `class=\"btn sm ghost\"`; ceo.js:37 and ceo.js:69 `<button class=\"btn ghost\" data-act=\"export:boardpack\">` → `class=\"btn soft\"` so the export is the one tinted control per screen.","functional_flag":false,"scope":"ceo"},"DA-CEO-02":{"id":"DA-CEO-02","phase":1,"dimension":"typography","screen":"all ceo chart screens (board, finance, trends, division)","wrong":"Charts are fixed-viewBox SVGs sized by `.chart{width:100%}`, so their type scale is a function of card width. Same lines2() component (viewBox 640): month labels render 8.9px on board (668px card inner), 13.7px on trends (1034px inner) and 6.5px on finance (486px inner). Same bars() component (viewBox 440): 10.5px on 'Division comparison' vs 6.5px on 'OT cost' at 1024 (300px inner); bars(w:320) inside the 668px 'Attendance capture' card renders its 9.5px labels at 19.8px — larger and heavier than the 13px card title above them.","should":"Chart labels hold one size across every card: 11px axis/value text, 13px for a direct label, independent of container width. Marks scale; text does not.","why":"The board persona is read at a glance across four chart cards on one page; when identical charts shout at 19.8px in one card and fall under the 8px legibility floor in the next, the eye cannot rank them and nothing reads as authored.","impl_note":"ui.js:141/158/176 (sparkline/bars/lines2) — stop emitting `<text>` inside the scaled SVG. Keep the SVG for marks only (`.chart` unchanged) and render axis ticks, value labels and category labels as an HTML layer beside it (`<div class=\"c-axis\">`/`<div class=\"c-cats\">`), styled once in app.css at `font-size:var(--fs-chart-label); color:var(--muted); font-weight:600` so every chart on every screen shares one size. Interim fix if the SVG text must stay: pass the card's real inner width as `opts.w` instead of the 320/440/640 defaults.","functional_flag":false,"scope":"ceo"},"DA-CEO-03":{"id":"DA-CEO-03","phase":1,"dimension":"components","screen":"ceo/web/finance, ceo/web/trends, ceo/web/board","wrong":"lines2() places y-axis ticks with text-anchor=\"end\" at x = padL-6 = 28 viewBox units, but the strings are 30–39 units wide, so the leading glyph is cut off by the viewBox edge: Finance shows '07.708' and '57.916' where the values are 207.708 and 157.916. Harness confirms hard-clipped, non-scrollable, no ellipsis or title.","should":"Every axis tick fully inside the plot frame, right-aligned to a gutter wide enough for the longest formatted tick.","why":"The y-axis is the only place a board member can read a magnitude off these charts (there are no tooltips and no value labels) — a clipped first digit turns 207 into 07.","impl_note":"ui.js:178 `padL = 34` → `padL = 58`; ui.js:187 `x=\"${padL - 6}\"` → `x=\"${padL - 10}\"`. Recheck with the longest tick the fmt can produce ('₭1.5B', '₭250M').","functional_flag":false,"scope":"ceo"},"DA-CEO-04":{"id":"DA-CEO-04","phase":1,"dimension":"typography","screen":"ceo/web/finance","wrong":"The 'Revenue vs staff-cost' chart prints raw unrounded floats on the y-axis — '257.5', '207.708', '157.916' — with no unit; the unit (₭M) appears only in the legend below. lines2() defaults `fmt = v => v` and ceo.js passes no fmt here, unlike burnChart() which passes `v => '₭' + v.toFixed(1) + 'B'`.","should":"Three ticks reading ₭150M / ₭200M / ₭250M — rounded, unit-carrying, same treatment as the burn chart two screens away.","why":"Finance is the persona's money screen; three-decimal machine floats on a board P&L read as an unfinished build, and the missing unit forces a round trip to the legend.","impl_note":"ceo.js:78 `lines2(ser.map(s=>M(s.revenue)), ser.map(s=>M(s.staffCost)), ser.map(s=>s.month))` → append `, { fmt: v => \"₭\" + Math.round(v) + \"M\" }`; and harden the default at ui.js:184 → `opts.fmt || (v => Math.round(v))`.","functional_flag":false,"scope":"ceo"},"DA-CEO-05":{"id":"DA-CEO-05","phase":1,"dimension":"responsiveness","screen":"ceo/web/sched-cal","wrong":"Shift-chip names hard-clip inside the month cells: at 1024 `.shiftchip .sc-name` measures sw=93 / cw=37 — 40% of the string, so every chip reads 'Line …' or 'Ware…'; at 1440 sw=110 / cw=87. 11 clipped nodes at 1024, 5 at 1440 — the worst clipping count of any CEO screen.","should":"The chip label either fits (2-line wrap, `-webkit-line-clamp:2`) or is replaced by a shift-group dot + count, with the name in a hover title.","why":"The whole point of the month grid at board altitude is 'which shift group, how covered'; truncating every chip to 'Line …' deletes the only differentiating token while keeping its full visual cost.","impl_note":"schedule.css:61 — inside the existing narrow container block (schedule.css:141, where `.sc-cap` is already dropped) add `.shiftchip{ align-items:flex-start } .shiftchip .sc-name{ white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; line-height:1.25 }` and raise the trigger from 360px to a `@container (max-width:1020px)` rule so 1024 gets it.","functional_flag":false,"scope":"ceo"},"DA-CEO-06":{"id":"DA-CEO-06","phase":1,"dimension":"density","screen":"ceo/mobile/board","wrong":"`<div class=\"grid cols-2\">${boardKpis(1)}</div>` collapses to a single column inside the ~318px phone body (app.css:263 `@container content (max-width:320px){ .cols-2{ grid-template-columns:minmax(0,1fr) } }`), so 4 KPI cards stack at ~101px each = 404px and fill the entire first screen; the 'Burn vs budget' chart never appears above the fold and the 4th tile's k-sub is cut by the tab bar. The `compact` argument boardKpis(1) receives is never read (ceo.js:11).","should":"2-up KPI tiles down to ~280px (2 rows of 2 ≈ 190px), the burn sparkline visible without scrolling, and the last card clearing the 54px tab bar.","why":"The mobile board is the glance surface — four stacked number cards and no chart is a list, not a snapshot, and the one visual that gives the numbers direction is the thing pushed off-screen.","impl_note":"app.css:263 `@container content (max-width: 320px)` → `(max-width: 270px)` so the phone body keeps 2-up; app.css:500-501 `.app-body .kpi{ padding:13px 15px }` → `padding:11px 13px` and `.app-body .kpi .k-value{ font-size:24px }` → `20px`; app.css:497 `.app-body{ padding:16px 16px 20px }` → `16px 16px calc(20px + 54px)` to clear `.tabbar`. Either use the `compact` flag in ceo.js:11 to drop the k-sub on mobile, or delete the dead parameter.","functional_flag":false,"scope":"ceo"},"DA-CEO-07":{"id":"DA-CEO-07","phase":1,"dimension":"color","screen":"ceo/web/board, ceo/web/trends, ceo/web/finance","wrong":"In every two-series chart the comparison series is drawn in `--muted-2` (#AFABA1) at 1.6px, dashed 4/4 — 2.29:1 against `--surface`, below the 3:1 floor for graphical objects, and the same near-invisible grey is reused for the legend swatch. That series is 'Budget' on board/trends and 'Staff cost' on finance: the benchmark the chart exists to show.","should":"The comparison series in `--ink-2` (#4A4954, 8.6:1) at 1.8px, dashed, with the legend swatch matching; `--muted-2` stays a text-support token and never carries data.","why":"A budget line the reader cannot see turns a variance chart into a single trend line — the board loses the one comparison it came for.","impl_note":"ui.js:188 `stroke=\"var(--muted-2)\"` → `stroke=\"var(--ink-2)\"`, `stroke-width=\"1.6\"` → `\"1.8\"`; ceo.js:22 `{ c: \"var(--muted-2)\", l: \"Budget\" }` → `{ c: \"var(--ink-2)\", l: \"Budget\" }`; ceo.js:78 same for 'Staff cost (₭M)'. Keep the dash so the two series stay distinguishable without colour.","functional_flag":false,"scope":"ceo"},"DA-CEO-08":{"id":"DA-CEO-08","phase":1,"dimension":"accessibility","screen":"ceo/web/divisions","wrong":"The Attrition column flags 'above 8%' with colour alone — `color:${d.attr > 8 ? \"var(--bad)\" : \"inherit\"}` — and uses the wrong member of the pair: `--bad` #B5675C is ≈4.1:1 on white at the table's 12.8px, while tokens.css states the `-text` variants are the AA-safe ones for small type. No legend, icon or header note explains the threshold.","should":"`--bad-text` (#94503F, 6.4:1) plus a non-colour mark — the app's own `badge('flagged')` or a ▲ glyph — and a column note naming the 8% threshold.","why":"Two of five rows are the entire point of the Compare table; encoding them in a sub-AA red that a colour-blind reader cannot separate from the black rows means the screen's one insight is invisible.","impl_note":"ceo.js:111 → `<span class=\"num\" style=\"color:${d.attr > 8 ? \"var(--bad-text)\" : \"inherit\"}\">${d.attr}%</span>${d.attr > 8 ? \" \" + badge(\"flagged\") : \"\"}` and change the column header (ceo.js:107) from `{ h: \"Attrition\", r: 1 }` to `{ h: \"Attrition (flag > 8%)\", r: 1 }`.","functional_flag":false,"scope":"ceo"},"DA-CEO-09":{"id":"DA-CEO-09","phase":1,"dimension":"responsiveness","screen":"ceo/mobile/sched-cal","wrong":"The 'Upcoming shifts' agenda lists named individuals ('Souksavanh Phom…', 'Manysone Vongpha…') on the persona whose stated guarantee, repeated on five other screens, is 'no individuals at this altitude' — and it clips them: `div.rmain > div.rt` sw=180 cw=116 and `div.rmain > div.rs` sw=218 cw=116, so roughly a third of each string shows. 31 clipped nodes and one text overlap with the bottom tab bar — the worst mobile screen in the persona.","should":"Aggregate rows at board altitude (shift group · covered/cap · status), with the row title fitting the 116px column; if names must appear they need a 2-line title and a badge that does not steal the width.","why":"Individual names on the read-only board lens break the product's own separation-of-duties story, and clipped to 'Souksavanh Phom…' they are not even usable as names — pure noise at full visual cost.","impl_note":"Visual half: app.css:314 `.rowitem .rt` → allow 2 lines inside `.app-body` (`.app-body .rowitem .rt{ white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical }`) and app.css:504 `.tabbar` — add the 54px bottom inset to `.app-body` padding so rows never sit under it. The row content itself (names vs aggregates) is a scope decision, not a style one.","functional_flag":true,"scope":"ceo"},"DA-CEO-10":{"id":"DA-CEO-10","phase":2,"dimension":"hierarchy","screen":"all ceo web screens","wrong":"27 of the 32 `.kpi` tiles across the 12 CEO web screens carry no comparison — the k-sub is a definition, not a delta: finance 4/4 ('this month', 'operating', '80% of revenue', '10% margin'), dataroom 4/4, report-files 4/4, packs 3/3, compliance 2/2, division 3/4, trends 2/3, board 1/4. Only 5 tiles show a movement.","should":"Every tile on a board lens carries a delta line: direction glyph + magnitude + period ('▼ 0.3 pts vs Q1'), in `--ok-text`/`--bad-text` by whether the move is good.","why":"A number with no baseline is unreadable at board altitude — 'Expenses ₭24,550,000' cannot be judged without last month, and the reader has to leave the screen to find out whether anything moved.","impl_note":"ui.js:74 add a 4th slot: `kpi(label, value, sub, opts)` renders `${opts.delta ? `<span class=\"k-delta ${opts.delta.good ? \"up\" : \"down\"}\">${opts.delta.good ? \"▼\" : \"▲\"} ${opts.delta.v}</span> <span class=\"k-sub-t\">${sub}</span>` : ...}`; app.css:284 reuse `.k-sub .up/.down` colours for `.k-delta`. Then feed it: ceo.js:72-75 (finance — prior month from LEDGER.series()), ceo.js:124-127 (division), ceo.js:95-97 (trends), ceo.js:170-173 (dataroom).","functional_flag":true,"scope":"ceo"},"DA-CEO-11":{"id":"DA-CEO-11","phase":2,"dimension":"color","screen":"ceo/web/board, ceo/mobile/board","wrong":"All four board deltas are wrapped in `<span class=\"up\">` regardless of direction, so '▼ 0.3', '+3' and '▼ 1.2' all render in `--ok-text` green; `.down` (`--bad-text`) is declared in app.css:286 but never used anywhere in the persona. The glyph and the semantic class are set by hand in two places and can disagree.","should":"One helper decides both: the glyph (▲/▼) from the sign of the change, the class (up/down) from whether that change is good for the metric, so a rising attrition and a rising headcount cannot both be green by accident.","why":"If green never has a red counterpart it stops meaning 'good' and becomes decoration; the board learns to ignore the one colour signal the tiles carry.","impl_note":"ceo.js:12 add `const d = (v, good) => `<span class=\"${good ? \"up\" : \"down\"}\">${v < 0 ? \"▼\" : \"▲\"} ${Math.abs(v)}</span>`;` and replace the four hand-written spans at ceo.js:13-16 with it (`d(-0.3,true)`, `d(+3,true)`, `d(-1.2,true)`).","functional_flag":false,"scope":"ceo"},"DA-CEO-12":{"id":"DA-CEO-12","phase":2,"dimension":"components","screen":"ceo/web/sched-cal","wrong":"Schedule coverage ships a second KPI anatomy: `.qv-cell` puts the value first at clamp(18–24px) and the label under it at 10.5px, on an 11px radius, 5-up — against `.kpi` on the other 10 screens which puts a 10.8px uppercase label first, the value at 32px, on a 16px radius, 4-up. Two tile systems, two reading orders, two corner families, on one product.","should":"One KPI component. `.cal-quick` composes `.kpi` (label → value), inherits `var(--r)` and the 32px/24px value scale, and simply allows a 5th column.","why":"A board user moving from Board to Schedule coverage has to re-learn where the label is; the inconsistency reads as two teams rather than one app.","impl_note":"js/screens/schedule.js:447 — emit `UI.kpi(label, value, \"\")` inside `.cal-quick` instead of the bespoke `.qv-cell`; schedule.css:21 `.cal-quick{ grid-template-columns:repeat(5,minmax(0,1fr)) }` kept, delete schedule.css:22-29 and let `.kpi` + `.card` supply padding, radius (`var(--r)`) and shadow.","functional_flag":false,"scope":"ceo"},"DA-CEO-13":{"id":"DA-CEO-13","phase":2,"dimension":"hierarchy","screen":"all ceo web screens","wrong":"The READ-ONLY chip is injected into `.screen-head .actions` as the first item in the button row (ceo.js:9, used on 11 screens). It is pill-shaped, 10.5px/800-weight/.1em tracked and accent-tinted — visually heavier than the real button beside it (12.8px/700) — so a non-interactive status label out-shouts the only action on the screen and invites a click. On 6 screens it is the sole occupant of the actions row.","should":"The chip belongs in the eyebrow, on the crumbs line above the h1, at 700 weight; the actions row holds only things you can press.","why":"A read-only lens must make the difference between 'state' and 'control' obvious; putting the state chip in the control row does the opposite and burns the top-right hierarchy slot on a label.","impl_note":"app.js screen-head template — render `${ro}` next to `nav.crumbs` rather than inside `.actions`; ceo.js:9 keep the helper, drop it from the 11 `actions:` strings. app.css:403 `font-weight:800` → `700`; app.css:404 `color:var(--ceo-d); background:var(--ceo-bg); border-color:var(--ceo-ln)` → `var(--acc-d)/var(--acc-bg)/var(--acc-ln)` so the chip follows the persona accent.","functional_flag":false,"scope":"ceo"},"DA-CEO-14":{"id":"DA-CEO-14","phase":2,"dimension":"components","screen":"ceo/web/board, ceo/web/finance, ceo/web/packs, ceo/web/report-run","wrong":"One act — get the numbers out — wears three button weights across four screens: `.btn.ghost` (white, grey border) for 'Export board pack' on board/finance, `.btn.soft` (accent-tinted fill) for 'Download file (.csv)' on report-run, and solid `.btn.sm` for 'Generate now' on packs. A fourth variant, `.btn.ghost.sm.soon` ('Request a change'), is greyed to 50% opacity and only raises a toast.","should":"Two weights only in this persona: `.btn.soft` for every export/download, `.btn.ghost` for navigation ('File storage'). Nothing solid, nothing at .soon opacity.","why":"Button weight is how the reader ranks what a screen is for; three weights for the same act means the ranking carries no information and each screen has to be decoded fresh.","impl_note":"ceo.js:37 & :69 `btn ghost` → `btn soft`; ceo.js:193 'File storage' stays `btn ghost`; reports.js:268 solid `btn sm` → `btn sm ghost` (see DA-CEO-01); reports.js:294-295 keep `btn soft` + `btn ghost`; ceo.js:195 delete the `.soon` 'Request a change' button (see reduction).","functional_flag":false,"scope":"ceo"},"DA-CEO-15":{"id":"DA-CEO-15","phase":2,"dimension":"components","screen":"ceo/web/trends","wrong":"'OT cost (₭M / month)' calls `bars(..., {})` — no `values:1` — so its 12 bars carry no value labels, and bars() draws no y-axis, leaving the only quantified chart in the persona with zero readable numbers. The two other bars() instances (Division comparison ceo.js:28, Top expenses ceo.js:79) both pass `values:1`.","should":"Same component, same contract: value labels on, or a y-axis; on a 12-bar series label the first, last and peak only rather than all twelve.","why":"A board member looking at 'OT cost' can see the shape but not the size — and the neighbouring chart on the same screen does give numbers, so the omission reads as an oversight rather than a choice.","impl_note":"ceo.js:91 `bars([62,58,…].map((v,i)=>({l:DATA.burn.labels[i], v, tone:…})), {})` → `, { values: 1 })`; with 12 bars also add `opts.sparseValues` handling in ui.js:170 so only min/max/last get a `<text>` (the others keep the label row only).","functional_flag":false,"scope":"ceo"},"DA-CEO-16":{"id":"DA-CEO-16","phase":2,"dimension":"color","screen":"ceo/web/trends","wrong":"The OT cost bars encode a threshold with a reserved status token — `tone: v > 75 ? \"warn\" : undefined` paints 3 of 12 bars `--warn` #C28A4A — with no legend, no reference line and no caption naming the threshold. #C28A4A is also the Staff persona accent (`--staff`), so amber bars inside the plum Board app read as another persona's colour.","should":"Keep the series in one accent and mark the threshold with a dashed reference line at ₭75M plus a one-line caption, or keep the amber and ship the legend that explains it.","why":"Status colours only work because they are reserved; spending amber on 'three months were high' with nothing to decode it turns the chart's most salient mark into an unexplained alarm.","impl_note":"ceo.js:91 — either drop `tone` and append `+ legend([{c:\"var(--acc)\", l:\"OT cost\"}])` with a `opts.ref:75` dashed line added to ui.js bars() (`<line stroke=\"var(--line)\" stroke-dasharray=\"4 4\">` + an end label '₭75M ceiling'), or keep the tone and append `legend([{c:\"var(--acc)\", l:\"Within ceiling\"},{c:\"var(--warn)\", l:\"Above ₭75M\"}])`.","functional_flag":false,"scope":"ceo"},"DA-CEO-17":{"id":"DA-CEO-17","phase":2,"dimension":"components","screen":"ceo/web/board, ceo/web/division, ceo/web/trends, ceo/mobile/trends","wrong":"sparkline() is the lead visual on four cards but auto-scales to min–max with no axis, no baseline and no end-value, so the 'Org attendance' card turns a 95.1%-with-a-2-point-spread series into a mountain range; on ceo/web/division it carries no caption at all (ceo.js:130) — a decorative squiggle with no number anywhere in the card.","should":"A baseline the reader can name (0, or a supplied floor), the last value direct-labelled at the line's end, and a min/max pair in the corner — the caption pattern already used on board and trends.","why":"An autoscaled sparkline with no scale exaggerates every wobble; on a board lens that is the difference between 'attendance is flat' and 'attendance is collapsing'.","impl_note":"ui.js:141 add `opts.floor` (default `min`) and `opts.endLabel`: draw the area from `Y(opts.floor)` and append the final value as an HTML label beside the SVG (per DA-CEO-02, text outside the scaled SVG). ceo.js:130 `sparkline(DATA.attendanceTrend.map(...), {h:100})` → add the same `<div class=\"small\">` caption board uses, with the value in `--ink-2` not `--muted`.","functional_flag":false,"scope":"ceo"},"DA-CEO-18":{"id":"DA-CEO-18","phase":2,"dimension":"components","screen":"ceo/web/dataroom","wrong":"'Last restore drill' renders the word PASS in `.k-value.num` — 32px display face, `font-variant-numeric:tabular-nums`, `letter-spacing:-.035em` — sitting in a row with '15 / 15', '1' and '10'. A status is wearing the numeric component.","should":"The tile's value slot holds `badge('ok')` (or a 20px status word in `--ok-text`) with the timestamp as the sub, so status and magnitude are never confused at a glance.","why":"Board readers scan the KPI row for magnitudes; a 32px word in the number slot breaks the scan and, at -0.035em tracking on a display face, PASS reads as cramped.","impl_note":"ceo.js:172 `kpi(\"Last restore drill\", drills[0] ? drills[0].result.toUpperCase() : \"—\", drills[0] ? drills[0].ts : \"scheduled monthly\")` → `kpi(\"Last restore drill\", drills[0] ? badge(drills[0].result === \"pass\" ? \"ok\" : \"failed\") : badge(\"pending\"), drills[0] ? drills[0].ts : \"scheduled monthly\")`; add `app.css .kpi .k-value .badge{ font-size:12px; vertical-align:6px }` so the badge sits on the value baseline.","functional_flag":false,"scope":"ceo"},"DA-CEO-19":{"id":"DA-CEO-19","phase":2,"dimension":"alignment","screen":"ceo/web/report-run","wrong":"The result-set table right-aligns only columns after index 1 (`r: i > 1`), so a two-column METRIC/VALUE run renders 248 / 95.1% / 1.42 / 1.45 / 7.2 left-aligned against a left-aligned 'VALUE' header — while the Divisions table two screens away right-aligns every numeric column.","should":"Numeric columns right-aligned and tabular everywhere, including the 2-column case.","why":"Left-ragged numbers cannot be compared down a column; the app already sets the right convention elsewhere, so this reads as a bug rather than a variant.","impl_note":"reports.js:284 `r: i > 1` → `r: i > 0`, and wrap the value cell in `<span class=\"num\">` unconditionally (the existing `/^[\\d.]+$/` test drops '95.1%' and '11/11 stores' out of tabular-nums).","functional_flag":false,"scope":"ceo"},"DA-CEO-20":{"id":"DA-CEO-20","phase":2,"dimension":"spacing","screen":"ceo/web/dataroom","wrong":"Vertical rhythm between stacked grids is carried by a hand-written `style=\"margin-top:16px\"` in the screen JS — six times in ceo.js — and dataroom's second grid (ceo.js:175) is missing it, so the gap under its KPI row is the 12px grid gap instead of the 16px every other CEO screen uses.","should":"One CSS rule owns the rhythm: `.grid + .grid{ margin-top:16px }`, and the six inline styles disappear.","why":"A 4px inconsistency on one screen is invisible alone but is exactly how a page stops feeling machined; more importantly the rhythm lives in six copies that can each drift again.","impl_note":"app.css:240 add `.grid + .grid{ margin-top:16px }` (or `var(--sp-4)` once a spacing scale exists), then delete the `style=\"margin-top:16px\"` attributes at ceo.js:40, 49, 77, 90, 94, 129, 149.","functional_flag":false,"scope":"ceo"},"DA-CEO-21":{"id":"DA-CEO-21","phase":2,"dimension":"typography","screen":"ceo/web/sched-cal","wrong":"The rail item reads 'Schedule coverage', the page h1 reads 'Calendar', and the sub is written in staff second person — 'Read-only — your published shifts' — on an org-wide, all-divisions board view where none of the shifts are the reader's.","should":"H1 matching the nav label ('Schedule coverage') and a sub in board voice: 'Published coverage across all divisions — read-only.'","why":"The nav label is the promise and the h1 is the payoff; when they disagree the reader has to check they clicked the right thing, and second-person copy on an aggregate lens contradicts the persona everywhere else.","impl_note":"js/screens/schedule.js:152 `return { title: \"Calendar\", sub, … }` → `title: o.title || \"Calendar\", sub: o.sub || sub`; ceo.js:261 pass `{ …, title: \"Schedule coverage\", sub: \"Published coverage across all divisions — read-only.\" }`.","functional_flag":false,"scope":"ceo"},"DA-CEO-22":{"id":"DA-CEO-22","phase":2,"dimension":"iconography","screen":"all ceo web screens","wrong":"At 1024 the rail collapses to 74px and hides every label, group eyebrow and the app name (`.rail .group, .rail-head .t, .rail-head .s, .nav-item span.lbl, .rail-foot .note { display:none }`), leaving 8 unlabelled 16px glyphs with no title attribute or tooltip, no divider between Insight / Governance / Account, and no 'Adeptio Board' wordmark — the only remaining cue that this is the Board app is the plum tint on the active pill.","should":"Icon-only rail keeps a hover/focus tooltip from the item's label, a 1px `--line-2` divider where each group used to start, and the 2-letter app mark in `.rail-head .pin`.","why":"Board / Finance / Trends / Divisions / Schedule / Compliance / Packs / Data room reduced to eight similar line glyphs is an unreadable menu, and losing the app name at the exact width where the persona chips also shrink removes every 'where am I' anchor.","impl_note":"app.css:175 — keep `.rail .group` visible as a rule rather than hiding it: `.rail .group{ font-size:0; height:1px; background:var(--line-2); margin:12px 8px }`; add `.nav-item{ position:relative } .nav-item:hover::after{ content:attr(aria-label); position:absolute; left:calc(100% + 8px); … background:var(--ink); color:#fff; border-radius:var(--r-sm); font-size:11px; white-space:nowrap; z-index:5 }` and ensure app.js emits `aria-label` on each `.nav-item`.","functional_flag":false,"scope":"ceo"},"DA-CEO-23":{"id":"DA-CEO-23","phase":2,"dimension":"alignment","screen":"all ceo web screens","wrong":"`.screen-head{ display:flex; flex-wrap:wrap }` with no `margin-left:auto` on `.actions`: at 1024 every CEO screen drops the action row onto its own line under the sub and left-aligns it, so the READ-ONLY chip + Export pair jump from top-right (1440) to bottom-left (1024), adding a ~40px band that on 6 screens holds only the chip.","should":"When the header wraps, `.actions` stays right-aligned on its new row — same anchor at both widths.","why":"The top-right corner is where a reader looks for what a screen lets them do; moving it to the left edge at one breakpoint means relearning the page, and the extra band pushes the first KPI row further below the fold on the densest screens.","impl_note":"app.css:234 `.screen-head{ align-items:flex-end }` → `align-items:flex-start`; app.css:237 `.screen-head .actions{ display:flex; gap:9px; flex:none; flex-wrap:wrap }` → add `margin-left:auto; align-self:flex-end`.","functional_flag":false,"scope":"ceo"},"DA-CEO-24":{"id":"DA-CEO-24","phase":2,"dimension":"spacing","screen":"ceo/mobile/division","wrong":"Two of the four stacked tiles pass an empty sub — `kpi(\"Staff\", String(d.staff), \"\")` and `kpi(\"Attrition\", d.attr + \"%\", \"\")` — and ui.js:78 renders nothing for a falsy sub, so those cards are ~20px shorter than 'Cost / share' and 'OT / month' directly above and below them. Four cards, two heights, in one vertical stack.","should":"All four tiles the same height: give Staff and Attrition real subs ('headcount', 'vs org 7.2%') — which also closes DA-CEO-10 for this screen.","why":"A stacked column of identical cards is the one place a height difference is unmissable; it reads as a rendering fault rather than a difference in content.","impl_note":"ceo.js:248 `${kpi(\"Staff\", String(d.staff), \"\")}` → `\"headcount\"`; ceo.js:249 `${kpi(\"Attrition\", d.attr + \"%\", \"\")}` → `d.attr > 7.2 ? \"above org 7.2%\" : \"below org 7.2%\"`. Belt and braces: ui.js:78 → always emit `<span class=\"k-sub\">${sub || \"&nbsp;\"}</span>`.","functional_flag":false,"scope":"ceo"},"DA-CEO-25":{"id":"DA-CEO-25","phase":2,"dimension":"components","screen":"all ceo web screens","wrong":"Every CEO screen renders 5–6 distinct border-radii against the 4 radius tokens: 99px (pills), 16px (`--r`, cards), 11px (`--r-sm`, chips), 10px and 9px (buttons — literals in app.css) and 3px (legend swatch). Buttons and cards therefore never share a corner family.","should":"Buttons on `var(--r-sm)` (11px) so a button's corner matches the chips it sits beside and relates to the card's 16px; only pills keep 99px.","why":"Corner radius is one of the few shape cues a flat, low-chrome UI has; four near-identical values (9/10/11/16) read as noise rather than a system.","impl_note":"app.css:412 `border-radius:10px` → `var(--r-sm)`; app.css:425 `.btn.sm{ border-radius:9px }` → `var(--r-sm)`; app.css:426 `.btn.xs{ border-radius:8px }` → `var(--r-sm)`. Leaves 99 / 16 / 11 / 3 on a CEO screen.","functional_flag":false,"scope":"ceo"},"DA-CEO-26":{"id":"DA-CEO-26","phase":3,"dimension":"empty states","screen":"ceo/web/report-files, ceo/web/packs","wrong":"The persona's two empty surfaces use bare muted sentences — `<p class=\"small muted\">Empty — runs land here automatically…</p>` on every report-files folder and `<p class=\"small muted\">No runs yet — generate the first one.</p>` on packs — while the app ships an `empty()` component (icon at 30px/.4 opacity, 13px title, 12px sub, centred, 36px padding) that appears in zero of the 29 CEO shots. Both sentences sit in `--muted` #7C786F (4.40:1) and are the only content in their card.","should":"`empty()` in both places: folder icon, 'No archived packs yet', and the retention sentence as the sub — one empty-state treatment across the product.","why":"Report file storage is an all-empty screen today; six identical grey sentences read as unfinished, where the empty component reads as a designed state.","impl_note":"reports.js:312 `: `<p class=\"small muted\">Empty — runs land here automatically…</p>`` → `: empty(\"folder\", \"No archived packs yet\", \"Runs land here once a pack has more than \" + DB.reports.VISIBLE + \" (retention keeps 12).\")`; reports.js:266 `<p class=\"small muted\">No runs yet — generate the first one.</p>` → `empty(\"file\", \"No runs yet\", \"Generate the first one from this section.\")`.","functional_flag":false,"scope":"ceo"},"DA-CEO-27":{"id":"DA-CEO-27","phase":3,"dimension":"loading states","screen":"all ceo chart screens","wrong":"No loading or skeleton state exists anywhere in the persona: every chart and table is built synchronously from DATA / LEDGER / DB inside the screen function, and `.chart{ height:auto }` means the card has no reserved height, so a slower data path would collapse the card and reflow the whole board.","should":"A `.card.is-loading` skeleton — the chart area holds its final height with a `--line-2` shimmer, KPI values show a 32px-tall bar — so the board's layout is stable from first paint.","why":"The board page is four charts and sixteen tiles; without reserved heights any real data source turns the first second into a jumping page, which is the least board-like impression the product can give.","impl_note":"app.css:380 add `.chart{ min-height:96px }` and a skeleton block: `.card.is-loading .chart, .card.is-loading .k-value{ background:linear-gradient(90deg, var(--line-2), var(--surface-2), var(--line-2)); border-radius:var(--r-sm); color:transparent; animation:sk 1.2s var(--ease) infinite } @keyframes sk{ … }` with `@media (prefers-reduced-motion:reduce){ animation:none }` (the file already has 3 reduced-motion blocks).","functional_flag":true,"scope":"ceo"},"DA-CEO-28":{"id":"DA-CEO-28","phase":3,"dimension":"motion","screen":"all ceo chart screens","wrong":"All four chart types are emitted with `aria-hidden=\"true\"` and no `<title>`, no crosshair, no per-mark tooltip and no table fallback — so a 12-point burn line offers no way to read any month's value, and the only numbers on the card are the three y-ticks (which DA-CEO-03 clips). Hover on a card does nothing; only `.card-head .link` and `.rowitem.click` have hover states.","should":"Crosshair + tooltip on lines2/sparkline, per-mark tooltip on bars/donut, `role=\"img\"` with an aria-label naming the series and the trend, and a table view for the burn and division charts.","why":"An HTML chart that cannot be interrogated is a picture of a chart; on the one persona whose entire job is reading numbers, that is the difference between a dashboard and a screenshot.","impl_note":"ui.js:151/164/185/197 `aria-hidden=\"true\"` → `role=\"img\" aria-label=\"${esc(opts.alt || '')}\"`; add `<title>` per `<rect>`/`<circle>`; add a shared `.chart-tip` (absolute, `background:var(--ink)`, `color:#fff`, `border-radius:var(--r-sm)`, `font-size:11px`, `box-shadow:var(--sh)`) driven by a pointermove handler on `.chart`, with `transition:opacity var(--t)` and the existing `prefers-reduced-motion` guard.","functional_flag":true,"scope":"ceo"},"DA-CEO-29":{"id":"DA-CEO-29","phase":3,"dimension":"density","screen":"ceo/web/security, ceo/web/report-files, ceo/web/finance, ceo/web/compliance","wrong":"Four screens end far above the fold and leave the canvas bare: security renders one ~100px card under a 28px h1 and then ~560px of empty canvas (165 DOM elements, 37 text nodes — the lightest screen in the product); report-files ends at y≈600 with ~300px empty; finance ends at y≈630 with ~270px empty; on compliance the 'Trail (aggregate)' card stretches to 335px to match its neighbour while holding three lines of muted prose.","should":"Either fill the screen (security gains the credential/session/recent-access blocks the other personas' security pages have) or let short pages sit in a narrower, centred column (`--maxw` 1180 → ~760px for prose-only screens) so the emptiness reads as intentional.","why":"A board app is judged on composure; a full-bleed 1180px canvas with one small card in the top-left corner reads as a page that failed to load.","impl_note":"app.css — add `.workspace-inner.is-narrow{ max-width:760px }` and have app.js set it for screens whose body is a single card (security, report-files when empty); equalise compliance by giving `.grid.cols-2 > .card{ align-self:start }` so a short prose card stops stretching to its neighbour's height.","functional_flag":false,"scope":"ceo"},"DA-CEO-30":{"id":"DA-CEO-30","phase":3,"dimension":"components","screen":"ceo/web/security","wrong":"'My security' is the only CEO web screen with no READ-ONLY chip (ceo.js:255 defines no `actions`) — and it is the one screen where the user genuinely can act. The distinction is invisible: the page looks identical in chrome to the ten read-only screens, just emptier.","should":"Since this is the persona's single writable surface, mark it positively — an 'Account' eyebrow and, when the portal flag is on, a real primary control — rather than by the silent absence of the chip.","why":"The read-only chip is the persona's core signal; its absence is currently the only thing distinguishing the one editable screen, and absence is not a signal anyone notices.","impl_note":"ceo.js:255 add `actions: `<span class=\"eyebrow acc\">Account</span>`` (app.css:46/50 already styles `.eyebrow.acc`), and once DA-CEO-13 moves `${ro}` to the crumb line the two screen types differ by a deliberate label rather than by omission.","functional_flag":false,"scope":"ceo"},"DA-DS-01":{"id":"DA-DS-01","phase":1,"dimension":"color","screen":"all screens (all 5 personas + shell)","wrong":"--muted #7C786F is 4.40:1 on --surface #FFFFFF, 3.89:1 on --canvas #F2F1EC, 4.22:1 on --surface-2 and 3.76:1 on --line-2 chrome — it fails 4.5:1 on every background in the system. It is the single largest defect in the audit: the three top failing fg/bg pairs are all --muted (1,116 + 555 + 410 = 2,081 of the 2,730 sampled worst-10 entries), inside a total of 8,965 failing text nodes / 26,592 sampled (34%). The token comment in tokens.css:12 claims it was darkened in v2.3.1 'for 4.5:1 small-label contrast' — that claim is false by 0.10 on white and by 0.61 on the canvas the app actually renders on.","should":"One muted text tone that clears 4.5:1 on all four backgrounds the app paints text on (--surface, --surface-2, --canvas, --line-2). #6B675E gives 5.63 / 5.40 / 4.98 / 4.82 — same warm-grey hue (HSL 41.5deg, sat 5.5%), only 17 lightness steps darker, so nothing in the pastel identity shifts.","why":"--muted carries the app's entire secondary layer: every table column header, every KPI label and subline, every breadcrumb, every card tag, the rail group labels and the unselected topbar segment labels. When the secondary layer is sub-threshold the hierarchy does not read as 'quiet', it reads as 'unfinished', and on the warm canvas it disappears entirely in bright ambient light.","impl_note":"tokens.css:13 --muted:#7C786F -> --muted:#6B675E (white 5.63 / surface-2 5.40 / canvas 4.98 / line-2 4.82). Delete the now-false comment on tokens.css:11-12 and replace with '/* --muted verified >=4.5:1 on surface, surface-2, canvas and line-2 */'. Absolute floor if the tone must stay lighter is #6F6B63 (4.54 on line-2) — do not use #716E65, it is 4.36 on --line-2 and the topbar/seg chrome is --line-2.","functional_flag":false,"scope":"design-system"},"DA-DS-02":{"id":"DA-DS-02","phase":1,"dimension":"color","screen":"all screens + _shell/launcher","wrong":"--muted-2 #AFABA1 is 2.29:1 on white and 2.03:1 on --canvas, yet it is applied to running text in 6 places, including the second clause of the launcher's 62px hero headline ('Local, LDAP, or RADIUS.' — 2.03:1, which fails even the 3:1 large-text threshold), the calendar day-of-week row (schedule.css:33, 10px), the heat-calendar dow row (app.css:392, 9px) and the dashed border of the sign-in state chip (app.css:781).","should":"--muted-2 must stop being a text colour. Raise it to #716D64 (5.16 white / 4.56 canvas) for the tertiary text rung, and move the genuinely decorative uses (scrollbar thumb, ghost-button hover border, locked bullet, dashed chip border) to a separate non-text token --line-3:#C9C4B9 that only ever touches borders and 1px rules.","why":"A 2.03:1 headline clause is not a de-emphasised phrase, it is an invisible one — half the launcher's value proposition is unreadable, and it is the first screen every persona sees. Mixing a text role and a decoration role in one token is what allowed the failure to spread.","impl_note":"tokens.css:13 --muted-2:#AFABA1 -> --muted-2:#716D64, and add --line-3:#C9C4B9. Then repoint the decorative uses: app.css:34 scrollbar-color:var(--muted-2) -> var(--line-3); app.css:37 background:var(--muted-2) -> var(--line-3); app.css:420 .btn.ghost:hover border-color:var(--muted-2) -> var(--line-3); app.css:572 .hub-card.locked li::before background:var(--muted-2) -> var(--line-3); app.css:781 .seg-login.off border:1px dashed var(--muted-2) -> var(--line-3). Text uses keep the new --muted-2: app.css:130, app.css:392 (also raise 9px -> var(--fs-micro)), schedule.css:33.","functional_flag":false,"scope":"design-system"},"DA-DS-03":{"id":"DA-DS-03","phase":1,"dimension":"color","screen":"all screens (every .btn, .nav-item .count, .clock-hero, .heatcal .hc.l3, .step.done .sdot)","wrong":"app.css:411 sets the primary button to background:var(--acc); color:#fff. White on the persona accent measures staff 2.99:1, manager 3.23:1, HR 3.31:1, sysadmin 3.48:1, CEO 3.72:1 — the primary action label fails 4.5:1 in all five personas, and fails 3:1 in two. The same white-on-accent pair also drives the rail count badge (app.css:211), the done step dot (app.css:372), the heat-cal l3 cell (app.css:389) and the whole mobile clock-in hero (app.css:522-523). The harness caught it as the 4th and 5th most frequent failing pair: white on rgb(110,143,192) x107, white on rgb(94,145,160) x100.","should":"A dedicated fill rung per accent, dark enough for white at 4.5:1, added to the persona switch alongside --acc/--acc-d: staff #9D6C35 (4.54), manager #598059 (4.51), HR #4D76B2 (4.62), CEO #7758A7 (5.62), sysadmin #517D8A (4.52), brand #5C6493 (already 5.68, unchanged). --acc keeps its current value for borders, dots, rails and 1px accents where 3:1 non-text is the bar.","why":"The primary button is the one element in the system whose entire job is to be unmissable. When its label is at 3:1 the strongest visual weight on the screen carries the weakest legibility, which is exactly backwards — and it is why so many screens read as having no primary action even when one is present.","impl_note":"tokens.css: add --staff-f:#9D6C35; --mgr-f:#598059; --hr-f:#4D76B2; --ceo-f:#7758A7; --sys-f:#517D8A; --brand-f:#5C6493; then --acc-f:var(--brand-f) on :root:34 and --acc-f:var(--<p>-f) in each body[data-persona] rule (tokens.css:54-58). app.css:411 border:1px solid var(--acc); background:var(--acc) -> border:1px solid var(--acc-f); background:var(--acc-f). app.css:211 background:var(--acc) -> var(--acc-f). app.css:372 background/border-color:var(--acc) -> var(--acc-f). app.css:389 background:var(--acc) -> var(--acc-f). app.css:523 linear-gradient(150deg, var(--acc) 0%, var(--acc-d) 115%) -> linear-gradient(150deg, var(--acc-f) 0%, var(--acc-d) 115%). Leave app.css:207 (.nav-item::before rail indicator), :217 (.tier-chip .led), :451 (.switch on-state) on --acc — they are non-text and clear 3:1.","functional_flag":false,"scope":"design-system"},"DA-DS-04":{"id":"DA-DS-04","phase":1,"dimension":"responsiveness","screen":"all web screens at 1024 (all 5 personas)","wrong":"At 1024 the rail collapses to icon-only but keeps its full 242px width, so ~168px x full viewport height (roughly 16% of the canvas) is empty rail. The cause is source order, not the query: app.css:173-179 declares @container shell (max-width:1024px){ .rail{width:74px;padding:18px 10px} } BEFORE the base rule app.css:180-185 .rail{width:242px;padding:20px 14px 18px}. Equal specificity (0,1,0), later declaration wins, so only the display:none half of the block survives. Second symptom from the same bug: .nav-item .count is switched to position:absolute;top:3px;right:3px (app.css:178) but the button is still 222px wide, so every badge floats ~100px from its icon at the top edge of its row and visually annotates the icon ABOVE it — on sysadmin/database@1024 the '2' sits between the Platform-health and Templates icons.","should":"The @container block must be declared after the base .rail rules so the 74px width and 10px padding actually apply; the rail becomes 74px, the workspace gains 168px, and the count badges land back on their own icons.","why":"The 1024 breakpoint is where a laptop user lives, and the shell answers a narrower viewport by keeping the same chrome width and shrinking only the content — the opposite of what a collapse is for. The 168px it wastes is exactly the width that stops the directory table wrapping names onto two lines, and the detached badges break the one association the icon-only rail still depends on.","impl_note":"Cut the block at app.css:173-179 in its entirety and re-insert it immediately after app.css:218 (.rail-foot .note), i.e. after every base .rail/.rail-head/.nav-item/.rail-foot declaration. No property values change. Also at app.css:176 .rail-head{justify-content:center;padding:6px 0 12px} is defeated the same way by app.css:186-189 — the move fixes it too. Then set app.css:178 .nav-item .count{top:4px;right:6px} for the 54px-wide icon button.","functional_flag":false,"scope":"design-system"},"DA-DS-05":{"id":"DA-DS-05","phase":1,"dimension":"responsiveness","screen":"all 35 mobile routes + _shell/launcher at a real 390px viewport","wrong":"Every mobile route horizontally overflows a real 390px viewport: #app scrollWidth measures 432px (10 routes), 434 (6), 438 (8), 441 (5), 461 (6) and the launcher 470 — 42-80px of dead scroll. Two distinct causes, both source-order/authoring bugs rather than missing breakpoints. (a) app.css:461 @container stage (max-width:1180px){ .stage-aside{display:none} } is defeated by app.css:539 .stage-aside{width:300px;padding-top:14px;display:flex;...} — the later display:flex wins, so the 300px desktop explainer panel survives at 390px, squeezed to ~55px with one word per line beside the phone frame. (b) app.css:119-123 .launcher::before is a 560px decorative radial at right:-80px with no overflow:hidden on .launcher, which is exactly the 390->470 and the 1180->1260 hard-clip the harness recorded on main.launcher. Note the sign-in wall at 390 measures exactly 390 — it is the only correctly responsive surface, which proves the shell, not the viewport, is the problem.","should":"Zero horizontal scroll at 390. The stage aside genuinely hidden below 1180px, the launcher's ambient wash clipped to its own box, and the phone frame allowed to shrink below 384px.","why":"Horizontal scroll on a phone is the most basic responsiveness failure there is; here it affects 100% of mobile routes and the first screen of the product. It also makes the phone-frame demo itself look broken, undermining the one artefact that is supposed to sell the mobile design.","impl_note":"Three edits. (1) Move the block at app.css:461 to after app.css:542 (.stage-aside p), so the @container display:none is declared last — or, better, change app.css:539 .stage-aside{display:flex} to .stage-aside{display:none} and add @container stage (min-width:1181px){ .stage-aside{display:flex} }. (2) app.css:118 .launcher{...;position:relative} add overflow:hidden (the ::before is pointer-events:none decoration, nothing is lost) — this also clears the 1260/1180 hard-clip on main.launcher at 1440. (3) app.css:464 .phone{width:min(384px,100%); flex:none} -> width:min(384px,100%); flex:0 1 auto; min-width:0, and app.css:457 .mobile-stage padding ... 20px -> clamp(8px,4vw,20px).","functional_flag":false,"scope":"design-system"},"DA-DS-06":{"id":"DA-DS-06","phase":1,"dimension":"color","screen":"all staff + manager screens; sysadmin/web/identity role chips","wrong":"Two token collisions make semantic state indistinguishable from persona identity. (1) --staff and --warn are the SAME hex #C28A4A, and --staff-bg and --warn-bg are the SAME hex #F4E8D6 (verified: delta-RGB 0.0). In the Staff persona every warning badge is the accent colour and every accent chip is the warning colour — and on sysadmin/web/identity the 'staff' role chip is pixel-identical to a warning chip. (2) --ok-text #3F6244 and --mgr-d #3F623F differ by delta-RGB 5.0 — visually the same green. On manager/web/approvals the green .btn.ok 'Approve' and the manager accent are one colour, so 'success' carries no information in the persona where approvals are the entire job.","should":"Persona accents and status colours must occupy separate regions of the wheel. Move --warn off the staff amber to a distinctly redder-yellow #B8791F (warn-bg #F6EAD4 stays close), and shift --ok toward a cooler green #4F8A70 / --ok-text #33614E so it separates from --mgr #6E9A6E by more than delta-RGB 40.","why":"The whole point of a persona-accent system is that the accent means 'where you are' and the status colours mean 'what happened'. When the two share a hex, a staff user cannot tell an overtime warning from a navigation chip, and a manager cannot tell an approved item from an accented one — the colour layer is carrying no signal at all.","impl_note":"tokens.css:26 --warn:#C28A4A -> #B8791F; --warn-bg:#F4E8D6 -> #F6EAD4; --warn-text:#8F6020 -> #7A4F13 (6.7:1 on the new bg). tokens.css:25 --ok:#5E8C63 -> #4F8A70; --ok-bg:#E2EEE3 -> #DEEDE6; --ok-text:#3F6244 -> #33614E (7.0:1 on white, dRGB 46 from --mgr-d). Leave all five persona accents untouched — they are the fixed identity layer per the tokens.css header ('do not drift'); it is the status ramp that must move.","functional_flag":false,"scope":"design-system"},"DA-DS-07":{"id":"DA-DS-07","phase":1,"dimension":"hierarchy","screen":"all web screens (165 of 238 have zero)","wrong":"165 of 238 web shots (69%) render no filled primary button above the fold; the mean is 0.38 per screen. The screen-head action slot is filled almost everywhere with two equal-weight variants instead: ceo/web/board = a non-interactive .ro-chip 'READ-ONLY' next to a ghost 'Export board pack'; staff/web/payslip = ghost 'PDF' + ghost 'Tax statement'; sysadmin/web/database = soft 'Backup center' + ghost 'Reseed all stores'. .btn.soft (app.css:421, --acc-bg fill) reads as a filled button at a glance, so where it is used the screen appears to have a primary but the actual accent fill is absent. hr/web/people is one of the few correct cases (soft 'Org chart' + filled 'New hire').","should":"Exactly one filled .btn per screen header, always the screen's single most likely next action; every other header action is .btn.ghost; .btn.soft is retired as a header variant and kept only for in-card secondary actions. Destructive header actions use .btn.danger.","why":"With no weight difference the eye has no entry point and every screen starts with a scan instead of an action. Across 116 routes that is the difference between a console you operate and a report you read.","impl_note":"Document and enforce in app.css:408 section header: '06 - one .btn (filled) per .screen-head .actions; all others .btn.ghost'. Concretely: ceo.js .screen-head actions 'Export board pack' class 'btn ghost' -> 'btn'; staff.js payslip 'PDF' 'btn ghost' -> 'btn' (Tax statement stays ghost); sysadmin.js database 'Backup center' 'btn soft' -> 'btn'. Then delete .btn.soft from app.css:421 and repoint its remaining in-card uses to .btn.ghost.","functional_flag":false,"scope":"design-system"},"DA-DS-08":{"id":"DA-DS-08","phase":1,"dimension":"density","screen":"all screens; worst hr/web/sched-control@1024 and sysadmin/web/database@1024","wrong":"624 elements have scrollWidth > clientWidth and 607 of them are hard-clipped — not scrollable, and with no text-overflow:ellipsis + title attribute to recover the hidden text. The system has exactly two truncation utilities (app.css:314-315 .rowitem .rt/.rs and app.css:489 .app-head .ah-t) and neither sets a title, so on staff/web/home 'Acknowledge Code of c…' and 'EX-0210 · Receipt · Jun 06 · L…' truncate at 1440 with an empty column to their right and no way to read them.","should":"One truncation contract: a .trunc utility (overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0) that is only ever applied to elements whose full text is also in a title attribute, plus min-width:0 on every flex/grid child that contains text so the ellipsis can actually engage instead of hard-clipping.","why":"Hard clipping destroys information silently — the user cannot tell that text was cut, and in an HR console the cut text is names, IDs and amounts.","impl_note":"Add to app.css after :318: '.trunc{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}'. Change app.css:314 and :315 to use it (.rowitem .rt,.rowitem .rs{ @extend-style: same three props }) and have js/ui.js emit title=\"${text}\" wherever it emits .rt/.rs/.ah-t. Add app.css:321 .tablewrap{overflow-x:auto} -> keep, and add table.tbl{min-width:100%} plus .tbl td{min-width:0} so cells ellipsise instead of clipping.","functional_flag":true,"scope":"design-system"},"DA-DS-09":{"id":"DA-DS-09","phase":1,"dimension":"responsiveness","screen":"all screens below ~1100px; _shell/launcher@390, staff/mobile/home@390, hr/web/people@1024","wrong":"The topbar is a single flex-wrap:wrap row with no priority order, so it silently reflows into 2 rows at 1024 (the 'Portal off' chip and the avatar drop below, leaving a ~400px gap to the right of the Web/Mobile segment) and into 3 rows at 390 (logo+persona dots / Web|Mobile + EN|ລາວ / Portal off + avatar), consuming 138px of a 844px phone viewport before any content. It carries seven independent control groups at once: logo, version chip, 5-item persona switch, device segment, language segment, portal chip, avatar. Only two of them are hidden by the two @container topbar rules (app.css:109-115: .ver below 1060, chip labels below 940).","should":"A declared collapse order for the topbar — version chip, then persona labels (already there), then the language segment into the avatar menu, then the device segment, then the portal chip — so the bar never exceeds one 58px row at any width, and the persona switch becomes a single current-persona chip that opens a menu below 940px.","why":"A chrome bar that grows to 3 rows on a phone is taking a third of the viewport from the content it exists to frame, and the mid-reflow 2-row state at 1024 makes the whole shell look like it broke rather than adapted.","impl_note":"Extend app.css:109-115: add @container topbar (max-width:860px){ .seg.lang{display:none} } and @container topbar (max-width:720px){ .topbar .seg:not(.lang){display:none} .seg-login{display:none} }, and @container topbar (max-width:640px){ .persona-switch .pchip:not([aria-pressed=\"true\"]){display:none} .persona-switch{padding:2px} }. Set app.css:61 flex-wrap:wrap -> flex-wrap:nowrap and app.css:60 min-height:58px -> height:58px so a miscount clips rather than reflows.","functional_flag":true,"scope":"design-system"},"DA-DS-10":{"id":"DA-DS-10","phase":1,"dimension":"typography","screen":"all screens (avg 41 sub-12px nodes per shot)","wrong":"11,267 text nodes across 273 shots render below 12px — an average of 41 per screen — with a floor of 8.5px. The sub-11px band alone (8.5, 9, 9.5, 9.8, 9.9, 10, 10.3, 10.5px) is 4,299 nodes / 15.8% of all text, and it carries real content: the mobile tab-bar labels (app.css:510, 9.8px), the heat-calendar cells (app.css:386, 9.5px), the calendar block titles (schedule.css:97, 10px), every table column header (app.css:324, 10.5px), the sign-in seed grid (app.css:704, 9.8px) and the rail footer note (app.css:218, 10.5px).","should":"An 11px floor for any rendered text, with 12px as the floor for anything a user must read rather than scan. Nothing in an enterprise console justifies 8.5px.","why":"Below 11px the fallback stack loses stem contrast entirely and the text stops being read — it becomes texture. Combined with DA-DS-01 (those same labels are --muted at 3.89:1) the small end of the type scale is both too small and too pale at once.","impl_note":"Apply the DA-DS-13 scale with a hard floor: every declaration currently below 11px goes to var(--fs-micro)=11px — app.css:386 font-size:9.5px, app.css:392 9px, app.css:510 9.8px, app.css:577 9.5px, app.css:700 9.8px, app.css:701 9.5px, app.css:704 9.8px, app.css:722 9.8px, schedule.css:33 10px, schedule.css:81 10px, schedule.css:97 10px, schedule.css:59 10.8px. Where 11px then overflows its box (heat-cal cells, calendar blocks) increase the cell, do not shrink the type.","functional_flag":false,"scope":"design-system"},"DA-DS-11":{"id":"DA-DS-11","phase":1,"dimension":"accessibility","screen":"all 35 mobile routes + launcher@390","wrong":"574 of 735 sampled touch targets (78%) are under 44x44 CSS px across 37 mobile shots — about 16 per screen. The worst are shell controls, not content: the 5 persona chips are 28x20px each with a 4px gap, the language segment buttons are 45x24 and 50x24, and the sign-in chip is 93x30. All of them sit in the topbar that DA-DS-09 already shows wrapping to 3 rows.","should":"A 44x44 minimum hit area for every interactive element in the shell, achieved with padding or a ::after hit-expander rather than by growing the visual chip.","why":"These are the controls that switch persona and language — the two highest-consequence, lowest-frequency actions in the product. Missing a 28x20 target switches the user into the wrong persona's app.","impl_note":"Add after app.css:92: '.pchip,.seg button,.seg-login,.avatar-btn{position:relative} .pchip::after,.seg button::after,.seg-login::after,.avatar-btn::after{content:\"\";position:absolute;inset:50% 0 0 0;transform:translateY(-50%);height:44px;min-width:44px;left:50%;translate:-50% 0}' — hit area only, no visual change. Do not fix by raising app.css:87 padding:5px 12px, that would push the topbar wider and worsen DA-DS-05.","functional_flag":false,"scope":"design-system"},"DA-DS-12":{"id":"DA-DS-12","phase":1,"dimension":"color","screen":"staff/web/payslip; all pay and finance screens","wrong":"--bad #B5675C is 4.15:1 on white and is applied directly as a text colour in 8 inline styles in js/screens (color:var(--bad)) — on staff/web/payslip it renders the deduction amounts '− ₭ 468,000' and '− ₭ 310,200' at 12.8px. The system already ships an AA-safe --bad-text #94503F (6.04:1) for exactly this, and the tokens.css:24 comment says the -text variants exist for small type on white, but the JS reaches for --bad instead.","should":"--bad reserved for fills, dots, borders and the notification ping; --bad-text used for every negative value, error label and destructive text. Same rule for --ok/--ok-text and --warn/--warn-text.","why":"Currency deductions are the single most consequence-bearing text on a payslip; rendering them below threshold in a warm red on white is the worst place in the product to lose a contrast point.","impl_note":"Replace all 8 inline color:var(--bad) in js/screens (staff.js payslip amount cells, hr.js, sysadmin.js) with color:var(--bad-text). Add a guard comment at tokens.css:24: '/* --ok/--warn/--bad = fills and dots only; use the -text variants for any text */'. app.css:423 .btn.danger{color:var(--bad)} -> color:var(--bad-text).","functional_flag":false,"scope":"design-system"},"DA-DS-13":{"id":"DA-DS-13","phase":2,"dimension":"typography","screen":"all screens","wrong":"41 distinct rendered font sizes from 32 CSS declarations, with no scale behind them — the mid-band alone runs 10.3, 10.5, 10.8, 11, 11.3, 11.5, 11.8, 12, 12.3, 12.5, 12.8, 13, 13.2, 13.5px, i.e. 14 sizes inside a 3.2px range, four of them (12, 12.8, 13.2, 10.5) each carrying 9-15% of all text. body{font-size:14px} (app.css:27) is nearly vestigial — only 92 nodes of 27,000 render at 14px.","should":"A 7-step scale plus one display clamp, each step mapped to a stated role: --fs-micro 11px (uppercase eyebrows, table th, badges, tab labels, counts) absorbs 8.5/9/9.5/9.8/9.9/10/10.3/10.5/10.8/11/11.3 = 32.2% of text; --fs-xs 12px (sublines, hints, meta, crumbs) absorbs 11.5/11.8/12/12.3 = 18.9%; --fs-sm 13px (default UI/body, table cells, buttons, nav) absorbs 12.5/12.8/13/13.2/13.5 = 36.8%; --fs-md 15px (prose: lede, screen-head sub, empty-state text) absorbs 14/14.2/15/15.5; --fs-lg 18px (card and section headings) absorbs 16.5/17/18.3/18.5/19/19.7/20; --fs-xl 24px (screen titles, mobile KPI values) absorbs 21.1/22/24; --fs-2xl 32px (KPI values, clock hero) absorbs 28/30/32/34/38. The launcher hero keeps one clamp, tightened to clamp(34px,5.2vw,56px).","why":"Seven steps are the most a reader can distinguish; 41 means half the differences are invisible and the other half are accidents. The half-pixel sizes (12.8 vs 13 vs 13.2) cost rendering consistency and buy nothing.","impl_note":"Add the 7 tokens to tokens.css after :46, then rewrite every font-size in app.css and schedule.css to var(--fs-*). Key mappings: app.css:27 body 14px -> var(--fs-sm); :47 .eyebrow 11px -> var(--fs-micro); :99 .seg button 12px -> var(--fs-xs); :199 .nav-item 13.2px -> var(--fs-sm); :229 .crumbs 11.5px -> var(--fs-xs); :236 .screen-head .sub 13px -> var(--fs-md); :274 .card-head .t 13px -> var(--fs-sm); :281 .k-label 10.8px -> var(--fs-micro); :282 .k-value 32px -> var(--fs-2xl); :291 .badge 10.8px -> var(--fs-micro); :322 table.tbl 12.8px -> var(--fs-sm); :324 .tbl th 10.5px -> var(--fs-micro); :412 .btn 12.8px -> var(--fs-sm); :426 .btn.xs 11.3px -> var(--fs-micro); :131 .lede 16.5px -> var(--fs-lg); :502 .screen-title 20px -> var(--fs-xl); :127 clamp(38px,5.2vw,62px) -> clamp(34px,5.2vw,56px).","functional_flag":false,"scope":"design-system"},"DA-DS-14":{"id":"DA-DS-14","phase":2,"dimension":"typography","screen":"all screens","wrong":"Eight font weights render across the app — 400, 500, 550, 600, 650, 700, 800, 900 — two of which (550, 650) are not real weights in the fallback stack and are synthesised or rounded, so they render identically to 500/700 on some platforms and differently on others. 550 appears 4 times in js/screens/staff.js (the payslip/advance hero numbers at 28/30/34/38px), 650 appears at app.css:640 and twice in JS (sysadmin.js:28, hr.js:45). 800 is used 9 times in CSS for elements as unrelated as .avatar initials, .app-head .ah-t, .ro-chip and .clock-hero .ch-btn.","should":"Three weights, one role each: 400 body and table cells; 600 all labels, headings, nav, buttons and KPI values; 700 the single emphasis level (.strong, .tbl .strong, active states). 500, 550, 650, 800 and 900 are removed.","why":"Manrope ships 200-800, but the app renders in the fallback stack offline and synthesises anything non-standard. Weight is the cheapest hierarchy signal there is and eight steps spend it on nothing — the same 'important' feeling is delivered by 600 and 700 in different places, which is why nothing reads as consistently important.","impl_note":"tokens.css: add --w-body:400; --w-med:600; --w-bold:700. Then: app.css:282 .kpi .k-value font-weight:500 -> var(--w-med); app.css:640 font-weight:650 -> var(--w-med); all nine font-weight:800 in app.css (lines 350,370,402,489,531,624,671,909 and :127) -> var(--w-bold); js/screens/staff.js:107,340,386,611 font-weight:550 -> font-weight:600; js/screens/sysadmin.js:28 and hr.js:45 font-weight:650 -> font-weight:600. Leave the 38 x 700 and 37 x 600 as var(--w-bold)/var(--w-med).","functional_flag":false,"scope":"design-system"},"DA-DS-15":{"id":"DA-DS-15","phase":2,"dimension":"components","screen":"all screens (max 11 distinct radii on a single shot)","wrong":"22 distinct border-radius values across 94 declarations against 4 radius tokens — and up to 11 different radii render on a single screen. The raw values are 2, 3, 4, 6, 7, 8, 9, 10, 11, 13, 14, 15, 16, 18, 44, 54, 99 and 999px. Two of them are duplicates of tokens (11px = --r-sm, 16px = --r), two are two spellings of the same pill (99px used 18 times, 999px used in schedule.css), and the card radius is inconsistent with itself: .card is var(--r)=16px (app.css:268) but .app-body .card is 15px (app.css:499), .qrow is 14px (app.css:337) and .clock-hero is 18px (app.css:522).","should":"Five radii and nothing else: --r-xs 8px (badges, idtags, chips, small buttons), --r-sm 12px (inputs, buttons, nav items, tiles), --r 16px (cards — every card, including inside the phone), --r-lg 22px (hub cards, phone screen), --r-pill 999px (all pills and dots). The device-chrome radii (44px phone screen, 54px phone body) stay literal because they are hardware, not UI.","why":"Radius is the fastest-read signal of 'these two things are the same kind of thing'. Eleven radii on one screen means the card, the tile, the row and the chip all claim to be different components when they are not.","impl_note":"tokens.css:37 --r:16px; --r-sm:11px; --r-lg:22px; --r-xl:30px -> --r-xs:8px; --r-sm:12px; --r:16px; --r-lg:22px; --r-pill:999px (drop --r-xl, it is unused at runtime). Then: app.css:499 15px -> var(--r); :337 14px -> var(--r); :522 18px -> var(--r); :530 13px -> var(--r-sm); :587 13px -> var(--r-sm); :412 10px -> var(--r-sm); :425 9px -> var(--r-sm); :426 8px -> var(--r-xs); :433 10px -> var(--r-sm); :442 10px -> var(--r-sm); :155 10px -> var(--r-sm); :199 11px -> var(--r-sm); :301 6px -> var(--r-xs); :386 6px -> var(--r-xs); :310/:317 10px -> var(--r-sm); :510 10px -> var(--r-sm); :71/:697 9px -> var(--r-xs); :144/:190 11px -> var(--r-sm); :353 16px -> var(--r); every 99px -> var(--r-pill); schedule.css every 99px and 999px -> var(--r-pill), 8px -> var(--r-xs), 7px -> var(--r-xs), 3px -> var(--r-xs).","functional_flag":false,"scope":"design-system"},"DA-DS-16":{"id":"DA-DS-16","phase":2,"dimension":"components","screen":"all screens (max 9 distinct shadows on a single shot)","wrong":"17 distinct box-shadow values across 39 declarations against 3 shadow tokens, up to 9 on one screen. Five of the one-offs are elevation shadows that duplicate a token's job at a different value — app.css:68 '0 8px 24px -18px rgba(40,38,33,.35)' (scrolled topbar), app.css:415 '0 6px 16px -8px var(--acc)' (button hover), app.css:532 '0 6px 18px -8px rgba(0,0,0,.4)' (clock-hero button), app.css:671 '0 6px 16px -8px var(--brand)', app.css:697 '0 5px 12px -6px var(--pc)'. Four more are focus/selection rings written as shadows: '0 0 0 3px var(--acc-bg)' (app.css:437), '0 0 0 4px var(--acc-bg)' (app.css:374), '0 0 0 3px var(--ok-bg)' (app.css:217). And one is a hack, not a shadow: app.css:470 'box-shadow:0 84px 0 #222226' draws the phone's second volume button.","should":"Three elevation tokens used everywhere — --sh-sm (resting surface: cards, chips, pressed segments), --sh (raised: topbar when scrolled, hovering rows, toasts), --sh-lg (floating: phone body, modals, popovers) — plus one new --ring token for the 3px halo, which is a state indicator and does not belong in the elevation scale.","why":"Elevation is a depth language; seventeen depths means there is no language, just accumulated one-offs. The ring/shadow conflation is worse — it means a focus state and a hover elevation are authored with the same property and drift apart independently.","impl_note":"tokens.css: add --ring:0 0 0 3px var(--acc-bg); --ring-ok:0 0 0 3px var(--ok-bg). Then app.css:68 box-shadow:0 8px 24px -18px rgba(40,38,33,.35) -> var(--sh); :415 box-shadow:0 6px 16px -8px var(--acc) -> var(--sh); :532 box-shadow:0 6px 18px -8px rgba(0,0,0,.4) -> var(--sh); :671 -> var(--sh); :697 -> var(--sh-sm); :437 box-shadow:0 0 0 3px var(--acc-bg) -> var(--ring); :374 box-shadow:0 0 0 4px var(--acc-bg) -> var(--ring); :217 box-shadow:0 0 0 3px var(--ok-bg) -> var(--ring-ok). Leave app.css:470 as-is with a comment '/* not a shadow: draws the second volume button */'.","functional_flag":false,"scope":"design-system"},"DA-DS-17":{"id":"DA-DS-17","phase":2,"dimension":"spacing","screen":"all screens","wrong":"397 of 574 px spacing declarations (69%) are off a 4px grid, across 53 distinct values in app.css alone. The most common values are the odd ones: 6px x53, 10px x49, 9px x34, 11px x29, 5px x27, 14px x27, 7px x25, 13px x23. There is no spacing scale in tokens.css at all — --maxw is the only dimensional token. The result is visible as broken vertical rhythm inside cards: .card padding 22px, .kpi padding 19px 22px, .app-body .card padding 16px, .qrow padding 13px 16px, .tbl td padding 10.5px 12px, .rowitem padding 11.5px 2px — six paddings, no relationship.","should":"An 8-token 4px scale with every current value rounded to its nearest step: --sp-1 4px (absorbs 3,4,5), --sp-2 8px (absorbs 6,7,8,9 — 164 declarations), --sp-3 12px (absorbs 10,11,12,13 — 131), --sp-4 16px (absorbs 14,15,16,18 — 65), --sp-5 24px (absorbs 20,22,26), --sp-6 32px (absorbs 30,32,36), --sp-7 48px (absorbs 44,46), --sp-8 64px (absorbs 60,64,88,90). 1px and 2px stay literal — they are hairlines and optical nudges, not spacing.","why":"A 4px grid is what makes unrelated components look like they were drawn by the same hand; 53 arbitrary values is why the card interiors, the rail and the table never quite line up with one another.","impl_note":"Add the 8 tokens to tokens.css after --maxw (:41). Then round every padding/margin/gap: app.css:269 22px -> var(--sp-5); :280 19px 22px -> var(--sp-5); :499 16px -> var(--sp-4); :336 13px 16px -> var(--sp-3) var(--sp-4); :327 10.5px 12px -> var(--sp-3); :306 11.5px 2px -> var(--sp-3) 0; :182 20px 14px 18px -> var(--sp-5) var(--sp-4); :412 .btn 8.5px 16px -> var(--sp-2) var(--sp-4); :199 .nav-item 8.5px 11px -> var(--sp-2) var(--sp-3); :434 .input 9px 12px -> var(--sp-2) var(--sp-3); :273 margin-bottom:16px -> var(--sp-4); :234 margin-bottom:30px -> var(--sp-6). Keep the clamp() paddings on .workspace (:220) and .launcher (:118) but round their ends to scale steps: clamp(24px,3.2vw,36px) -> clamp(var(--sp-5),3.2vw,var(--sp-6)).","functional_flag":false,"scope":"design-system"},"DA-DS-18":{"id":"DA-DS-18","phase":2,"dimension":"color","screen":"all screens; _shell phone frame; sysadmin sync status","wrong":"21 non-token colour declarations escape the palette — 16 in CSS and 5 in JS. The CSS set is the phone chrome (#101012 x2, #222226 x2, #2a2a2e, #1b1b1f), two toast icon tints (#9FCBA4, #E9C588), a dot fallback (#999), three raw alpha values (rgba(40,38,33,.35), rgba(255,255,255,.95), rgba(0,0,0,.4)) and roughly twelve bare color:#fff. The JS set is js/d1-sync.js:155-167: a hard-coded cssText using #fff and #444 plus a status map of #999 / #b8860b / #2e7d32 / #c62828 — none of which exist in the palette, and the greens and reds are Material defaults sitting next to the app's own --ok/--bad.","should":"Every colour resolvable to a token. Add four device-chrome tokens and two inverse status tints, replace bare #fff on accent fills with an --on-acc token, and repoint the JS sync badge onto --ok-text/--warn-text/--bad-text.","why":"Runtime colour hygiene is otherwise the healthiest part of the system (max 5 non-token colours on any screen, all alpha-blends). These 21 are the entire remaining gap, and the JS ones are the dangerous kind: a Material green badge rendering beside an Atelier-Pastel green badge on sysadmin/web/sync.","impl_note":"tokens.css: add --device:#101012; --device-hw:#222226; --device-edge:#2a2a2e; --device-bar:#1B1B1F; --on-acc:#FFFFFF; --ok-inv:#9FCBA4; --warn-inv:#E9C588. Then app.css:464,482 #101012 -> var(--device); :469,470 #222226 -> var(--device-hw); :465 #2a2a2e -> var(--device-edge); :518 #1b1b1f -> var(--device-bar); :591 #9FCBA4 -> var(--ok-inv); :592 #E9C588 -> var(--warn-inv); :90 var(--pc,#999) -> var(--pc,var(--muted)); every color:#fff on an accent fill (:73,211,372,389,411,522,586,671,697,755) -> var(--on-acc); :450 background:#fff -> var(--surface); :68 rgba(40,38,33,.35) -> var(--sh) (see DA-DS-16); :530 rgba(255,255,255,.95) -> color-mix(in srgb,var(--surface) 95%,transparent); :532 -> var(--sh). js/d1-sync.js:162-167 #999 -> var(--muted), #b8860b -> var(--warn-text), #2e7d32 -> var(--ok-text), #c62828 -> var(--bad-text); :155 background:#fff -> var(--surface), color:#444 -> var(--ink-2), and replace the literal font:600 11px/1 system-ui with var(--w-med) var(--fs-micro)/1 var(--font).","functional_flag":false,"scope":"design-system"},"DA-DS-19":{"id":"DA-DS-19","phase":2,"dimension":"components","screen":"all screens (locked/soon states on launcher, hub cards, buttons)","wrong":"12 !important declarations. One is legitimate (app.css:54, prefers-reduced-motion). The other eleven are all in the .locked / .soon disabled-state blocks at app.css:549-574 and every one of them is unnecessary: the selectors that carry them — button.locked (0,1,1), .choice.locked (0,2,0), button.soon (0,1,1), .hub-card.locked .enter button (0,3,1) — already outrank the base .btn (0,1,0) and .choice (0,1,0) rules they are fighting. The !important is compensating for a specificity problem that does not exist.","should":"Zero !important outside the reduced-motion block, and one disabled convention — a single [aria-disabled=\"true\"] / .is-disabled state class carrying the muted surface, the grayscale filter and cursor:not-allowed, instead of the two parallel .locked and .soon vocabularies that currently differ only in filter value (grayscale(.5) vs grayscale(.45)).","why":"!important in a design system is a one-way door: the moment a token or a variant needs to override a disabled state, it cannot, and the next author reaches for a second !important. Eleven of them in one 25-line block is the start of that spiral.","impl_note":"Delete the !important keyword from all nine declarations at app.css:549, 552 (x3), 553, 555, 567, 568 (x1 of the pair), 569, 574 — no other change needed, the cascade already resolves correctly. Then merge .locked and .soon into one .is-disabled block: keep filter:grayscale(.5), drop the .45 variant, and have the launcher emit class=\"is-disabled\" with data-reason=\"locked|soon\" for the badge text. Keep app.css:54.","functional_flag":false,"scope":"design-system"},"DA-DS-20":{"id":"DA-DS-20","phase":2,"dimension":"components","screen":"all screens","wrong":"74 selectors sit at specificity (0,3,0) or higher, with a max nesting depth of 3 — e.g. '.nav-item:not([aria-current=\"true\"]) .count' (0,3,0), '.hub-card .enter button.ghosted' (0,3,1), '.seg.lang button[aria-pressed=\"true\"]' (0,3,1), '.qv-cell.ok .qv-n' (0,3,0), '.shift-cap.warn .sc-track span' (0,3,1). Each of these encodes a state on a parent and reaches down to a descendant, which is the pattern that makes a component impossible to reuse outside its parent and impossible to override with a modifier class.","should":"A ceiling of (0,2,0): state as a class on the element that changes, not on its ancestor. '.nav-item:not([aria-current]) .count' becomes '.count.is-quiet'; '.qv-cell.ok .qv-n' becomes '.qv-n.is-ok'; '.shift-cap.warn .sc-track span' becomes '.sc-fill.is-warn'.","why":"Descendant-state selectors are why the same component looks different in two places and why authors reach for inline styles (DA-DS-21) instead of a modifier — the modifier loses the cascade fight, so they give up on classes entirely.","impl_note":"Rewrite the 8 worst as element-state classes and have the emitting JS set them: app.css:213 '.nav-item:not([aria-current=\"true\"]) .count{background:var(--line);color:var(--ink-2)}' -> '.count.is-quiet{...}' with js/ui.js adding is-quiet when aria-current is absent; app.css:285-286 '.kpi .k-sub .up/.down' -> '.k-delta.is-up/.is-down'; schedule.css:25 '.qv-cell .qv-l' and the three '.qv-cell.<state> .qv-n' rules -> '.qv-n.is-ok/.is-warn/.is-acc'; schedule.css:44 '.cal-day.muted .cd-num' / '.cal-day.today .cd-num' -> '.cd-num.is-muted/.is-today'.","functional_flag":false,"scope":"design-system"},"DA-DS-21":{"id":"DA-DS-21","phase":2,"dimension":"components","screen":"all screens (422 inline style attributes in js/screens)","wrong":"422 inline style=\"\" attributes live in js/screens (hr.js 92, sysadmin.js 72, authviews.js 68, staff.js 66, schedule.js 32, ceo.js 26, manager.js 25, reports.js 15, dbviews.js 13, approvalsview.js 3), carrying ~700 declarations. They are not bespoke design decisions — 85% are the same ten layout primitives repeated: display:flex x131, flex-direction:column x64, gap:* x134 (16px x55, 8px x39, 9/10/12px x27), margin-top:* x130 (8px x40, 10px x37, 16px x19, 12px x13, 6px x11), align-items:center x38, justify-content:flex-end x16 / space-between x13, flex-wrap:wrap x26, width:100% x13, margin-left:auto x6. Only ~60 declarations are genuinely one-off (a chart height, a grid-template).","should":"Ten utility classes in app.css that absorb the 85%, leaving fewer than 70 inline styles for genuine one-offs: .row (flex, align-items:center, gap var(--sp-2)), .col (flex, column, gap var(--sp-3)), .wrap (flex-wrap:wrap), .end (justify-content:flex-end), .between (justify-content:space-between), .fill (width:100%), .push (margin-left:auto), and .gap-1..4 / .mt-1..4 / .mb-1..3 bound to the DA-DS-17 spacing tokens.","why":"Inline styles are invisible to the design system: they cannot be re-themed, cannot respond to a container query, cannot be audited, and they are precisely where the off-grid 8/9/10/12px gaps and the 550/650 weights entered the app. Moving them into classes is what makes the token work in DA-DS-13/14/17 actually take effect.","impl_note":"Add to app.css at the end of section 05 (after :398): '.row{display:flex;align-items:center;gap:var(--sp-2);min-width:0}.col{display:flex;flex-direction:column;gap:var(--sp-3);min-width:0}.row.wrap,.col.wrap{flex-wrap:wrap}.row.end{justify-content:flex-end}.row.between{justify-content:space-between}.row.top{align-items:flex-start}.fill{width:100%}.push{margin-left:auto}.gap-1{gap:var(--sp-1)}.gap-2{gap:var(--sp-2)}.gap-3{gap:var(--sp-3)}.gap-4{gap:var(--sp-4)}.mt-1{margin-top:var(--sp-1)}.mt-2{margin-top:var(--sp-2)}.mt-3{margin-top:var(--sp-3)}.mt-4{margin-top:var(--sp-4)}.mb-2{margin-bottom:var(--sp-2)}.mb-3{margin-bottom:var(--sp-3)}.mb-4{margin-bottom:var(--sp-4)}'. Then sweep js/screens in this order (highest yield first): style=\"display:flex;align-items:cente
