<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Adeptio · Journeys to fix v2.4.5.1</title>
<meta name="color-scheme" content="light">
<style>
/* ---------- tokens (Adeptio product palette, forced light) ---------- */
:root, :root[data-theme="light"]{
  --brand:#5C6493; --brand-deep:#404668; --brand-bg:#E8E9F1;
  --ink:#222127; --ink-2:#4A4954; --muted:#6B675E; --muted-2:#716D64;
  --line:#E7E3DA; --line-2:#F0EDE6; --line-3:#C9C4B9;
  --canvas:#F2F1EC; --surface:#FFFFFF; --surface-2:#FBFAF7;
  --staff:#C28A4A; --staff-d:#7E5722; --staff-bg:#F4E8D6;
  --mgr:#6E9A6E;   --mgr-d:#3F623F;   --mgr-bg:#DEEBDD;
  --hr:#6E8FC0;    --hr-d:#3C567F;    --hr-bg:#E0E8F5;
  --ceo:#9279B8;   --ceo-d:#5A4282;   --ceo-bg:#EAE2F3;
  --sys:#5E91A0;   --sys-d:#345661;   --sys-bg:#DDEAEE;
  --ok:#4F8A70;    --ok-bg:#DEEDE6;   --ok-text:#33614E;
  --warn:#B8791F;  --warn-bg:#F6EAD4; --warn-text:#7A4F13;
  --bad:#B5675C;   --bad-bg:#F3E1DE;  --bad-text:#94503F;
  --radius:12px; --radius-lg:16px;
  --shadow-sm:0 1px 2px rgba(34,33,39,.07);
  --shadow-md:0 4px 14px rgba(34,33,39,.08);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --topbar-h:56px;
  color-scheme: light;
}
/* force light even if the OS asks for dark */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="dark"]){
    --brand:#5C6493; --brand-deep:#404668; --brand-bg:#E8E9F1;
    --ink:#222127; --ink-2:#4A4954; --muted:#6B675E; --muted-2:#716D64;
    --line:#E7E3DA; --line-2:#F0EDE6; --line-3:#C9C4B9;
    --canvas:#F2F1EC; --surface:#FFFFFF; --surface-2:#FBFAF7;
    color-scheme: light;
  }
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
html{color-scheme:light;}
body{
  background:var(--canvas); color:var(--ink); font-family:var(--font);
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
h1,h2,h3,h4{font-weight:650; letter-spacing:-.01em; margin:0 0 8px;}
p{margin:0 0 10px;}
a{color:var(--brand-deep);}
code{
  font-family:var(--mono); font-size:.92em; background:var(--surface-2);
  border:1px solid var(--line); border-radius:4px; padding:.05em .35em;
  color:var(--ink-2); overflow-wrap:break-word;
}
code.atomic{white-space:nowrap;}
button{font:inherit; color:inherit;}
:focus-visible{outline:2px solid var(--brand); outline-offset:2px; border-radius:4px;}
.prose{max-width:78ch;}
.sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;}
.mono{font-family:var(--mono);}

/* ---------- top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:40; height:var(--topbar-h);
  display:flex; align-items:center; gap:18px;
  background:var(--surface); border-bottom:1px solid var(--line);
  padding:0 16px;
}
.tb-title{font-weight:700; font-size:14.5px; white-space:nowrap;}
.tb-version{color:var(--muted); font-size:12.5px; font-family:var(--mono); white-space:nowrap;}
.tb-title-wrap{display:flex; align-items:baseline; gap:8px; flex:0 0 auto;}
.tb-search{flex:1 1 auto; min-width:0; max-width:420px;}
.tb-search input{
  width:100%; padding:7px 11px; border:1px solid var(--line); border-radius:9px;
  background:var(--surface-2); font-size:13.5px; color:var(--ink);
}
.tb-search input::placeholder{color:var(--muted-2);}
.tb-right{margin-left:auto; display:flex; align-items:center; gap:14px; color:var(--muted); font-size:12.5px; white-space:nowrap; flex:0 1 auto; min-width:0; overflow:hidden;}
.tb-right .dot{opacity:.5;}
#tb-counts{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

/* ---------- shell / rail ---------- */
.shell{display:flex; align-items:flex-start;}
.rail{
  width:252px; flex:0 0 252px; position:sticky; top:var(--topbar-h);
  height:calc(100vh - var(--topbar-h)); overflow-y:auto;
  border-right:1px solid var(--line); background:var(--surface-2);
  padding:14px 10px 30px;
}
.rail-label{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted-2); margin:14px 8px 6px; font-weight:650;}
.rail-label:first-child{margin-top:2px;}
.rail-link{
  display:flex; align-items:center; gap:8px; width:100%; text-align:left;
  padding:7px 8px; border-radius:8px; border:none; background:none; cursor:pointer;
  font-size:13.5px; color:var(--ink-2); text-decoration:none;
}
.rail-link:hover{background:var(--line-2);}
.rail-link.active{background:var(--brand-bg); color:var(--brand-deep); font-weight:600;}
.rail-rank{font-family:var(--mono); font-size:11px; color:var(--muted-2); display:inline-block; width:22px; margin-right:4px; text-align:right;}
.rail-link.active .rail-rank{color:var(--brand-deep);}
.rail-jtitle{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.rail-select-wrap{display:none; padding:10px 16px; background:var(--surface-2); border-bottom:1px solid var(--line);}
.rail-select-wrap select{
  width:100%; padding:9px 10px; border-radius:9px; border:1px solid var(--line);
  background:var(--surface); font-size:13.5px; color:var(--ink);
}

main{flex:1 1 auto; min-width:0; padding:28px 32px 80px;}
.view{max-width:1180px;}
.view-head{margin-bottom:20px;}
.lede{color:var(--ink-2); max-width:78ch;}

/* ---------- chips ---------- */
.chip{
  display:inline-flex; align-items:center; gap:5px; padding:3px 9px;
  border-radius:999px; font-size:12px; font-weight:600; line-height:1.5;
  background:var(--line-2); color:var(--ink-2); white-space:nowrap;
}
.chip.area{background:var(--line-2); color:var(--muted); font-weight:500; text-transform:capitalize;}
.chip.persona[data-p="staff"]{background:var(--staff-bg); color:var(--staff-d);}
.chip.persona[data-p="manager"]{background:var(--mgr-bg); color:var(--mgr-d);}
.chip.persona[data-p="hr"]{background:var(--hr-bg); color:var(--hr-d);}
.chip.persona[data-p="ceo"]{background:var(--ceo-bg); color:var(--ceo-d);}
.chip.persona[data-p="sysadmin"]{background:var(--sys-bg); color:var(--sys-d);}
.chip.status.st-live{background:var(--ok-bg); color:var(--ok-text);}
.chip.status.st-partial{background:var(--warn-bg); color:var(--warn-text);}
.chip.status.st-stub{background:var(--bad-bg); color:var(--bad-text);}
.chip.sev.sev-low{background:var(--ok-bg); color:var(--ok-text);}
.chip.sev.sev-med{background:var(--warn-bg); color:var(--warn-text);}
.chip.sev.sev-high{background:var(--bad-bg); color:var(--bad-text);}
.chip.effort{background:var(--surface); border:1px solid var(--line-3); color:var(--ink-2); font-family:var(--mono); padding:2px 8px;}
.chip.finding{
  font-family:var(--mono); font-size:11px; background:var(--surface); border:1px solid var(--line-3);
  color:var(--brand-deep); cursor:pointer; padding:2px 7px;
}
.chip.finding:hover{background:var(--brand-bg);}
.chip.cross{background:var(--brand-bg); color:var(--brand-deep);}

/* ---------- overview table ---------- */
.j-table{width:100%; border-collapse:collapse; margin-top:6px;}
.j-table thead th{
  text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em;
  color:var(--muted-2); font-weight:650; padding:8px 12px; border-bottom:1px solid var(--line-3);
}
.j-table tbody tr{border-bottom:1px solid var(--line-2); cursor:pointer;}
.j-table tbody tr:hover{background:var(--surface);}
.j-table td{padding:14px 10px; vertical-align:top; font-size:13.5px;}
@media (max-width:1120px){
  main{padding:24px 18px 60px;}
  .j-table td{padding:11px 7px; font-size:13px;}
  .rail{width:220px; flex-basis:220px;}
  .score-wrap{min-width:88px;}
}
.j-table td.rank{font-family:var(--mono); color:var(--muted); width:28px;}
.j-table td.title{font-weight:600; color:var(--ink); max-width:220px; min-width:0; overflow-wrap:break-word;}
.j-table td.title a{color:inherit; text-decoration:none;}
.j-table td.title a:hover{text-decoration:underline;}
.j-table .areas-cell{display:flex; flex-wrap:wrap; gap:4px; max-width:160px;}
.j-table .status-cell{display:flex; gap:4px; flex-wrap:wrap; max-width:150px;}
.score-wrap{display:flex; align-items:center; gap:8px; min-width:140px;}
.score-bar{flex:1; height:6px; border-radius:4px; background:var(--line-2); overflow:hidden; min-width:36px;}
.score-fill{height:100%; background:var(--brand); border-radius:4px;}
.score-num{font-family:var(--mono); font-size:12px; color:var(--muted); width:22px; text-align:right; flex:0 0 auto;}
.count-num{font-family:var(--mono); font-size:13px; color:var(--ink-2);}

/* ---------- journey header ---------- */
.j-head{border-bottom:1px solid var(--line-3); padding-bottom:18px; margin-bottom:26px;}
.j-crumb{font-size:12.5px; color:var(--muted); margin-bottom:8px;}
.j-crumb a{color:var(--muted);}
.j-head h2{font-size:23px; margin-bottom:6px;}
.j-goal{color:var(--ink-2); max-width:78ch;}
.j-meta{display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin-top:12px;}
.j-meta .score-wrap{margin-left:auto;}

/* ---------- step strip ---------- */
.section-block{margin:36px 0;}
.section-block h3{font-size:15.5px; margin-bottom:12px;}
.steps-row{display:flex; flex-wrap:wrap; align-items:stretch; gap:0; margin-top:6px;}
.step-card{
  flex:1 1 202px; max-width:224px; min-width:180px;
  background:var(--surface); border:1px solid var(--line); border-top:4px solid var(--ink-2);
  border-radius:var(--radius); padding:12px; display:flex; flex-direction:column; gap:7px;
}
.step-card[data-persona="staff"]{border-top-color:var(--staff);}
.step-card[data-persona="manager"]{border-top-color:var(--mgr);}
.step-card[data-persona="hr"]{border-top-color:var(--hr);}
.step-card[data-persona="ceo"]{border-top-color:var(--ceo);}
.step-card[data-persona="sysadmin"]{border-top-color:var(--sys);}
.step-top{display:flex; align-items:center; justify-content:space-between; gap:6px;}
.step-num{
  font-family:var(--mono); font-size:11.5px; font-weight:700; color:var(--surface);
  background:var(--ink-2); border-radius:50%; width:20px; height:20px;
  display:flex; align-items:center; justify-content:center; flex:0 0 20px;
}
.step-card[data-persona="staff"] .step-num{background:var(--staff-d);}
.step-card[data-persona="manager"] .step-num{background:var(--mgr-d);}
.step-card[data-persona="hr"] .step-num{background:var(--hr-d);}
.step-card[data-persona="ceo"] .step-num{background:var(--ceo-d);}
.step-card[data-persona="sysadmin"] .step-num{background:var(--sys-d);}
.step-screen{font-family:var(--mono); font-size:11px; color:var(--muted); overflow-wrap:break-word;}
.step-does{font-size:13px; color:var(--ink-2); min-height:3.9em; overflow-wrap:break-word;}
.step-chips{margin-top:auto;}
.step-thumb{
  position:relative; width:100%; aspect-ratio:16/10; border-radius:8px; overflow:hidden;
  background:var(--surface-2); border:1px solid var(--line-2);
}
.step-thumb img{width:100%; height:100%; object-fit:cover; object-position:top; display:block;}
.step-thumb.broken img{display:none;}
.step-thumb .fallback{
  display:none; position:absolute; inset:0; align-items:center; justify-content:center;
  font-size:11px; color:var(--muted-2); text-align:center; padding:6px;
}
.step-thumb.broken .fallback{display:flex;}
.step-chips{display:flex; flex-wrap:wrap; gap:4px;}
.step-arrow{
  flex:0 0 22px; display:flex; align-items:center; justify-content:center;
  color:var(--line-3); font-size:17px; align-self:center;
}
@media (max-width:900px){ .step-arrow{display:none;} }

/* ---------- breaks grid ---------- */
.breaks-grid{display:grid; grid-template-columns:1fr 1fr; gap:28px;}
@media (max-width:820px){ .breaks-grid{grid-template-columns:1fr;} }
.breaks-col{min-width:0;}
.breaks-col h4.group-h{
  font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted-2);
  margin:16px 0 6px; font-weight:650;
}
.breaks-col h4.group-h:first-child{margin-top:0;}
.breaks-col ul{list-style:none; margin:0; padding:0;}
.breaks-col li.row{
  padding:8px 0; border-top:1px solid var(--line-2); font-size:13px; color:var(--ink-2);
  display:flex; gap:8px; align-items:baseline; flex-wrap:wrap;
}
.breaks-col li.row .row-id{font-family:var(--mono); font-size:11.5px; color:var(--brand-deep); flex:0 0 auto;}
.breaks-col li.row .row-text{flex:1 1 220px; min-width:0; overflow-wrap:break-word;}
.breaks-col li.row .row-evidence{font-family:var(--mono); font-size:11px; color:var(--muted); flex-basis:100%; min-width:0; overflow-wrap:break-word;}
.breaks-col li.row.hidden-extra{display:none;}
.show-all-btn{
  margin-top:10px; font-size:12.5px; color:var(--brand-deep); background:none; border:1px dashed var(--line-3);
  padding:5px 10px; border-radius:8px; cursor:pointer;
}
.show-all-btn:hover{background:var(--brand-bg);}
.show-all-btn[hidden]{display:none;}
.empty-note{color:var(--muted-2); font-size:12.5px; font-style:italic;}

/* ---------- tobe / proposals ---------- */
.tobe{
  border-left:3px solid var(--brand); background:var(--brand-bg); border-radius:0 10px 10px 0;
  padding:14px 18px; margin:8px 0 22px; max-width:78ch; color:var(--ink);
}
.prop-row{
  display:flex; gap:12px; align-items:flex-start; padding:12px 0; border-top:1px solid var(--line-2);
}
.prop-row:first-of-type{border-top:none;}
.prop-id{font-family:var(--mono); font-size:11.5px; color:var(--muted); flex:0 0 58px; padding-top:2px;}
.prop-body{flex:1; min-width:0;}
.prop-title-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:3px;}
.prop-title{font-weight:650; font-size:13.5px; overflow-wrap:break-word;}
.clamp-btn{
  display:block; width:100%; text-align:left; background:none; border:none; padding:0; cursor:pointer;
  font-size:12.8px; color:var(--ink-2); line-height:1.5; min-width:0; overflow-wrap:break-word;
}
.clamp-btn .clamp-text{display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
.clamp-btn.expanded .clamp-text{-webkit-line-clamp:unset;}
.clamp-btn .more-hint{color:var(--brand-deep); font-size:11.5px; font-weight:600;}

/* ---------- flows ---------- */
.flow-row{border-top:1px solid var(--line-2); padding:10px 0;}
.flow-row:first-of-type{border-top:none;}
.flow-top{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.flow-id{font-family:var(--mono); font-size:11.5px; color:var(--muted); flex:0 0 auto;}
.flow-name{font-weight:600; font-size:13px; flex:1 1 240px; min-width:0; overflow-wrap:break-word;}
.flow-toggle{
  margin-top:8px; cursor:pointer; font-size:12px; color:var(--brand-deep); font-weight:600;
  background:none; border:none; padding:0; display:flex; align-items:center; gap:4px;
}
.flow-toggle .caret{display:inline-block; transition:transform .15s ease;}
.flow-toggle[aria-expanded="true"] .caret{transform:rotate(90deg);}
.flow-steps-wrap{margin-top:8px; max-width:100%; overflow-x:auto;}
.flow-steps-wrap[hidden]{display:none;}
.flow-mini{width:100%; min-width:560px; border-collapse:collapse; font-size:12px;}
.flow-mini th{text-align:left; color:var(--muted-2); font-weight:650; padding:5px 8px; border-bottom:1px solid var(--line-3); font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; white-space:nowrap;}
.flow-mini td{padding:7px 8px; border-bottom:1px solid var(--line-2); vertical-align:top; color:var(--ink-2); overflow-wrap:break-word;}
.flow-mini td.wnum{font-family:var(--mono); color:var(--muted);}
.flow-mini ul{margin:0; padding-left:16px;}

/* ---------- matrix ---------- */
.matrix-table{width:100%; border-collapse:collapse;}
.matrix-table th, .matrix-table td{padding:9px 10px; border-bottom:1px solid var(--line-2); font-size:13px;}
.matrix-table thead th{text-align:center; font-size:11.5px; color:var(--muted-2); text-transform:uppercase; letter-spacing:.03em;}
.matrix-table thead th:first-child{text-align:left;}
.matrix-table td.mj-title{font-weight:600; max-width:260px; min-width:0; overflow-wrap:break-word;}
.matrix-table td.mj-title a{color:var(--ink); text-decoration:none;}
.matrix-table td.mj-title a:hover{text-decoration:underline;}
.matrix-table td.mdot{text-align:center;}
.pdot{display:inline-block; width:11px; height:11px; border-radius:50%; background:var(--line-3);}
.pdot.on[data-p="staff"]{background:var(--staff);}
.pdot.on[data-p="manager"]{background:var(--mgr);}
.pdot.on[data-p="hr"]{background:var(--hr);}
.pdot.on[data-p="ceo"]{background:var(--ceo);}
.pdot.on[data-p="sysadmin"]{background:var(--sys);}
.pdot.off{background:var(--line-2);}

/* ---------- themes ---------- */
.theme-card{
  border:1px solid var(--line); background:var(--surface); border-radius:var(--radius);
  padding:16px 18px; margin-bottom:14px;
}
.theme-card h4{font-size:14px; margin-bottom:6px; display:flex; align-items:center; gap:8px;}
.theme-id{font-family:var(--mono); font-size:11px; color:var(--muted); font-weight:600;}
.theme-note{color:var(--ink-2); font-size:13px; max-width:78ch;}
.theme-jlist{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;}
.theme-jlist a.chip{text-decoration:none; cursor:pointer;}

/* ---------- responsive tables (collapse ≤640) ---------- */
@media (max-width:640px){
  .j-table thead{display:none;}
  .j-table, .j-table tbody, .j-table tr, .j-table td{display:block; width:100%;}
  .j-table tr{border:1px solid var(--line-2); border-radius:10px; margin-bottom:10px; padding:8px 10px; background:var(--surface);}
  .j-table td{padding:4px 0; border:none; display:flex; gap:8px; align-items:center;}
  .j-table td::before{content:attr(data-label); font-size:10.5px; color:var(--muted-2); text-transform:uppercase; letter-spacing:.03em; width:74px; flex:0 0 74px;}
  .j-table td.title{font-size:14px;}
  .matrix-table thead{display:none;}
  .matrix-table, .matrix-table tbody, .matrix-table tr, .matrix-table td{display:block; width:100%;}
  .matrix-table tr{border:1px solid var(--line-2); border-radius:10px; margin-bottom:8px; padding:8px 10px; background:var(--surface);}
  .matrix-table td{border:none; padding:3px 0; display:flex; align-items:center; gap:8px;}
  .matrix-table td.mdot::before{content:attr(data-label); font-size:11px; color:var(--muted-2); width:80px; flex:0 0 80px;}
  .matrix-table td.mdot{justify-content:flex-start;}
}

/* ---------- popover ---------- */
.pop-backdrop{position:fixed; inset:0; background:rgba(34,33,39,.32); z-index:90;}
.pop-backdrop[hidden]{display:none;}
.popover{
  position:fixed; z-index:91; top:50%; left:50%; transform:translate(-50%,-50%);
  width:min(520px, calc(100vw - 32px)); max-height:min(560px, calc(100vh - 64px)); overflow:auto;
  background:var(--surface); border-radius:var(--radius-lg); box-shadow:var(--shadow-md);
  border:1px solid var(--line); padding:20px 22px;
}
.popover[hidden]{display:none;}
.popover-close{
  position:absolute; top:10px; right:10px; width:28px; height:28px; border-radius:50%;
  border:none; background:var(--surface-2); cursor:pointer; font-size:16px; color:var(--muted);
  display:flex; align-items:center; justify-content:center;
}
.popover-close:hover{background:var(--line-2);}
.popover h4{font-size:14px; margin-bottom:2px; padding-right:30px;}
.popover .pop-screen{font-family:var(--mono); font-size:11.5px; color:var(--muted); margin-bottom:14px;}
.popover dt{font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted-2); font-weight:650; margin:12px 0 3px;}
.popover dt:first-of-type{margin-top:0;}
.popover dd{margin:0; font-size:13px; color:var(--ink-2);}

/* ---------- phone gutters ---------- */
@media (max-width:768px){
  .rail{display:none;}
  .rail-select-wrap{display:block;}
  main{padding:20px 16px 60px;}
  .topbar{padding:0 12px; gap:10px;}
  .tb-right{gap:8px; font-size:11.5px;}
  .tb-search{max-width:none;}
  .j-meta .score-wrap{margin-left:0;}
}
@media (max-width:640px){
  #tb-date{display:none;}
  .tb-right .dot{display:none;}
}

nfirm('overwrites cloud copy on ALL devices within 30s') → DB.reset → seeds; db-factory also DB.backups.clear","writes":["<store> (reseeded)","db_audit.events(store.reseeded | tenant.reseeded | backup.history_cleared)"],"notifies":["sysadmin: toast"]},{"n":3,"persona":"hr","menu":"Data manager (hr/web/data/<id>)","action":"same tableEditor for db_people, db_leave, db_workflow, db_payroll, db_comms (add+delete every table incl. payslips, tax_config); backup-store / store-restore / db-reset per store","writes":["those stores + db_audit"],"notifies":["hr: toast"]},{"n":4,"persona":"manager","menu":"Team data","action":"db_people.employees filtered team==='Line A' — add AND delete employees; db_workflow.requests read-only (canAdd:false, canDel:false); export:teamslice CSV; mgr-assign","writes":["db_people.employees (add/delete)","db_audit"],"notifies":["manager: toast"]},{"n":5,"persona":"staff","menu":"My data","action":"db_workflow.requests filtered who===me.name — delete allowed for ANY status (label says withdraw-while-pending); db_docs own rows add+delete (vault-gated); db_time own punches read-only; export:mydata JSON takeout","writes":["db_workflow.requests (delete)","db_docs.documents (add/delete)","db_audit"],"notifies":["staff: toast"]},{"n":6,"persona":"ceo","menu":"Data room","action":"DBV.tableEditor('dw_reports','org_snapshots') → derived ⇒ no add/delete; reads db_platform.drills, DB.backups.all().length, DB.rows(db_audit)","writes":[],"notifies":[]}]},"F-PLT-05":{"id":"F-PLT-05","name":"Backups & restore: selectable snapshot · full-split dated sets · scheduled tick · restore · export · file import · drill","status":"partial","kind":"ops","area":"platform","outcome":"Snapshots live only in the browser (localStorage key outside the store catalog) — not synced, not backed to R2; the Worker's /api/backup and /api/restore/:id endpoints are never called by the client. Restoring a store re-persists it, which replicates the rewound copy to D1 within 30s (the confirm() warns about this).","steps":[{"n":1,"persona":"sysadmin","menu":"Backups","action":"bk:force → BACKUP.forceNow → DB.backups.now(all provisioned ids, 'manual-force', 'Force · YYYY-MM-DD hh:mm') deep-copies every store (incl. db_identity hashes/directory) into localStorage 'adeptio.v245.backups'; retention 10 scheduled + 14 other","writes":["localStorage backups (not a DB store)","db_audit.events(backup.exported)"],"notifies":["sysadmin: Backups nav badge = DB.backups.all().length; dated folder list"]},{"n":2,"persona":"sysadmin","menu":"Backups","action":"bk:daily → BACKUP.runDaily (idempotent per date); backup-now (checkbox-selected stores, label) → DB.backups.now(ids,'manual'); backup-store:<id> (also on HR data manager + dbstore); sched-backup-now (HR schedule)","writes":["localStorage backups","db_audit.events(backup.exported)"],"notifies":["toast"]},{"n":3,"persona":"system","menu":"(scheduler)","action":"DB.tick() every 60s + 1.5s after load: for each db_platform.backup_policies row due by FREQ_MS → backupNow(due,'scheduled'); policies edited via .sc-freq / .sc-on change handlers → DB.setPolicy (audit backup.policy_changed)","writes":["db_platform.backup_policies.last","localStorage backups","db_audit.events"],"notifies":["sysadmin: 'Last run' column"]},{"n":4,"persona":"sysadmin","menu":"Backups","action":"bk:restore:<id> | backup-restore:<id> | store-restore:<id> → confirm → DB.backups.restore: db_audit ⇒ audit 'backup.audit_verified' only (never rewritten); db_identity ⇒ accounts/policies/providers restored but sessions/tokens/directory kept (audit identity.sessions_excluded); others ⇒ overwrite + persist (→ D1 push)","writes":["<stores>","db_audit.events(backup.restored)"],"notifies":["toast; every persona sees rewound data after DATA.pulse"]},{"n":5,"persona":"sysadmin","menu":"Backups","action":"bk:export:<id> → BACKUP.exportSet JSON download {adeptio_backup:'2.4.5', data}; backup-dl / db-export downloads (DB.exportObj includes db_identity)","writes":[],"notifies":["browser download"]},{"n":6,"persona":"sysadmin","menu":"Backups","action":"#bk-upload change → FileReader → confirm → BACKUP.importFile: skips db_identity entirely, writes each store's tables via DB.raw + DB.persist (no per-store validation)","writes":["<stores>","db_audit.events(backup.imported_file, origin 'upload')"],"notifies":["toast; route → backups"]},{"n":7,"persona":"sysadmin","menu":"Backups","action":"drill → DB.drill: random non-derived store deep-copied and compared (always equal ⇒ 'pass'); dw-rebuild → DB.rebuildReports recomputes presence counts from db_people","writes":["db_platform.drills","dw_reports.org_snapshots","db_audit.events(restore.drill_pass|fail, dw.rebuilt)"],"notifies":["sysadmin + ceo dataroom: drill row"]}]},"F-PLT-06":{"id":"F-PLT-06","name":"DB ops: reset / purge / migrate (auto-snapshot first)","status":"partial","kind":"ops","area":"platform","outcome":"Reset/purge replicate to D1 within 30s (confirm text). Migrate is a labelled stub.","steps":[{"n":1,"persona":"sysadmin","menu":"DB ops","action":"dbops:reset:<id> → confirm → DBOPS.reset: DB.backups.now([store],'manual','pre-reset') then DB.reset(store) → audit dbops.reset","writes":["localStorage backups","<store> reseeded","db_audit.events(store.reseeded, dbops.reset)"],"notifies":["toast"]},{"n":2,"persona":"sysadmin","menu":"DB ops","action":"dbops:purge:<id> → snapshot, then every array table in DB.raw(store) set to [] and persisted — works on db_audit and db_platform too (bypasses append/derived guards)","writes":["<store> emptied","db_audit.events(dbops.purge)"],"notifies":["toast (warn)"]},{"n":3,"persona":"sysadmin","menu":"DB ops","action":"dbops:migrate:<id> → snapshot + audit 'dbops.migrate (stub)'; returns note 'runs with the Cloudflare D1 cutover'","writes":["localStorage backups","db_audit.events"],"notifies":["toast"]}]},"F-PLT-07":{"id":"F-PLT-07","name":"D1 replication: local write → outbox → 30s PUT /api/sync/:store (CAS) · boot/interval pull (LWW)","status":"live","kind":"sync","area":"platform","outcome":"Store-granular last-writer-wins across devices; db_platform (flags/license) and db_comms replicate; db_identity and db_audit stay device-local. GET /api/sync returns every sensitive=0 row including db_audit if D1 has it, but the client skips it.","steps":[{"n":1,"persona":"system","menu":"(DB.persist)","action":"every DB.persist(id) writes localStorage envelope {v, t, sv, tables} and calls SYNC.enqueue(id); skipped for db_identity and db_audit; no-op when API_CONFIG.base is empty","writes":["localStorage 'adeptio.v245.sync.outbox'"],"notifies":[]},{"n":2,"persona":"system","menu":"(interval 30s / online event / badge click)","action":"SYNC.flush: for each dirty id PUT <base>/api/sync/<id> {tables, v, base: sv} with Authorization Bearer API_CONFIG.syncToken; 200 → DB.markSynced(id, updated); 409 → drop local push, status 'conflict', pull(); then DB.audit('system','cloud.sync_pushed') if any non-audit store moved","writes":["localStorage envelope sv/t","db_audit.events(cloud.sync_pushed, origin 'sync')"],"notifies":["all: #d1-badge colour/text; document event 'sync:status'"]},{"n":3,"persona":"edge","menu":"Worker","action":"authed() requires env.SYNC_TOKEN (fail-closed 401); PUT rejects db_identity (403); UPDATE store_blob ... WHERE store=? AND updated=<base> (compare-and-swap) else 409 with current row","writes":["D1 store_blob(tables, v, updated)"],"notifies":[]},{"n":4,"persona":"system","menu":"(boot +300ms, and after each flush)","action":"SYNC.pull: GET /api/sync → for each remote store not skipped and not locally dirty, if remote.updated > local t → DB.hydrate(id, tables, updated) (no enqueue) → DATA.pulse()","writes":["<store> in memory + localStorage envelope (sv=t=updated)"],"notifies":["all personas: full re-render with cloud data; badge 'N store(s) pulled'"]}]},"F-PLT-08":{"id":"F-PLT-08","name":"Audit ledger: every cell's DB.audit → db_audit.events → Sys Admin Audit screen / CSV extract","s uth.portal_flag, auth.mode_changed, auth.provider_changed, auth.directory_*, auth.session_expired, auth.session_revoked, auth.logout, auth.directory_unreachable, auth.lockout, auth.login_failed, auth.credential.hash_purged, auth.login, auth.invited, auth.invite_resent, auth.access_revoked, auth.unlocked, auth.reset_requested, auth.credential.mode_changed, auth.credential.bulk_switch, auth.credential.set_local, auth.activated, auth.reset_completed, auth.password_changed; app.js handleAct — report.downloaded, comms.channel.reconnected, template.published, template.previewed, policy.acknowledged, profile_change.approved, <type>.delegated, claim.routed_finance, coaching.note_recorded, payroll.ledger_adjusted, pv.escalated, attendance.flag_noted, role.request_approved.","steps":[{"n":1,"persona":"all cells","menu":"(any mutation)","action":"DB.audit(who, act, obj, ip) unshifts {ts, who, act, obj, ip} into db_audit.events, truncates to 250, persist (enqueue skipped). Also implicit from DB.add/del/reset/backups/reports/tick/drill.","writes":["db_audit.events (cap 250)"],"notifies":[]},{"n":2,"persona":"sysadmin","menu":"Audit","action":"DATA.audit (DB.list db_audit events) rendered as Live tail; KPIs 'Events today 1,204 / Anomalies 0 / Retention 7 years' are static","writes":[],"notifies":[]},{"n":3,"persona":"sysadmin","menu":"Audit","action":"audit-dl → CSV of all events downloaded; no audit fact written for the extract","writes":[],"notifies":["browser download"]}]},"F-PLT-09":{"id":"F-PLT-09","name":"Platform health · integrations catalog · platform reports · schedule connector (read/stub surfaces)","status":"stub","kind":"read","area":"platform","outcome":"Health and Integrations are mostly narrative; Platform reports share the reports engine (owned by the reports area).","steps":[{"n":1,"persona":"sysadmin","menu":"Health","action":"KPIs: Delivery 99.1% / Uptime 99.98% static; Live sessions + Lockouts from AUTH.stats(); channels from DATA.channels; 'Needs attention' "evidence":"js/screens/staff.js:435; js/screens/manager.js:240; js/screens/hr.js:176,194; js/db.js:591-600","theme":"T00","flow":"F-PLT-04","area":"platform"},"H-PLT-08":{"id":"H-PLT-08","severity":"high","note":"Custody exception is inconsistent: list-restore rehydrates db_identity accounts+hashes+providers from a localStorage snapshot, file-import skips db_identity entirely, exports (backup-dl, db-export) include db_identity hashes in a downloadable file, and the Worker's /api/restore also skips it — four different rules for the same store.","evidence":"js/db.js:657-665,686-691; js/backup.js:53; js/app.js:775-784; worker/src/v245.js:122","theme":"T09","flow":"F-PLT-05","area":"platform"},"H-PLT-09":{"id":"H-PLT-09","severity":"med","note":"Backup sets are stored outside the store catalog (localStorage 'adeptio.v245.backups'), so they never replicate; the Worker backup/restore routes are dead from the client's perspective and the 'Daily auto · 02:00' chip is a disabled checkbox with no scheduler behind it (runDaily is manual).","evidence":"js/db.js:623-626; js/backup.js:29-33; js/screens/sysadmin.js:328; worker/src/v245.js:96-128","theme":"T00","flow":"F-PLT-05","area":"platform"},"H-PLT-10":{"id":"H-PLT-10","severity":"low","note":"Restore drill compares a store against a deep copy of itself, so it cannot fail; 'pass' results are audited as resilience evidence and surfaced to the CEO data room.","evidence":"js/db.js:718-730; js/screens/ceo.js:172,178-180","theme":"T10","flow":"F-PLT-05","area":"platform"},"H-PLT-11":{"id":"H-PLT-11","severity":"high","note":"Purge and reset can wipe db_audit (the 'immutable' ledger) and db_platform (registry, backup policies, persisted flags/license) because DBOPS writes via DB.raw/DB.reset which have no append/global guard; DB.del's append guard only protects the row path.","evidence":"js/dbops.js:14-17; js/db.js:592,601-605","theme":"T10","flow":"F-PLT-06","area":"platform"},"H-PLT-12":{"id":"H-PLT-12","severity":"high","note":" lic API /api/v1 · 3 tokens' while db_platform.flags marks SSO as roadmap and no such routes exist in the Worker; Health never calls the real /api/health.","evidence":"js/screens/sysadmin.js:218-221; js/db.js:332; worker/src/v245.js:58-61","theme":"T12","flow":"F-PLT-09","area":"platform"}},"themes":{"T01":{"id":"T01","title":"Approval engine has no scope or stage authority","note":"DATA.approve never consults APPROVALS.TYPES scope/stage; Manager L1 queue is org-wide (not team-scoped); HR unified inbox is unscoped so HR decides L1 items; only Claim chains L1→L2; the same request id has 2–4 decide surfaces (OT ×3, Swap ×4, TC ×2, Advance in Manager queue).","hotspots":["H-APR-05","H-APR-07","H-APR-17","H-APR-15","H-PAY-09","H-SCH-10","H-TIM-06","H-EWA-03","H-APR-11"]},"T02":{"id":"T02","title":"Approval outcomes never land in the domain store","note":"Leave approval debits nothing and never sets 'onleave'; Correction approval never adjusts db_time; Advance/RUN/LEVEL live in memory while their db_workflow rows persist; Profile request has no payload; 'Settle via finance' leaves a row pending forever; returned Advance never clears.","hotspots":["H-APR-01","H-APR-10","H-APR-13","H-APR-20","H-APR-08","H-TIM-04","H-EWA-02","H-EWA-04","H-EWA-06","H-PPL-07"]},"T03":{"id":"T03","title":"Leave truth is split three ways and holidays are not persisted","note":"db_leave.balances, employees.leaveBal and LEAVECAL constants disagree; three leave-type catalogues; holidays live in a module array (lost on reload, never synced); HR Leave screen is static; L1 decision screens show static balance/conflict context.","hotspots":["H-LEV-01","H-LEV-02","H-LEV-03","H-LEV-04","H-LEV-08","H-APR-04"]},"T04":{"id":"T04","title":"db_time is written but never read as the attendance truth","note":"Staff punch history and every attendance board are literals or db_people.state; device telemetry is synthetic; group→device binding has no UI; a server-side /punch writer would be overwritten by the browser's whole-store PUT (LWW); two divergent Workers.","hotspots":["H-TIM-01","H-TIM-15","H-TIM-18","H-TIM-11","H-TIM-02","H-TIM-19","H-TIM-16"]},"T05":{"id":"T05","title":"One-writer-per-store is broken everywhere","note":"db_people has 4 writers (People, Schedule, raw editors); db_devices HR+SysAdmin; db_comms 4 cells; db_leave written by People cell; db_platform.flags by Identity cell; raw Data-manager/Team-data/My-data/DB-studio editors add/delete rows in every persona.","hotspots":["H-PPL-08","H-SCH-07","H-TIM-08","H-COM-07","H-PPL-01","H-IDN-02","H-IDN-26","H-ACC-09","H-PLT-06","H-IDN-20"]},"T06":{"id":"T06","title":"Persona scope leaks (who may do what)","note":"Manager creates divisions and moves any employee (sched-staff canEdit) and hires/fires via Team data; read-only CEO generates/expires reports; HR grants sysadmin/ceo scope from a person card; HR doubles as Sys Admin (identity console, one-click restore); Manager/HR deep-link into the Sys Admin console.","hotspots":["H-SCH-03","H-SCH-06","H-PPL-09","H-PPL-13","H-PPL-12","H-ACC-07","H-IDN-08","H-IDN-14","H-SCH-14","H-TIM-12","H-IDN-21"]},"T07":{"id":"T07","title":"Payroll split-brain","note":"Two pay-run lifecycles named PR-2026-06 (db_payroll.payroll_runs vs in-memory PAY.run); Disburse is a stub labelled live; approved OT never reaches components.ot; four different gross figures; OT rates in two stores; staff-cost post can double on reload; DW series synthetic.","hotspots":["H-PAY-02","H-PAY-03","H-PAY-05","H-PAY-01","H-PAY-13","H-PAY-07","H-ACC-03","H-ACC-04","H-ACC-05"]},"T08":{"id":"T08","title":"Communication has no 'to' side","note":"Composer ignores audience/channel/template; no staff/manager inbox consumes db_comms; two unrelated channel registries (MAIL.cfg vs db_comms.channels); template content never saved; auth tokens inside db_comms replicate to D1.","hotspots":["H-COM-01","H-COM-09","H-COM-03","H-COM-05","H-COM-02","H-COM-04","H-IDN-09","H-COM-08"]},"T09":{"id":"T09","title":"Security & custody gaps in the demo→real seam","note":"Portal on/off switch and the outbox (live activation/reset links) are reachable pre-login; SYNC_TOKEN shipped in the client bundle; Worker identity mutations unauthenticated; api-config points at v245.js which has no /auth routes; db_identity custody differs across restore/export/import.","hotspots":["H-IDN-01","H-IDN-25","H-IDN-27","H-IDN-28","H-IDN-04","H-PLT-08","H-PLT-12","H-IDN-05","H-IDN-17"]},"T10":{"id":"T10","title":"Audit ledger is not evidence","note":"Actor/IP hard-coded per module ('Khamla S.', 'Vilayvanh C.', 'Thip N.'); 250-row ring buffer in localStorage; not replicated; purge/reset can wipe db_audit and db_platform; restore drill cannot fail.","hotspots":["H-APR-02","H-PLT-15","H-PLT-11","H-PLT-13","H-PPL-03","H-SCH-05","H-PLT-10","H-IDN-06"]},"T11":{"id":"T11","title":"Flags, gates and licensing are decorative","note":"Five flags have no consumer; flag-off hides nav only — routes and actions still work; lic:* bypasses the owner gate; owner gate effectively always open; two tier systems (LICENSE vs DATA.state.tier); MAIL/PLATOWNER config not persisted.","hotspots":["H-PLT-01","H-EWA-05","H-ACC-02","H-PLT-03","H-PLT-05","H-PLT-04","H-APR-12","H-TIM-03","H-IDN-15"]},"T12":{"id":"T12","title":"Stubs labelled live and dead menus","note":"HR Leave screen static; Roles/Integrations/Health static; connector stub in two navs; Manager legacy Schedule frame; Test bind toast; Delegate no-op; HR Documents never lists db_docs; db_schedule.views API without caller; profile-view stuck on employees[0]; PROFILE fallbacks fake DOB/NID.","hotspots":["H-LEV-07","H-PPL-10","H-PPL-19","H-PLT-16","H-SCH-15","H-SCH-16","H-IDN-16","H-APR-22","H-PPL-14","H-SCH-13","H-PPL-04","H-PPL-05","H-PAY-08","H-ACC-08"]},"T13":{"id":"T13","title":"Identity keyed by display name, not id","note":"Request ownership and member history match r.who === name (rename orphans history); request ids derive from row count (collide after delete); HR-initiated advance stamps the acting staff user as requester.","hotspots":["H-APR-18","H-PPL-17","H-APR-03","H-APR-14","H-EWA-07"]}},"proposals":{"P-APR-1":{"id":"P-APR-1","title":"One approval engine with scope and stage authority","what":"Make DATA.approve read APPROVALS.TYPES for scope and stage before it accepts a decision, and refuse a decision from a persona the type does not name. Every decide button in the app calls that one entry point.","why":"The registry's scope field has no reader anywhere, so routing is decided by whichever screen the decision was made on. Advance is registered scope 'hr' but lands in the Manager L1 queue, and an Expense type exists that no UI ever submits.","links":["F-APR-02","F-APR-06","H-APR-09","H-APR-15","H-EWA-03","T01"],"effort":"L","area":"approvals"},"P-APR-2":{"id":"P-APR-2","title":"Scope the queues: Manager sees its own team, HR sees stage L2","what":"Give pendingL1 a team filter derived from the session's employee record, and give the HR inbox a stage filter so HR works L2 and escalations only.","why":"The Manager L1 queue returns every L1 request in the org while the manager persona is hard-wired to one team, and the HR inbox is unscoped so HR decides L1 rows that the manager has not seen.","links":["F-APR-08","H-APR-17","H-APR-07","H-PPL-09","T01","T06"],"effort":"M","area":"approvals"},"P-APR-3":{"id":"P-APR-3","title":"Collapse the duplicate decide surfaces to one Inbox per persona","what":"Remove the per-type decide screens (Manager and HR shift swaps, HR overtime cards, HR advances) and leave them as read and configuration surfaces that link into Inbox.","why":"One Swap id can be decided on four screens, one Overtime id on three, one Correction on two, all firing the same hooks with no idempotency.","links":["F-APR-05","F-APR-08","H-SCH-10","H-PAY-09","H-TIM-06","H-APR-05","H-APR-11","T01"],"effort":"M","area":"approvals"},"P-APR-4":{"id":"P-APR-4","title":"Make the decision a transaction that moves the domain store","what":"Approve runs one command: flip the request row, apply the domain effect through the owning cell, write the audit fact. If the domain write fails, the status does not move.","why":"Leave approval debits no balance and never sets the employee state, Correction approval never touches the punch ledger, Profile approval changes nothing, and 'Settle via finance' leaves the row pending forever.","links":["F-APR-01","F-APR-03","F-APR-04","H-APR-01","H-APR-08","H-APR-10","H-APR-20","H-TIM-04","T02"],"effort":"L","area":"approvals"},"P-APR-5":{"id":"P-APR-5","title":"Give the return path a note, and give withdraw a handler","what":"Capture the approver's note on return, keep the request id on resubmit, and put a real withdraw action on request-detail that is guarded by status.","why":"Return with note captures no note, there is no withdraw handler on the detail screen, and the only way to withdraw is a raw table delete that also works on approved rows.","links":["F-APR-07","F-APR-10","H-APR-16","H-APR-21","H-ACC-11"],"effort":"S","area":"approvals"},"P-APR-6":{"id":"P-APR-6","title":"Finish or delete the protective-check and delegation stubs","what":"Either run the protective check on submit and set the flag it renders, or remove the 'protective' attribute, the grade rendering and the dead cap check. Same for Delegate: reassign the request or remove the button.","why":"Four types are marked protective and the inbox renders a flagged marker, but nothing ever sets the grade; Delegate overwrites the requester's note and reassigns nothing while being labelled live behind a lock.","links":["F-APR-02","F-APR-11","H-APR-06","H-APR-22","H-PAY-10","H-TIM-05","T12"],"effort":"S","area":"approvals"},"P-LEV-1":{"id":"P-LEV-1","title":"One leave catalogue and one balance","what":"Make db_leave.leave_types the only catalogue and db_leave.balances the only balance. Retire the module constants and turn employees.leaveBal into a derived read.","why":"Three disjoint catalogues and three disagreeing balance sources coexist; the staff time-off panel shows the same constant numbers for every employee.","links":["F-LEV-01","F-LEV-02","H-LEV-01","H-LEV-02","T03"],"effort":"M","area":"leave"},"P-LEV-2":{"id":"P-LEV-2","title":"Give db_leave a Leave cell and make it the only writer","what":"Move balance seeding on hire and removal on offboard into a Leave command that the People cell calls, and take the store out of the raw data manager's write set.","why":"The catalog declares the Leave cell as writer, but the only writers are the People cell's hire and offboard functions and the HR raw editor.","links":["F-LEV-02","F-PPL-01","H-LEV-03","H-PPL-01","T05"],"effort":"M","area":"leave"},"P-LEV-3":{"id":"P-LEV-3","title":"Persist holidays and make them actually block","what":"Store holidays in db_leave with a kind field (statutory or company), let HR maintain both, and make the calendar and the time-off picker refuse the blocked dates the copy already promises.","why":"Holidays live in a module array, so HR additions vanish on reload and never replicate; the screen claims they block the calendar column and the picker, but the calendar only tints and drops stay live.","links":["F-LEV-03","H-LEV-04","H-LEV-05","H-LEV-06","T03"],"effort":"M","area":"leave"},"P-LEV-4":{"id":"P-LEV-4","title":"Rebuild the HR Leave screen as the real configuration surface","what":"Replace the static screen with types, accrual rules, balance adjustments and the conflict heatmap, all reading the store.","why":"The screen is entirely static markup showing a pending count of nine while the workflow store holds one pending leave request, and it is listed as a live HR menu.","links":["F-LEV-04","H-LEV-07","T12","T03"],"effort":"M","area":"leave"},"P-LEV-5":{"id":"P-LEV-5","title":"Make the L1 decision screen show real context","what":"Feed the approver the requester's live balance, the team conflict count and the holiday overlap from the stores, computed at render time.","why":"The conflict check, requester balance and 'on leave' counters on the decision screens are static markup, and the schedule lens reads the balance store in a loop that does nothing with it.","links":["F-LEV-05","H-LEV-08","H-LEV-09","T03"],"effort":"M","area":"leave"},"P-TIM-1":{"id":"P-TIM-1","title":"Make db_time the attendance truth","what":"Derive presence, lateness and the punch history from db_time.punches. Retire the seeded employee state field as an input and recompute it, if it is kept at all, as a cached projection.","why":"Every board described as the live attendance ledger reads a seeded employee state instead; the staff punch history and Today cards are hard-coded literals on the very screen that writes the punches.","links":["F-TIM-01","F-TIM-06","H-TIM-01","H-TIM-15","H-TIM-19","H-TIM-17","T04"],"effort":"L","area":"time"},"P-TIM-2":{"id":"P-TIM-2","title":"Derive the clock state from the open punch","what":"Replace the non-persisted clockedIn flag with a query for the employee's open punch, so a reload cannot reopen a closed punch.","why":"clockedIn is a UI flag initialised to true and never persisted, so a reload can re-open a punch that was already closed.","links":["F-TIM-01","H-TIM-02","T04"],"effort":"S","area":"time"},"P-TIM-3":{"id":"P-TIM-3","title":"Land the correction in the punch ledger","what":"On approving a Correction, write the adjustment to db_time.punches through the Time cell in the same transaction as the status flip, and drop the separate HR ledger-adjust stub.","why":"Correction approval marks the request approved and writes nothing to db_time; the HR post action is audit-only against a hard-coded request id.","links":["F-TIM-02","H-TIM-04","H-APR-10","T02"],"effort":"M","area":"time"},"P-TIM-4":{"id":"P-TIM-4","title":"One writing cell for db_devices, and a binding screen","what":"Give db_devices a single command API. HR calls it for groups, Sys Admin for devices and gates, and a new binding screen wires a group to its terminals.","why":"Two personas write one store from two cells, group-to-device binding exists only in seed data with no UI, and three unrelated 'group of people' concepts hold membership with no link between them.","links":["F-TIM-03","F-TIM-04","H-TIM-08","H-TIM-10","T05"],"effort":"M","area":"time"},"P-TIM-5":{"id":"P-TIM-5","title":"Stop presenting synthetic telemetry as device status","what":"Either implement a real handshake and a real connection test, or mark the device monitor simulated and remove the claims from the copy. Persist or drop the form secrets that are currently read and discarded.","why":"A device is online the moment it is added, the connection test derives success from the stored status, and the comm key, password, HMAC and enrollment token are read from the form and silently thrown away under a 'vault ref' label.","links":["F-TIM-04","H-TIM-11","H-TIM-13","T04","T12"],"effort":"M","area":"time"},"P-TIM-6":{"id":"P-TIM-6","title":"Decide the punch writer before building the edge ingest","what":"Pick one Worker, and make it write punches row-wise into db_time through the same row-level sync as everything else. Do not ship the edge /punch path while the browser pushes the whole store.","why":"A server-side punch writer would be overwritten by the browser's wholesale store PUT under last-write-wins, and two divergent Workers both route /punch with different behaviour.","links":["F-TIM-07","F-PLT-07","H-TIM-18","H-PLT-14","T04","T05"],"effort":"L","area":"time"},"P-SCH-1":{"id":"P-SCH-1","title":"Scope the manager's roster commands, not just the view","what":"Make assign and publish operate on the shift groups the manager owns, resolved from the session, and refuse rows outside that set.","why":"Manager scope is a display filter only: the assign form and publish-month operate on every shift group and every planned row in the org.","links":["F-SCH-02","H-SCH-03","T06"],"effort":"M","area":"schedule"},"P-SCH-2":{"id":"P-SCH-2","title":"Take org power out of the schedule area","what":"Remove create-division and reassign-anyone from the manager's Staff & Division screen, and route both through the People cell where HR owns them.","why":"The manager screen is registered with edit rights and gives a team-scoped persona HR-level org power over any employee.","links":["F-SCH-03","F-PPL-04","H-SCH-06","H-PPL-09","T06"],"effort":"M","area":"schedule"},"P-SCH-3":{"id":"P-SCH-3","title":"Complete the schedule master-data API","what":"Add update and delete for shift periods, people groups and shift groups, and validate the group kind against the registered set.","why":"Master data is create-only everywhere in the UI and the API, so any mistake in a shift period or group is permanent.","links":["F-SCH-01","H-SCH-01"],"effort":"S","area":"schedule"},"P-SCH-4":{"id":"P-SCH-4","title":"Make the swap rewrite safe and visible","what":"Validate capacity and group membership before rewriting a published roster row, decide whether the row returns to planned, and notify the colleague who was swapped in. Restrict the target list to the shift group's own members.","why":"The approval hook rewrites a published row with no capacity or membership check, returns silently on failure, and the target list is every employee in the store.","links":["F-SCH-05","H-SCH-11","H-SCH-12"],"effort":"M","area":"schedule"},"P-SCH-5":{"id":"P-SCH-5","title":"Publish means published","what":"Make the staff and CEO calendars filter on published status, and make the filter pills on Shift Management filter.","why":"The calendars claim to show published shifts but never filter on status, so unpublished planned rows are visible to staff; the status pills only toggle their own pressed state.","links":["F-SCH-02","F-SCH-04","H-SCH-04","H-SCH-09"],"effort":"S","area":"schedule"},"P-SCH-6":{"id":"P-SCH-6","title":"Delete the dead schedule surfaces","what":"Remove the legacy manager Schedule frame and the member 'Schedule — Shift A' link, remove the duplicated connector stub from the HR nav, and either wire the saved-views API to a screen or delete it.","why":"The pre-v2.4.4 screen remains in the nav with a Publish that writes messages, the identical connector stub sits in two navs, and the saved-views store has a writer API and no caller while view state lives in the URL.","links":["F-SCH-06","F-SCH-08","F-SCH-09","H-SCH-13","H-SCH-15","H-SCH-16","T12"],"effort":"S","area":"schedule"},"P-PAY-1":{"id":"P-PAY-1","title":"One pay-run lifecycle","what":"Keep the persisted db_payroll.payroll_runs lifecycle and retire the in-memory run object; every screen reads and advances the same row.","why":"Two unrelated lifecycles both labelled PR-2026-06 run in parallel, one persisted and one in a closure, and the screens disagree about which one is current.","links":["F-PAY-02","H-PAY-02","T07"],"effort":"L","area":"payroll"},"P-PAY-2":{"id":"P-PAY-2","title":"Make disburse produce payslips or stop claiming it does","what":"Generate db_payroll.payslips rows at disburse from the components and the run, and only then show the 'bank file exported, payslips published' message.","why":"Disburse is a stub labelled live: the toast and the progress copy claim a bank file and published payslips while no code writes the payslip table, which holds two seed rows.","links":["F-PAY-02","F-PAY-04","H-PAY-03","H-PAY-07","T07"],"effort":"M","area":"payroll"},"P-PAY-3":{"id":"P-PAY-3","title":"Approved overtime must reach the payslip","what":"Make the overtime approval hook write the hours to db_payroll.components.ot through the Payroll cell, and keep one set of overtime rates.","why":"The component is fixed at seed time from the employee record; the approval hook updates the quota store only, and rates exist in two stores with different values.","links":["F-PAY-03","F-PAY-05","F-PAY-06","H-PAY-05","H-PAY-13","T07","T02"],"effort":"M","area":"payroll"},"P-PAY-4":{"id":"P-PAY-4","title":"One gross figure","what":"Compute gross once in the Payroll cell and have the dashboard, the run pages, the board and the ledger read it.","why":"Four different gross numbers coexist across the dashboard, the run table, the warehouse snapshot and the board literals; the run pages read the warehouse instead of the payroll cell's own sums.","links":["F-PAY-01","F-PAY-02","H-PAY-01","H-PAY-04","H-ACC-05","T07"],"effort":"M","area":"payroll"},"P-PAY-5":{"id":"P-PAY-5","title":"Move the OT decision out of the configuration screen","what":"Leave the quota and the rates on the OT screen; move every approve and return into the Inbox. Maintain the pending counter on submit, not only on approval.","why":"The same OT id can be resolved on three surfaces, and the quota's pending hours are decremented on approval but never incremented on submit, so the pending figure is seed-only.","links":["F-PAY-05","F-PAY-06","H-PAY-09","H-APR-04","H-PAY-10","T01"],"effort":"M","area":"payroll"},"P-PAY-6":{"id":"P-PAY-6","title":"Make the restore and the statutory screens honest","what":"Scope the pay component restore to components instead of rewinding the whole payroll store, make the PIT brackets editable, and show the same compliance figure to HR and the CEO.","why":"Loading a pay snapshot restores payslips, runs and tax config too, the brackets are displayed but not editable, and the compliance badge is HR-only while the CEO screen shows a different number.","links":["F-PAY-03","F-PAY-07","H-PAY-06","H-PAY-14"],"effort":"S","area":"payroll"},"P-EWA-1":{"id":"P-EWA-1","title":"Persist the advance ledger","what":"Move the advance, run and level state out of the module closure into db_payroll so approved and recovered advances survive a reload and replicate.","why":"The advance ledger is an in-memory array while its workflow rows persist, so the request row says approved and the money state is gone after a refresh.","links":["F-EWA-02","H-EWA-02","H-APR-13","T02"],"effort":"M","area":"ewa"},"P-EWA-2":{"id":"P-EWA-2","title":"Route the advance to the persona that owns it","what":"Honour the registered scope so the advance lands in the HR queue, and clear the ledger row when the request is returned.","why":"Advance is registered scope 'hr' but the row is stamped stage L1 Manager and shows in the manager queue; a returned advance leaves its ledger row pending forever and inflates the outstanding KPI.","links":["F-EWA-02","F-APR-06","H-EWA-03","H-EWA-06","H-APR-15","T01","T02"],"effort":"S","area":"ewa"},"P-EWA-3":{"id":"P-EWA-3","title":"Recovery must reduce net pay","what":"At run close, write the recovery as a payslip line and a component so the employee's net pay actually falls.","why":"Recovery is bookkeeping only: the close flips the ledger status and sums the amounts, but no payslip, component or net-pay figure is reduced.","links":["F-EWA-02","H-EWA-04","T02","T07"],"effort":"M","area":"ewa"},"P-EWA-4":{"id":"P-EWA-4","title":"Stamp the requester, not the acting user","what":"Let the submit command take the subject employee id, so an HR-initiated advance is filed against that employee.","why":"Submit always stamps who, employee and division from the acting session, so an HR-initiated advance for another employee is recorded as a request by the HR user.","links":["F-EWA-03","H-EWA-07","H-APR-14","T13"],"effort":"S","area":"ewa"},"P-EWA-5":{"id":"P-EWA-5","title":"Make the compliance gate a real gate","what":"Feed the level from the actual checks (filings, audit, payroll compliance) and gate the close on all of them, and make the earned-to-date clock consistent with the frozen payroll calendar.","why":"Only one level threshold is ever tested and nothing else feeds it; the earned-to-date fraction uses the real wall clock while every other payroll date is frozen.","links":["F-EWA-01","F-EWA-04","H-EWA-08","H-EWA-01","T12"],"effort":"M","area":"ewa"},"P-ACC-1":{"id":"P-ACC-1","title":"Decide the book of record for staff cost","what":"Either the posted cashbook row counts in the rollup or the payroll lens does, and the screen shows only the one that counts.","why":"The rollup ignores staff-kind rows while the table displays them, so the cashbook shows a total that does not include what it is showing.","links":["F-ACC-02","H-ACC-03","T07"],"effort":"M","area":"accounting"},"P-ACC-2":{"id":"P-ACC-2","title":"Make the staff-cost post idempotent per run","what":"Key the post on the run id so closing or reloading cannot post it twice.","why":"The staff-cost post can double on reload, which silently doubles the month's labour cost.","links":["F-ACC-02","H-ACC-03","T07"],"effort":"S","area":"accounting"},"P-ACC-3":{"id":"P-ACC-3","title":"Derive the warehouse series instead of scaling one month","what":"Build the six-month series from the ledger and payroll history, and source the board, trends and compliance tiles from the warehouse.","why":"The series is the current month's rollup multiplied by fixed constants, and the board's labour cost, burn, headcount, attrition and OT figures are hard-coded literals.","links":["F-ACC-02","F-ACC-03","H-ACC-04","H-ACC-05","H-ACC-06","T07"],"effort":"M","area":"accounting"},"P-ACC-4":{"id":"P-ACC-4","title":"Take the write actions off the read-only persona","what":"Remove Generate and Expire from the CEO report library; runs are produced on the schedule the copy already describes, by HR or Sys Admin.","why":"The persona defined as read-only writes the generated-reports table and the audit ledger, and can permanently expire a run.","links":["F-ACC-04","H-ACC-07","T06"],"effort":"S","area":"accounting"},"P-ACC-5":{"id":"P-ACC-5","title":"Demote the scoped data managers to export","what":"Turn the HR, Manager, Staff and CEO raw editors into filtered exports with no add or delete, and leave the Sys Admin database studio as the only raw editor.","why":"The HR editor writes payroll, workflow, people and leave directly through the generic add and delete path, the manager editor can add any employee row, and staff can delete approved requests including overtime that already consumed quota.","links":["F-ACC-05","F-ACC-06","H-ACC-09","H-ACC-11","H-PPL-12","H-PLT-07","T05"],"effort":"M","area":"accounting"},"P-ACC-6":{"id":"P-ACC-6","title":"Label the export formats honestly","what":"Either implement the PDF, XLSX and bank formats and the scheduled delivery, or show only CSV and mark the rest roadmap.","why":"The format labels are decoration — every run is produced as CSV — and the scheduled board-pack delivery is display-only.","links":["F-ACC-04","H-ACC-08","T12"],"effort":"S","area":"accounting"},"P-PPL-1":{"id":"P-PPL-1","title":"One writing cell for db_people","what":"Route every division, team and employee change through one People command, called by the person card, the schedule screen and the import alike, and remove the store from the raw editors' write set.","why":"Four code paths write the same division fields and three UI surfaces write the same employee row, so the same change has different side effects depending on the screen it came from.","links":["F-PPL-04","F-PPL-06","F-SCH-03","H-PPL-08","H-SCH-07","H-PPL-13","T05"],"effort":"L","area":"people"},"P-PPL-2":{"id":"P-PPL-2","title":"Offboarding is a command, not a row delete","what":"Make deleting an employee impossible from the generic editor; offboarding runs the command that removes the balance, disables the account, revokes the sessions and sends the notice.","why":"A generic delete bypasses offboarding entirely, leaving an active account with live sessions, and the HR toast claims a record was exported when nothing is produced.","links":["F-PPL-05","F-PPL-06","H-PPL-12","H-PPL-11","T06","T05"],"effort":"M","area":"people"},"P-PPL-3":{"id":"P-PPL-3","title":"Give the profile screen a person","what":"Add a person selector, drive profile-edit from the person card, and remove the invented fallback values for date of birth, national id, manager and start date.","why":"The profile screen always renders the first employee, the only path into edit is its own button, and saving persists the fallback constants as if they were the person's real data.","links":["F-PPL-02","H-PPL-04","H-PPL-05","H-PPL-06","T12"],"effort":"M","area":"people"},"P-PPL-4":{"id":"P-PPL-4","title":"Make the profile change request carry a payload","what":"Register the type, attach the changed fields to the request, and apply them through the People command on approval.","why":"The request carries no payload, is unregistered so it falls into the 'others' bucket, and approving it changes nothing in the people store.","links":["F-PPL-03","F-APR-09","H-PPL-07","H-APR-20","T02"],"effort":"M","area":"people"},"P-PPL-5":{"id":"P-PPL-5","title":"Make the documents vault a real surface","what":"List db_docs on the HR screen with a queue for staff-requested documents, generate against a selected person instead of hard-coded lookups, and scope the policy acknowledgement to the acting user's own document.","why":"The HR screen never lists the document store so requested documents have no queue, generation targets are hard-coded lookups, and the acknowledgement falls back to any conduct document, possibly another employee's.","links":["F-PPL-07","H-PPL-14","H-PPL-15","H-PPL-16","T12"],"effort":"M","area":"people"},"P-PPL-6":{"id":"P-PPL-6","title":"Key the person by id everywhere","what":"Match request ownership, member history and team membership on the employee id, and derive the manager's team from the session instead of a constant.","why":"Ownership and history are matched on the display name, so a rename orphans the history, and the manager persona is hard-wired to one team and one actor name.","links":["F-PPL-08","F-APR-08","H-PPL-17","H-APR-18","H-PPL-09","T13","T06"],"effort":"M","area":"people"},"P-IDN-1":{"id":"P-IDN-1","title":"Close the pre-login surface","what":"Require a session for the outbox, take the portal switch and the tier switch off the launcher and the login footer, and remove the seed-password strip from the public page.","why":"The outbox with live activation, reset and set-password links for every account is readable with no session, and a kernel security flag is toggleable by any visitor.","links":["F-IDN-01","F-IDN-11","H-IDN-01","H-IDN-25","H-IDN-03","T09"],"effort":"S","area":"identity"},"P-IDN-2":{"id":"P-IDN-2","title":"Move credentials off the client","what":"Decide one deployed Worker, move authentication behind it, and stop shipping the hash table, the pepper and the scope authority in the browser bundle.","why":"The local credential path is a client-side hash with a pinned pepper, the hash table is a browser store, and the remote path mirrors its session from the local account row, so scope authority never leaves the client. The deployed Worker per the build status has no auth routes at all.","links":["F-IDN-02","F-IDN-12","H-IDN-04","H-IDN-05","H-IDN-07","H-IDN-28","T09"],"effort":"L","area":"identity"},"P-IDN-3":{"id":"P-IDN-3","title":"Scope elevation needs an approver","what":"Take the scope dropdown off the HR person card. Elevation to hr, ceo or sysadmin becomes a request that a Sys Admin decides in the approval engine, and it is audited.","why":"HR can grant any scope including sysadmin from a person card with no approval step, and the HR persona also renders the full identity console on Essential.","links":["F-IDN-03","F-IDN-06","H-IDN-08","H-IDN-14","T06"],"effort":"M","area":"identity"},"P-IDN-4":{"id":"P-IDN-4","title":"Make the identity actions do what their labels say","what":"Force password reset invalidates the hash and revokes the sessions. Change password respects the credential mode. Sign-in counters count today. The access tile counts accounts, not a constant.","why":"Force reset only mails a link, change password fails opaquely for a directory-bound account, the sign-in KPIs count all audit facts up to the ring-buffer cap rather than today's, and the access tile hard-codes an offset.","links":["F-IDN-04","F-IDN-05","F-IDN-02","H-IDN-11","H-IDN-12","H-IDN-06","H-IDN-10","T10"],"effort":"M","area":"identity"},"P-IDN-5":{"id":"P-IDN-5","title":"One owner for credential mode","what":"Move the credential-mode switch to the identity console, wire or delete the bulk setter, and stop auto-creating simulator members with a known default password.","why":"The switch lives only on the HR person page while the console copy implies it owns it, the bulk setter is dead code, and switching to a directory mode mints a simulator member with a published default password.","links":["F-IDN-08","H-IDN-18","H-IDN-19","T06"],"effort":"S","area":"identity"},"P-IDN-6":{"id":"P-IDN-6","title":"Keep tokens out of a replicated store","what":"Either exclude db_comms from replication like db_identity, or stop putting live invite, reset and set-password links in message bodies and issue single-use tokens resolved server-side.","why":"Auth tokens are embedded in message bodies and that store replicates to the edge over a bearer token committed in the client bundle.","links":["F-IDN-03","F-COM-05","H-IDN-09","H-IDN-26","T08","T09"],"effort":"M","area":"identity"},"P-PRV-1":{"id":"P-PRV-1","title":"Split people import from account provisioning","what":"HR imports employees with no scope or credential-mode column. Account creation, scope and mode move to the Sys Admin console.","why":"A CSV row can carry a privileged scope and a directory mode and produce an active administrator account straight from an HR screen with no activation step.","links":["F-IDN-09","H-IDN-21","T06"],"effort":"M","area":"provisioning"},"P-PRV-2":{"id":"P-PRV-2","title":"One writer for db_identity.accounts","what":"Route the provisioning import, the sync apply and the directory bind through the identity cell's command instead of writing the accounts table directly.","why":"Three separate paths push rows straight into the accounts table, bypassing the cell that owns it and the invariants it enforces.","links":["F-IDN-09","F-IDN-10","H-IDN-20","T05"],"effort":"M","area":"provisioning"},"P-PRV-3":{"id":"P-PRV-3","title":"One disable semantic","what":"Make sync suspend call the same command as access-off, which revokes sessions and sends the notice.","why":"Suspend sets a status and leaves the sessions live, while access-off revokes and mails — two different meanings of disabled on the same account.","links":["F-IDN-10","H-IDN-23"],"effort":"S","area":"provisioning"},"P-PRV-4":{"id":"P-PRV-4","title":"Say what is simulated, and finish the seam","what":"Label the directory simulator as simulated wherever the copy claims edge binding, make Test bind real or roadmap, move the simulator password out of browser storage, and fix the Worker's lockout mail kind and its duplicated policy constants.","why":"Delta-sync runs entirely against the in-browser simulator while the copy says edge mode binds the real server, Test bind is a toast, the simulator password is printed on screen, and the Worker sends a reset mail for a lockout from a second copy of the policy.","links":["F-IDN-07","F-IDN-10","F-IDN-12","H-IDN-24","H-IDN-16","H-IDN-17","H-IDN-29","T12","T09"],"effort":"M","area":"provisioning"},"P-PRV-5":{"id":"P-PRV-5","title":"Write the custody rule down and make every path obey it","what":"One rule that says which stores replicate, which are excluded, and what restore, export and import do with the excluded ones — enforced in code, not in copy.","why":"Identity never syncs, but a list-restore rehydrates its accounts and hashes from a browser snapshot while export and import treat it differently again.","links":["F-IDN-12","F-PLT-05","H-PLT-08","H-IDN-27","T09"],"effort":"M","area":"provisioning"},"P-COM-1":{"id":"P-COM-1","title":"Build the consumer side","what":"Give staff, manager and HR an inbox that reads db_comms.messages for the acting user, and replace the hard-coded alert rows with it.","why":"There is no 'to' side: every alert list is hard-coded, so every send from HR, the manager or a gateway test lands in a store nobody reads.","links":["F-COM-07","F-COM-01","H-COM-09","T08"],"effort":"L","area":"comms"},"P-COM-2":{"id":"P-COM-2","title":"One channel registry","what":"Keep db_comms.channels, retire the in-memory channel config, and have the HR chips, Platform Settings and the Sys Admin screen all read it.","why":"Two unrelated registries coexist and neither knows about the other; the in-memory one is also not persisted, so the owner's channel setup and the allowlist vanish on reload.","links":["F-COM-02","F-COM-04","H-COM-03","H-COM-04","T08"],"effort":"M","area":"comms"},"P-COM-3":{"id":"P-COM-3","title":"Make Send honour the composer","what":"Pass audience, channel, template and schedule into the send command, and read the template list from the store.","why":"Send is called with a fixed payload and ignores every control on the screen; the template picker is a hard-coded select that never sees a template Sys Admin published.","links":["F-COM-01","H-COM-01","H-COM-02","T08"],"effort":"M","area":"comms"},"P-COM-4":{"id":"P-COM-4","title":"Persist template content","what":"Save subject and body on draft and publish, and derive the template KPIs from the store.","why":"Publish locks a version whose content lives nowhere, and the template counters are hard-coded numbers.","links":["F-COM-03","H-COM-05","T08"],"effort":"S","area":"comms"},"P-COM-5":{"id":"P-COM-5","title":"One writing cell for db_comms.messages","what":"Give the store one command that the HR composer, the manager nudge, the identity mails and the gateway tests all call, with a kind field that separates mail, notification and test.","why":"Four different cells write the store with three different hard-coded actors, and gateway tests are indistinguishable from real sends, which inflates the HR sent log.","links":["F-COM-05","F-COM-06","H-COM-07","H-COM-06","T05","T10"],"effort":"M","area":"comms"},"P-COM-6":{"id":"P-COM-6","title":"Confirm the relay before claiming delivery","what":"Establish whether the Worker's mail relay module exists in the deployment and whether budgets are enforced anywhere; until then the outbox is the only honest delivery claim.","why":"The relay module imported by both Workers is absent from the snapshot, so delivery cannot be verified from the code, and the per-channel budget counters are constants nothing increments.","links":["F-COM-05","H-COM-08","T08"],"effort":"S","area":"comms"},"P-PLT-1":{"id":"P-PLT-1","title":"Flags become real gates","what":"Every registered flag declares the menus, routes and engine paths it gates; the router checks it; boot fails when a registered flag has no consumer.","why":"Five flags have no consumer at all, and a flag that is off hides the nav item while the route and the action keep working — the advance routes and the cash-post action are reachable with their flags off.","links":["F-PLT-01","H-PLT-01","H-EWA-05","H-ACC-02","H-TIM-03","H-APR-12","T11"],"effort":"M","area":"platform"},"P-PLT-2":{"id":"P-PLT-2","title":"One tier, one owner gate","what":"Retire the query-string tier, keep the persisted licensing tier, make every licensing write call the owner gate, and derive the acting email from the session so the gate can close.","why":"Two tier systems coexist, one of them settable from a URL and a link on the public sign-in page; licensing writes never call the gate, and the gate passes because the acting email falls back to an allowlisted address.","links":["F-PLT-02","F-PLT-03","H-PLT-03","H-PLT-04","H-PLT-05","T11"],"effort":"M","area":"platform"},"P-PLT-3":{"id":"P-PLT-3","title":"Row-level sync with per-row versions","what":"Replace the whole-store last-write-wins PUT with row-level upserts carrying a version, so two devices editing different rows of one store both survive.","why":"At thirty seconds and whole-store granularity, concurrent edits to different rows of the same store lose a side, and this is also what blocks a server-side punch writer.","links":["F-PLT-07","F-TIM-07","H-PLT-14","H-TIM-18","T05","T04"],"effort":"L","area":"platform"},"P-PLT-4":{"id":"P-PLT-4","title":"Make the audit ledger evidence","what":"Append-only store with no cap, the actor taken from the session, replication or an export target decided and documented, and purge and reset unable to touch it or the platform registry.","why":"The ledger is a 250-row ring buffer in browser storage that silently drops history, every fact is attributed to one of three hard-coded names, purge can wipe it, and the code excludes it from sync while the build status says it replicates.","links":["F-PLT-08","F-PLT-06","F-PLT-07","H-PLT-15","H-PLT-11","H-PLT-13","H-APR-02","H-PPL-03","H-SCH-05","T10"],"effort":"L","area":"platform"},"P-PLT-5":{"id":"P-PLT-5","title":"A restore drill that can fail","what":"Restore into a scratch store and compare against the live store; keep backup sets inside the catalog so they replicate; one confirm on every restore path.","why":"The drill compares a store against a deep copy of itself so it always passes and is audited as resilience evidence; backup sets live outside the catalog and never replicate; HR can restore a store with one click and no confirm.","links":["F-PLT-05","H-PLT-10","H-PLT-09","H-SCH-14","T10","T06"],"effort":"M","area":"platform"},"P-PLT-6":{"id":"P-PLT-6","title":"One raw editor, and honest stub labels","what":"Leave the database studio as the only raw editor, behind the identity custody rule, and mark health, integrations, the schedule connector and the platform report stubs as roadmap.","why":"The studio exposes and mutates identity accounts with hashes against the custody rule, delete rights across the scoped editors are broader than their labels, and the integrations screen advertises live single sign-on and a public API while the flags mark them off.","links":["F-PLT-04","F-PLT-09","H-PLT-06","H-PLT-07","H-PLT-16","T05","T12"],"effort":"M","area":"platform"},"X-1":{"id":"X-1","title":"One approval engine: a state machine with scope and stage authority","what":"One request state machine. Each type declares its stages, the scope allowed to decide each stage, and the domain command that runs on approval. Every decide button in every persona calls the same entry point, which refuses a decision from a persona the type does not name and is idempotent on the request id.","why":"The registry already carries a scope field that no code reads, so routing is decided by the screen the decision came from. One Swap id has four decide surfaces, one Overtime id three, one Correction two; the Manager L1 queue is org-wide and the HR inbox is unscoped, and only Claim ever chains L1 to L2.","links":["F-APR-08","H-APR-17","H-APR-07","H-APR-05","H-SCH-10","H-PAY-09","H-TIM-06","H-APR-09","T01"],"effort":"L","area":"cross"},"X-2":{"id":"X-2","title":"An approval is a transaction: the domain store moves or the status does not","what":"Approval runs one command that flips the request row, calls the owning cell's domain command and writes the audit fact together. Any failure leaves all three unchanged.","why":"Approving leave debits no balance and sets no state, approving a correction never touches the punch ledger, approving a profile change alters nothing, the advance state lives in memory while its request row persists, and 'settle via finance' leaves a row pending forever.","links":["F-APR-01","F-APR-03","F-APR-04","H-APR-01","H-APR-08","H-APR-10","H-APR-13","H-APR-20","H-TIM-04","T02"],"effort":"L","area":"cross"},"X-3":{"id":"X-3","title":"One writer per store, behind a cell command API","what":"Each of the fifteen stores names one owning cell. All writes go through that cell's commands. Screens, hooks and imports call commands; nothing calls the generic add and delete path except the Sys Admin database studio.","why":"The people store has four writers, the devices store two personas, the messages store four cells, the leave store is written by the People cell, and the platform flags store by the Identity cell — so the same change behaves differently depending on the screen it came from.","links":["H-PPL-08","H-SCH-07","H-TIM-08","H-COM-07","H-PPL-01","H-IDN-02","H-IDN-20","H-ACC-09","T05"],"effort":"L","area":"cross"},"X-4":{"id":"X-4","title":"Raw editors become export-only; one raw editor remains","what":"Demote My data, Team data, the HR Data manager and the CEO data room to filtered exports with no add, delete or reseed. Keep the Sys Admin database studio as the only raw surface, behind the identity custody rule.","why":"Staff can delete approved requests including overtime that already consumed quota, the manager add form writes any employee row, the HR editor writes four stores directly, and a generic delete removes an employee without offboarding them — an active account with live sessions is left behind.","links":["F-ACC-05","F-ACC-06","F-PLT-04","H-APR-21","H-ACC-11","H-PPL-13","H-PPL-12","H-PLT-07","H-PLT-06","T05","T06"],"effort":"M","area":"cross"},"X-5":{"id":"X-5","title":"The persona scope matrix becomes data the runtime checks","what":"Turn the static roles matrix into the permission table the router, the menus and the commands all read: who may originate, decide, configure and read, at what scope. Manager scope is derived from the session's team, HR from the people and pay domains, CEO is read-only, Sys Admin owns platform, identity and the data layer.","why":"The matrix is static text presented as a decision surface. In the running system a manager creates divisions and hires or fires, a read-only CEO generates and expires reports, HR grants sysadmin scope from a person card, and Manager and HR deep-link into the Sys Admin console.","links":["F-PPL-10","H-PPL-19","H-SCH-06","H-PPL-13","H-ACC-07","H-IDN-08","H-TIM-12","T06"],"effort":"L","area":"cross"},"X-6":{"id":"X-6","title":"HR-doubles-as-Sys-Admin becomes an explicit toggle","what":"On Essential, HR gets an Admin mode switch: off by default, turned on deliberately, audited on entry and exit, and visibly banner-marked while active. Outside it, the identity console, the outbox, one-click restore and the raw editors do not render for HR.","why":"Today the leak is ambient: HR silently renders the full identity console including unlock and force-reset for sysadmin accounts, restores a store with one click and no confirm, reads an outbox with live reset links, and its data manager copy describes itself as the whole DB console.","links":["F-IDN-06","F-SCH-07","F-ACC-05","H-IDN-14","H-SCH-14","H-ACC-10","H-IDN-25","T06"],"effort":"M","area":"cross"},"X-7":{"id":"X-7","title":"Row-level sync with per-row versions, instead of whole-store last-write-wins","what":"Replace the thirty-second whole-store PUT with row-level upserts carrying a row version, and let the server merge. Keep backup sets inside the store catalog so they replicate too.","why":"Two devices editing different rows of the same store lose one side, and this is also the reason a server-side punch writer cannot be added — the browser would overwrite it wholesale.","links":["F-PLT-07","F-TIM-07","H-PLT-14","H-TIM-18","H-PLT-09","T05","T04"],"effort":"L","area":"cross"},"X-8":{"id":"X-8","title":"Session-scoped audit actor, and an append-only ledger","what":"The acting session supplies actor and address to every audit write. The ledger is append-only, uncapped, outside the reach of purge and reset, with a decided replication or export target.","why":"Every fact is attributed to one of three hard-coded names regardless of who acted, the ledger is a 250-row browser ring buffer that silently drops history, purge can wipe it along with the platform registry, and the restore drill compares a store with a copy of itself so it cannot fail.","links":["F-PLT-08","F-PLT-06","H-PLT-15","H-PLT-11","H-PLT-10","H-APR-02","H-PPL-03","H-SCH-05","H-ACC-01","H-PAY-12","T10"],"effort":"M","area":"cross"},"X-9":{"id":"X-9","title":"Identity is an id, never a display name","what":"Key request ownership, member history and team membership on the employee id. Generate request ids from a sequence, not a row count.
